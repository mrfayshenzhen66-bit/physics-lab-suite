<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交流变直流实验室 · 高中生一站式自学</title>
<style>
:root{
  --bg-primary:#0A0A0F; --bg-secondary:#12121A; --bg-tertiary:#1A1A26;
  --glass:rgba(18,18,26,.78); --border:rgba(255,255,255,.07); --border-active:rgba(255,255,255,.16);
  --cyan:#00F0FF; --magenta:#FF2D8F; --lime:#C8FF00; --amber:#FFB800; --violet:#9B4DFF; --emerald:#00E5A0; --orange:#FF6B35;
  --text:#FFF; --text2:rgba(255,255,255,.68); --text3:rgba(255,255,255,.38);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-primary);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% -10%,rgba(0,240,255,.09),transparent 55%),
             radial-gradient(ellipse at 90% 110%,rgba(155,77,255,.06),transparent 50%);}
header{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.hwrap{max-width:1380px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo small{color:var(--text3);font-weight:500;font-size:11px;display:block;letter-spacing:.14em}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{background:transparent;border:1px solid transparent;color:var(--text2);font-size:13px;padding:8px 14px;border-radius:100px;cursor:pointer;transition:all .22s;font-family:inherit;white-space:nowrap}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.05)}
nav.tabs button.on{color:#06121a;font-weight:700;background:var(--ac,#00F0FF);box-shadow:0 0 18px 2px color-mix(in srgb,var(--ac,#00F0FF) 45%,transparent)}
main{max-width:1380px;margin:0 auto;padding:26px 28px 80px;position:relative;z-index:1}
section.tab{display:none;animation:fadeUp .5s cubic-bezier(.22,.9,.3,1)}
section.tab.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.stitle{display:flex;align-items:baseline;gap:14px;margin:6px 0 4px;flex-wrap:wrap}
.stitle h2{font-size:clamp(22px,3vw,30px);font-weight:800}
.stitle .step{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);padding:3px 10px;border-radius:100px;letter-spacing:.1em}
.sdesc{color:var(--text2);font-size:14.5px;line-height:1.8;max-width:960px;margin-bottom:18px}
.sdesc b{color:var(--ac);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media(max-width:980px){.lab{grid-template-columns:1fr}}
.panel{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac,#00F0FF) 55%,transparent),transparent)}
.panel h4{font-size:12px;letter-spacing:.14em;color:var(--text3);text-transform:uppercase;margin-bottom:12px;font-weight:700}
canvas.stage{width:100%;display:block;border-radius:16px;background:#0c0c13;border:1px solid var(--border)}
.ctrl{margin-bottom:16px}.ctrl:last-child{margin-bottom:0}
.ctrl label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text2);margin-bottom:7px}
.ctrl label output{font-family:"JetBrains Mono",monospace;color:var(--ac);font-weight:600}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;background:var(--bg-tertiary);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ac,#00F0FF);box-shadow:0 0 12px color-mix(in srgb,var(--ac,#00F0FF) 55%,transparent);cursor:pointer}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border-active);background:transparent;color:var(--text2);padding:9px 18px;border-radius:100px;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{border-color:var(--ac);color:#fff}
.btn.primary{background:var(--ac);color:#06121a;font-weight:700;border-color:transparent}
.btn.mini{padding:6px 13px;font-size:12px}
.btn.sel{background:color-mix(in srgb,var(--ac) 18%,transparent);border-color:var(--ac);color:#fff}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.ro{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:12px;padding:9px 12px}
.ro .k{font-size:11px;color:var(--text3)}
.ro .v{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:600;color:var(--ac);margin-top:2px}
.knote{margin-top:14px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);border:1px solid var(--border);border-left:3px solid var(--ac);border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.85;color:var(--text2)}
.knote b{color:#fff}
.knote .f{font-family:"JetBrains Mono",monospace;color:var(--ac);background:rgba(0,0,0,.35);padding:1px 7px;border-radius:6px;font-size:12.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--text2);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:20px;height:4px;border-radius:2px;display:inline-block}
footer{border-top:1px solid var(--border);padding:26px;text-align:center;color:var(--text3);font-size:12px;letter-spacing:.08em}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:100px;border:1px solid var(--border-active);color:var(--text3);margin-left:8px;vertical-align:middle}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border-active),transparent);margin:14px 0}
.dstep{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.9;color:var(--text2);opacity:.32;transform:translateX(8px);transition:all .5s;margin-bottom:8px}
.dstep.show{opacity:1;transform:none;border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.dstep .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#06121a;font-weight:800;font-size:11px;margin-right:8px}
.appcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.appcard{background:var(--bg-secondary);border:1px solid var(--border);border-radius:16px;padding:14px 16px;transition:all .25s}
.appcard:hover{border-color:color-mix(in srgb,var(--ac) 40%,transparent);transform:translateY(-3px)}
.appcard .ic{font-size:22px;margin-bottom:8px}
.appcard h5{font-size:13.5px;font-weight:700;margin-bottom:5px;color:#fff}
.appcard p{font-size:12px;color:var(--text2);line-height:1.7}
.bpcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-top:16px}
table.matrix{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px}
table.matrix th,table.matrix td{border:1px solid var(--border);padding:8px 10px;text-align:center;color:var(--text2)}
table.matrix th{background:var(--bg-tertiary);color:#fff;font-weight:600}
table.matrix td:first-child{text-align:left;color:#fff;font-weight:600}
table.matrix td.hit{color:var(--ac);font-weight:800;background:color-mix(in srgb,var(--ac) 10%,transparent)}
table.matrix tr:hover td{border-color:color-mix(in srgb,var(--ac) 35%,transparent)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <a href="../../index.html" style="flex:none;color:#9DB2CE;text-decoration:none;font-size:13px;padding:6px 13px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.04);transition:.2s" onmouseover="this.style.color='#fff';this.style.borderColor='rgba(255,184,0,.5)'" onmouseout="this.style.color='#9DB2CE';this.style.borderColor='rgba(255,255,255,.16)'">⌂ 合集</a>
    <div class="logo"><div>⚡ 交流变直流实验室<small>AC → DC · 高中物理一站式自学</small></div></div>
    <div class="btnrow" id="spdbar" title="动画速度">
      <button class="btn mini sel" data-sp="1">▶ 常速</button>
      <button class="btn mini" data-sp="0.15">🐢 慢动作</button>
      <button class="btn mini" data-sp="0">⏸ 暂停</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main id="main"></main>
<footer>交流变直流 · 交互式教学仿真 · 固定标尺图象 · 人教版选必二衔接</footer>

<script>
/* ========== 全局动画速度（1=常速 0.15=慢动作 0=暂停） ========== */
let SPEED=1;
document.querySelectorAll('#spdbar [data-sp]').forEach(b=>b.onclick=()=>{
  SPEED=+b.dataset.sp;
  document.querySelectorAll('#spdbar [data-sp]').forEach(x=>x.classList.toggle('sel',x===b));
});
/* ========== 分区注册 ========== */
const SECTIONS=[
  {id:'z1',num:'01',name:'交流电是什么',color:'#00F0FF'},
  {id:'z2',num:'02',name:'单相与三相',color:'#9B4DFF'},
  {id:'z3',num:'03',name:'半波整流',color:'#FFB800'},
  {id:'z4',num:'04',name:'桥式全波整流',color:'#C8FF00'},
  {id:'z5',num:'05',name:'滤波与稳压',color:'#00E5A0'},
  {id:'z6',num:'06',name:'特高压直流输电',color:'#FF6B35'},
  {id:'z7',num:'07',name:'生活工业全景',color:'#FF2D8F'},
];
const main=document.getElementById('main'),tabsEl=document.getElementById('tabs');
const loops={};
SECTIONS.forEach(s=>{
  const b=document.createElement('button');
  b.textContent=`${s.num} ${s.name}`;b.style.setProperty('--ac',s.color);
  b.onclick=()=>showTab(s.id);b.dataset.id=s.id;tabsEl.appendChild(b);
  const sec=document.createElement('section');
  sec.className='tab';sec.id='sec-'+s.id;sec.style.setProperty('--ac',s.color);
  main.appendChild(sec);
});
function showTab(id){
  SECTIONS.forEach(s=>{
    document.getElementById('sec-'+s.id).classList.toggle('on',s.id===id);
    document.querySelector(`nav.tabs button[data-id="${s.id}"]`).classList.toggle('on',s.id===id);
    if(loops[s.id]){s.id===id?loops[s.id].start():loops[s.id].stop();}
  });
  window.scrollTo({top:0});
}
/* ========== Canvas 基础工具 ========== */
const TAU=Math.PI*2;
function fitCanvas(cv){
  const dpr=Math.min(window.devicePixelRatio||1,1.5),r=cv.getBoundingClientRect();
  cv.width=Math.max(2,r.width*dpr);cv.height=Math.max(2,r.height*dpr);
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  return {w:r.width,h:r.height,ctx};
}
function makeLoop(id,draw){
  let raf=null,last=performance.now(),lastDraw=0,dirty=true;
  const tick=(now)=>{
    raf=requestAnimationFrame(tick);
    if(now-lastDraw<33)return;              /* 帧率上限 30 FPS */
    if(SPEED===0&&!dirty)return;            /* 暂停且状态未变：零重画 */
    dirty=false;lastDraw=now;
    const dt=Math.min(.05,(now-last)/1000);last=now;draw(now/1000,dt);
  };
  loops[id]={start(){if(!raf){last=performance.now();lastDraw=0;dirty=true;raf=requestAnimationFrame(tick);}},
             stop(){if(raf){cancelAnimationFrame(raf);raf=null;}},
             poke(){dirty=true;}};
}
/* 按需重绘：暂停(SPEED=0)时，滑杆/按钮/拖拽/resize 等交互触发一次重画 */
function pokeActive(){
  const on=document.querySelector('section.tab.on');
  if(on&&loops[on.id.slice(4)])loops[on.id.slice(4)].poke();
}
['input','change','click'].forEach(ev=>document.addEventListener(ev,pokeActive,true));
document.addEventListener('pointermove',e=>{if(e.buttons)pokeActive();},true);
window.addEventListener('resize',pokeActive);
/* 切后台自动暂停所有 rAF，回前台仅恢复当前可见分区 */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){Object.keys(loops).forEach(k=>loops[k].stop());}
  else{const on=document.querySelector('section.tab.on');if(on&&loops[on.id.slice(4)])loops[on.id.slice(4)].start();}
});
function glow(ctx,c,b=10){ctx.shadowColor=c;ctx.shadowBlur=b;}
function noGlow(ctx){ctx.shadowBlur=0;}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function arrow(ctx,x1,y1,x2,y2,color,lw=2,head=7){
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=lw;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-head*Math.cos(a-.45),y2-head*Math.sin(a-.45));
  ctx.lineTo(x2-head*Math.cos(a+.45),y2-head*Math.sin(a+.45));
  ctx.closePath();ctx.fill();
}
function text(ctx,str,x,y,{size=12,color='rgba(255,255,255,.75)',align='left',weight=500,mono=false}={}){
  ctx.fillStyle=color;ctx.font=`${weight} ${size}px ${mono?'"JetBrains Mono",monospace':'"PingFang SC","Microsoft YaHei",sans-serif'}`;
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(str,x,y);
}
function wireSeg(ctx,x1,y1,x2,y2,color='#9aa5b8',lw=3){
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function termDot(ctx,x,y){ctx.fillStyle='#c8ccd6';ctx.beginPath();ctx.arc(x,y,3.2,0,TAU);ctx.fill();}
/* 路径粒子：pts 折线，s 为弧长 */
function pathLen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L;}
function posAt(pts,s){
  let acc=0;
  for(let i=1;i<pts.length;i++){
    const dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1],L=Math.hypot(dx,dy);
    if(s<=acc+L)return [pts[i-1][0]+dx*(s-acc)/L,pts[i-1][1]+dy*(s-acc)/L];
    acc+=L;
  }
  return pts[pts.length-1];
}
function drawParticles(ctx,pts,s0,gap,n,color,r=3){
  const L=pathLen(pts);
  for(let i=0;i<n;i++){
    let s=(s0+i*gap)%L; if(s<0)s+=L;
    const p=posAt(pts,s);
    glow(ctx,color,8);ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(p[0],p[1],r,0,TAU);ctx.fill();noGlow(ctx);
  }
}
/* ========== 拟物元件库 ========== */
function drawBulb(ctx,x,y,r,bright){
  bright=Math.max(0,Math.min(1,bright));
  const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
  g.addColorStop(0,`rgba(255,${230-60*bright|0},${150+80*(1-bright)|0},${.25+.75*bright})`);
  g.addColorStop(1,`rgba(255,190,60,${.06+.2*bright})`);
  if(bright>.03){glow(ctx,'#FFB800',34*bright);}
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();noGlow(ctx);
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();
  ctx.strokeStyle=bright>.03?'#FFE9B0':'rgba(255,255,255,.5)';ctx.lineWidth=1.4;ctx.beginPath();
  ctx.moveTo(x-r*.45,y+r*.6);ctx.lineTo(x-r*.18,y+r*.1);
  for(let i=0;i<=8;i++){ctx.lineTo(x-r*.18+i/8*r*.36,y+r*.1+((i%2)?-1:1)*r*.12);}
  ctx.lineTo(x+r*.45,y+r*.6);ctx.stroke();
  ctx.fillStyle='#8a8f9a';roundRect(ctx,x-r*.32,y+r*.62,r*.64,r*.5,3);ctx.fill();
}
function drawMeter(ctx,x,y,r,val,label,color='#00F0FF'){
  const g=ctx.createRadialGradient(x-r*.3,y-r*.3,2,x,y,r);
  g.addColorStop(0,'#1c2230');g.addColorStop(1,'#0e1119');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=2;glow(ctx,color,7);ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();noGlow(ctx);
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;
  for(let i=-2;i<=2;i++){const a=-Math.PI/2+i*.45;ctx.beginPath();
    ctx.moveTo(x+(r-6)*Math.cos(a),y+(r-6)*Math.sin(a));ctx.lineTo(x+(r-2)*Math.cos(a),y+(r-2)*Math.sin(a));ctx.stroke();}
  const na=-Math.PI/2+Math.max(-1.1,Math.min(1.1,val))*.9;
  arrow(ctx,x,y,x+(r-8)*Math.cos(na),y+(r-8)*Math.sin(na),'#FF2D8F',2,4);
  text(ctx,label,x,y+r*.55,{size:9.5,color:'rgba(255,255,255,.65)',align:'center',weight:700});
}
function drawACBox(ctx,x,y,t){
  ctx.fillStyle='#20242e';roundRect(ctx,x-24,y-22,48,44,7);ctx.fill();
  ctx.strokeStyle='rgba(255,107,53,.55)';ctx.lineWidth=1.6;ctx.stroke();
  ctx.fillStyle='#0a0e14';roundRect(ctx,x-19,y-16,38,26,4);ctx.fill();
  glow(ctx,'#FF6B35',6);ctx.strokeStyle='#FF6B35';ctx.lineWidth=1.8;ctx.beginPath();
  for(let i=0;i<=30;i++){const xx=x-16+i/30*32;const yy=y-3+Math.sin(i/30*TAU*2+t*5)*8;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}
  ctx.stroke();noGlow(ctx);
  text(ctx,'AC',x,y+16,{size:10,color:'#FFB79A',align:'center',weight:800});
}
function drawCapacitor(ctx,x,y,q){
  ctx.strokeStyle='#c8ccd6';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.moveTo(x-6,y-34);ctx.lineTo(x-6,y-20);ctx.moveTo(x+6,y-34);ctx.lineTo(x+6,y-20);ctx.stroke();
  const g=ctx.createLinearGradient(x-16,0,x+16,0);
  g.addColorStop(0,'#12233d');g.addColorStop(.45,'#2c5b9e');g.addColorStop(.6,'#3d74c4');g.addColorStop(1,'#12233d');
  const gl=Math.abs(q);
  if(gl>.05){glow(ctx,'#3d74c4',20*gl);}
  ctx.fillStyle=g;roundRect(ctx,x-16,y-20,32,44,7);ctx.fill();noGlow(ctx);
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(x+9,y-18,4,40);
  ctx.fillStyle='#b9c0cd';ctx.beginPath();ctx.ellipse(x,y-20,16,5,0,0,TAU);ctx.fill();
  text(ctx,'C',x,y+8,{size:13,color:'#fff',align:'center',weight:800});
}
/* 叠片铁芯电感（平波电抗器等用），active 控制辉光 */
function drawInductor(ctx,x,y,active){
  const g=ctx.createLinearGradient(x,y-16,x,y+16);
  g.addColorStop(0,'#4a5060');g.addColorStop(.5,'#79839b');g.addColorStop(1,'#3a4050');
  ctx.fillStyle=g;roundRect(ctx,x-42,y-10,84,20,6);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.35)';
  for(let i=-38;i<=38;i+=6){ctx.beginPath();ctx.moveTo(x+i,y-10);ctx.lineTo(x+i,y+10);ctx.stroke();}
  for(let i=-3;i<=3;i++){
    const lx=x+i*11;
    const cg=ctx.createLinearGradient(lx-5,0,lx+5,0);
    cg.addColorStop(0,'#8a4b1d');cg.addColorStop(.5,'#e89a54');cg.addColorStop(1,'#8a4b1d');
    ctx.strokeStyle=cg;ctx.lineWidth=7;glow(ctx,'#E88B4D',active?7:2);
    ctx.beginPath();ctx.arc(lx,y,15,-Math.PI*0.55,Math.PI*0.55);ctx.stroke();
  }
  noGlow(ctx);
}
/* 二极管（1N4007 拟物）：angle 弧度旋转，on 导通辉光，band 端为阴极 */
function drawDiode(ctx,x,y,on,{angle=0,color='#C8FF00',label=''}={}){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  ctx.strokeStyle='#c8ccd6';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(-16,0);ctx.moveTo(16,0);ctx.lineTo(34,0);ctx.stroke();
  const g=ctx.createLinearGradient(0,-8,0,8);
  g.addColorStop(0,'#3d4048');g.addColorStop(.5,'#17181d');g.addColorStop(1,'#33363e');
  if(on)glow(ctx,color,14);
  ctx.fillStyle=g;roundRect(ctx,-16,-8,32,16,6);ctx.fill();
  ctx.strokeStyle=on?color:'rgba(255,255,255,.25)';ctx.lineWidth=on?1.8:1;ctx.stroke();noGlow(ctx);
  ctx.fillStyle='#b9c0cd';ctx.fillRect(9,-8,5,16);
  ctx.restore();
  if(label)text(ctx,label,x,y-20,{size:10.5,color:'rgba(255,255,255,.65)',align:'center',weight:700});
}
/* EI 叠片变压器：x,y 中心；n1/n2 视觉匝数 */
function drawTransformer(ctx,x,y,s,n1,n2){
  const w=74*s,hh=64*s;
  const g=ctx.createLinearGradient(x,y-hh/2,x,y+hh/2);
  g.addColorStop(0,'#4a5060');g.addColorStop(.5,'#79839b');g.addColorStop(1,'#3a4050');
  ctx.fillStyle=g;roundRect(ctx,x-w/2,y-hh/2,w,hh,6);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;
  for(let i=-w/2+4;i<w/2;i+=5){ctx.beginPath();ctx.moveTo(x+i,y-hh/2);ctx.lineTo(x+i,y+hh/2);ctx.stroke();}
  ctx.fillStyle='#0c0c13';roundRect(ctx,x-w/2+14*s,y-hh/2+12*s,w-28*s,hh-24*s,4);ctx.fill();
  function coil(cx,n){
    for(let i=0;i<n;i++){
      const ly=y-hh/2+16*s+i*(hh-32*s)/Math.max(1,n-1);
      const cg=ctx.createLinearGradient(cx-8*s,0,cx+8*s,0);
      cg.addColorStop(0,'#8a4b1d');cg.addColorStop(.5,'#e89a54');cg.addColorStop(1,'#8a4b1d');
      ctx.strokeStyle=cg;ctx.lineWidth=4.5*s;glow(ctx,'#E88B4D',4);
      ctx.beginPath();ctx.arc(cx,ly,9*s,-Math.PI*.5,Math.PI*.5);ctx.stroke();
    }
    noGlow(ctx);
  }
  coil(x-w/2+8*s,Math.max(2,Math.round(n1)));
  coil(x+w/2-8*s,Math.max(2,Math.round(n2)));
}
/* 桁架输电塔：x 底中心，yB 底部 y，h 高度 */
function drawTower(ctx,x,yB,h,color='#8fa0bd'){
  const bw=h*.34,tw=h*.10,yT=yB-h;
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineCap='round';
  wireSeg(ctx,x-bw/2,yB,x-tw/2,yT,color,2.2);
  wireSeg(ctx,x+bw/2,yB,x+tw/2,yT,color,2.2);
  for(let i=1;i<6;i++){
    const yy=yB-h*i/6,w1=(bw+(tw-bw)*i/6)/2;
    wireSeg(ctx,x-w1,yy,x+w1,yy,color,1.2);
    wireSeg(ctx,x-w1,yy,x+(bw+(tw-bw)*(i-1)/6)/2,yB-h*(i-1)/6,color,1);
    wireSeg(ctx,x+w1,yy,x-(bw+(tw-bw)*(i-1)/6)/2,yB-h*(i-1)/6,color,1);
  }
  const ay1=yT+h*.12,ay2=yT+h*.30,aw=h*.42;
  wireSeg(ctx,x-aw/2,ay1,x+aw/2,ay1,color,2.6);
  wireSeg(ctx,x-aw/2,ay2,x+aw/2,ay2,color,2.6);
  wireSeg(ctx,x,yT-10,x,ay2,color,2);
  wireSeg(ctx,x,yT-10,x-aw/2,ay1,color,1.4);
  wireSeg(ctx,x,yT-10,x+aw/2,ay1,color,1.4);
  [[x-aw/2,ay1],[x+aw/2,ay1],[x-aw/2,ay2],[x+aw/2,ay2]].forEach(p=>{
    for(let k=1;k<=3;k++){ctx.fillStyle='#d8e2f2';ctx.beginPath();ctx.arc(p[0],p[1]+k*5,2.4,0,TAU);ctx.fill();}
  });
  return {up:[x-aw/2,ay1+18,x+aw/2,ay1+18],dn:[x-aw/2,ay2+18,x+aw/2,ay2+18]};
}
/* 换流站阀厅 */
function drawConverter(ctx,x,y,label,sub,color){
  const g=ctx.createLinearGradient(x,y-30,x,y+30);
  g.addColorStop(0,'#2a2f3c');g.addColorStop(1,'#1a1d26');
  ctx.fillStyle=g;roundRect(ctx,x-52,y-30,104,60,8);ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=1.6;glow(ctx,color,6);ctx.stroke();noGlow(ctx);
  text(ctx,'⊟ ⊟ ⊟',x,y-8,{size:13,color,align:'center',weight:700});
  text(ctx,label,x,y+9,{size:11.5,color:'#fff',align:'center',weight:700});
  text(ctx,sub,x,y+24,{size:9.5,color:'rgba(255,255,255,.55)',align:'center'});
}
/* ========== 固定标尺示波器 ========== */
/* cfg: {x,y,w,h,vUp,vDn,tWin,tDiv(s),vDiv,unit} 零线位置按比例 vUp:vDn */
function drawScope(ctx,c){
  const yzero=c.y+c.h*c.vUp/(c.vUp+c.vDn);
  ctx.fillStyle='#0a0d14';roundRect(ctx,c.x,c.y,c.w,c.h,10);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.07)';
  for(let t=c.tDiv;t<c.tWin;t+=c.tDiv){
    const xx=c.x+c.w*t/c.tWin;
    ctx.beginPath();ctx.moveTo(xx,c.y);ctx.lineTo(xx,c.y+c.h);ctx.stroke();
    text(ctx,(t*1000)+'',xx,c.y+c.h+12,{size:9.5,color:'rgba(255,255,255,.4)',align:'center',mono:true});
  }
  for(let v=c.vDiv;v<=c.vUp;v+=c.vDiv){
    const yy=yzero-c.h*v/(c.vUp+c.vDn);
    ctx.beginPath();ctx.moveTo(c.x,yy);ctx.lineTo(c.x+c.w,yy);ctx.stroke();
    text(ctx,'+'+v,c.x-8,yy,{size:9.5,color:'rgba(255,255,255,.4)',align:'right',mono:true});
  }
  for(let v=c.vDiv;v<=c.vDn;v+=c.vDiv){
    const yy=yzero+c.h*v/(c.vUp+c.vDn);
    ctx.beginPath();ctx.moveTo(c.x,yy);ctx.lineTo(c.x+c.w,yy);ctx.stroke();
    text(ctx,'−'+v,c.x-8,yy,{size:9.5,color:'rgba(255,255,255,.4)',align:'right',mono:true});
  }
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(c.x,yzero);ctx.lineTo(c.x+c.w,yzero);ctx.stroke();
  text(ctx,'0',c.x-8,yzero,{size:9.5,color:'rgba(255,255,255,.5)',align:'right',mono:true});
  text(ctx,c.unit+' / 格',c.x+6,c.y+13,{size:10,color:'rgba(255,255,255,.45)',mono:true});
  text(ctx,(c.tDiv*1000)+' ms / 格',c.x+c.w-6,c.y+13,{size:10,color:'rgba(255,255,255,.45)',align:'right',mono:true});
  return yzero;
}
/* 画迹线：fn(t) t∈[0,tWin]，返回是否削顶 */
function trace(ctx,c,yzero,fn,color,{lw=2.4,dash=null}={}){
  let clip=false;
  ctx.strokeStyle=color;ctx.lineWidth=lw;
  if(dash)ctx.setLineDash(dash);
  glow(ctx,color,5);ctx.beginPath();
  for(let px=0;px<=c.w;px+=2){
    const t=px/c.w*c.tWin;
    let v=fn(t);
    if(v>c.vUp){clip=true;v=c.vUp;}if(v<-c.vDn){clip=true;v=-c.vDn;}
    const yy=yzero-c.h*v/(c.vUp+c.vDn);
    px===0?ctx.moveTo(c.x+px,yy):ctx.lineTo(c.x+px,yy);
  }
  ctx.stroke();ctx.setLineDash([]);noGlow(ctx);
  if(clip)text(ctx,'⚠ 超量程削顶',c.x+70,c.y+13,{size:10.5,color:'#FF3B30',weight:700});
  return clip;
}
/* 当前时刻光点：tNow 映射进窗口 */
function scopeDot(ctx,c,yzero,val,tNow,color){
  const px=(tNow%c.tWin)/c.tWin*c.w;
  let v=Math.max(-c.vDn,Math.min(c.vUp,val));
  const yy=yzero-c.h*v/(c.vUp+c.vDn);
  glow(ctx,color,10);ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(c.x+px,yy,3.6,0,TAU);ctx.fill();noGlow(ctx);
}
/* 状态牌（canvas 内胶囊） */
function pill(ctx,x,y,str,ok,color){
  const w=ctx.measureText(str).width+26;
  ctx.fillStyle=ok?color+'22':'rgba(255,60,60,.14)';
  roundRect(ctx,x-w/2,y-12,w,24,12);ctx.fill();
  ctx.strokeStyle=ok?color:'#FF3B30';ctx.lineWidth=1.2;ctx.stroke();
  text(ctx,str,x,y,{size:11.5,color:ok?color:'#FF6B60',align:'center',weight:700});
}
</script>

<script>
/* ========== ZONE 01 交流电是什么 ========== */
(function(){
const sec=document.getElementById('sec-z1');
sec.innerHTML=`
<div class="stitle"><span class="step">ZONE 01</span><h2>交流电是什么：大小方向都在变</h2><span class="badge">人教版选必二 §3.1 交变电流</span></div>

</div>
<div class="appcards">
  <div class="appcard"><div class="ic">🔌</div><h5>墙上的插座</h5><p>我国市电 220V / 50Hz。"220V"是有效值，插头实际承受的电压在 −311V ~ +311V 之间每秒往复 50 次。</p></div>
  <div class="appcard"><div class="ic">🏷️</div><h5>电器铭牌</h5><p>铭牌上"220V~ 50Hz"的"~"就是交流符号。耐压设计必须按峰值 311V 以上考虑，而不是 220V。</p></div>
  <div class="appcard"><div class="ic">🏭</div><h5>为什么电网用交流？</h5><p>交流可以方便地用变压器升压、降压（电磁感应只对变化的电流起作用），发电、输电、用电各环节都灵活。</p></div>
  <div class="appcard"><div class="ic">🔥</div><h5>有效值的意义</h5><p>保险丝发热、电热水壶功率，都按有效值算：220V 交流的发热效果 = 220V 直流。</p></div>
</div>`;
const cv=sec.querySelector('#cv1'),cv1d=sec.querySelector('#cv1d');
let U=220,f=50,stepN=0;
const STEPS=[
 '① 让交流电和直流电分别通过<b>同一个电阻 R</b>，比较它们的发热。',
 '② 交流一个周期 T 内发热：Q<sub>交</sub> = ∫(u²/R)dt，u=Um·sin(ωt)，sin² 的平均值是 ½ → Q<sub>交</sub> = <span class="f">Um²·T / (2R)</span>',
 '③ 直流在同样时间 T 发热：Q<sub>直</sub> = <span class="f">U²·T / R</span>',
 '④ "有效"= 发热效果相同：令 Q<sub>交</sub> = Q<sub>直</sub>，约去 T 和 R → Um²/2 = U²',
 '⑤ ∴ <span class="f">U = Um/√2 ≈ 0.707·Um</span>，代入：311V ÷ √2 = <b>220V</b> ✓'
];
function renderSteps(){
  const box=sec.querySelector('#z1steps');
  box.innerHTML=STEPS.map((s,i)=>`<div class="dstep ${i<stepN?'show':''}"><span class="n">${i+1}</span>${s}</div>`).join('');
}
renderSteps();
sec.querySelector('#z1next').onclick=()=>{stepN=Math.min(5,stepN+1);renderSteps();};
sec.querySelector('#z1reset').onclick=()=>{stepN=0;renderSteps();};
const uS=sec.querySelector('#z1u'),fS=sec.querySelector('#z1f');
uS.oninput=()=>{U=+uS.value;sec.querySelector('#z1uv').textContent=U+' V';markPreset();};
fS.oninput=()=>{f=+fS.value;sec.querySelector('#z1fv').textContent=f+' Hz';};
function markPreset(){sec.querySelectorAll('[data-u]').forEach(b=>b.classList.toggle('sel',+b.dataset.u===U));}
sec.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{U=+b.dataset.u;uS.value=U;sec.querySelector('#z1uv').textContent=U+' V';markPreset();});
const SLOW=0.04; // 机械转动放慢倍数（图象标尺不变）
/* ===== 3D 视角拖拽（双击复位） ===== */
let yaw=0.55,pitch=0.30,dragging=false,lx=0,ly=0;
cv1d.addEventListener('pointerdown',e2=>{dragging=true;lx=e2.clientX;ly=e2.clientY;cv1d.setPointerCapture(e2.pointerId);cv1d.style.cursor='grabbing';});
cv1d.addEventListener('pointermove',e2=>{if(!dragging)return;yaw+=(e2.clientX-lx)*0.008;pitch=Math.max(-1.25,Math.min(1.25,pitch+(e2.clientY-ly)*0.008));lx=e2.clientX;ly=e2.clientY;});
cv1d.addEventListener('pointerup',()=>{dragging=false;cv1d.style.cursor='grab';});
cv1d.addEventListener('pointercancel',()=>{dragging=false;cv1d.style.cursor='grab';});
cv1d.addEventListener('dblclick',()=>{yaw=0.55;pitch=0.30;});
function draw(t){
  const te=t*SLOW*SPEED, th=TAU*f*te; // 线圈角（c1 从正上方起，顺时针）
  const e=Math.SQRT2*U*Math.cos(th);
  drawGen1(th,e);
  drawScope1(te,e);
}
/* ===== ① 交流发电机 3D 模型（与 ZONE 02 同款轻量 3D 引擎，画家算法） ===== */
function drawGen1(th,e){
  const {w,h,ctx}=fitCanvas(cv1d);
  ctx.clearRect(0,0,w,h);
  const cx=w*0.38,cy=h*0.52,S=Math.min(w,h)*0.20,PERSP=6;
  const cyw=Math.cos(yaw),syw=Math.sin(yaw),cpt=Math.cos(pitch),spt=Math.sin(pitch);
  const view=p=>{
    const x= p[0]*cyw+p[2]*syw;
    const z1=-p[0]*syw+p[2]*cyw;
    return [x,p[1]*cpt-z1*spt,p[1]*spt+z1*cpt];
  };
  const proj=p=>{const v=view(p),fp=PERSP/(PERSP+v[2]);return [cx+v[0]*fp*S,cy-v[1]*fp*S];};
  const items=[];
  const dep=pts=>pts.reduce((a,p)=>a+view(p)[2],0)/pts.length;
  function poly(pts,fill,stroke,lw=1){
    items.push({d:dep(pts),fn(){
      ctx.beginPath();
      pts.forEach((p,i)=>{const q=proj(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});
      ctx.closePath();
      if(fill){ctx.fillStyle=fill;ctx.fill();}
      if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
    }});
  }
  function line3(pts,color,lw=1.5,gl=null,dash=null){
    items.push({d:dep(pts),fn(){
      ctx.beginPath();
      pts.forEach((p,i)=>{const q=proj(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});
      if(dash)ctx.setLineDash(dash);if(gl)glow(ctx,gl.c,gl.b);
      ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
      ctx.setLineDash([]);noGlow(ctx);
    }});
  }
  function arrow3(p0,p1,color,lw=1.6){
    items.push({d:dep([p0,p1]),fn(){
      const a=proj(p0),b=proj(p1);
      arrow(ctx,a[0],a[1],b[0],b[1],color,lw,6);
    }});
  }
  const LV=[-0.42,0.72,-0.56],ln=Math.hypot(-0.42,0.72,-0.56);LV[0]/=ln;LV[1]/=ln;LV[2]/=ln;
  function sh(c,n,k=1){
    const v=view(n);
    let d=Math.max(0,v[0]*LV[0]+v[1]*LV[1]+v[2]*LV[2]);
    d=(0.48+0.52*d)*k;
    return `rgb(${Math.min(255,c[0]*d)|0},${Math.min(255,c[1]*d)|0},${Math.min(255,c[2]*d)|0})`;
  }
  const Um=Math.SQRT2*U,hot=Math.abs(e)/(Um||1);
  /* ---- 机座 ---- */
  poly([[-1.60,-1.97,-0.95],[1.60,-1.97,-0.95],[1.60,-1.97,0.95],[-1.60,-1.97,0.95]],sh([52,58,72],[0,1,0],1.15),null);
  poly([[-1.60,-2.30,0.95],[1.60,-2.30,0.95],[1.60,-1.97,0.95],[-1.60,-1.97,0.95]],sh([52,58,72],[0,0,1]),null);
  poly([[-1.60,-2.30,-0.95],[-1.60,-2.30,0.95],[-1.60,-1.97,0.95],[-1.60,-1.97,-0.95]],sh([52,58,72],[-1,0,0]),null);
  poly([[1.60,-2.30,-0.95],[1.60,-2.30,0.95],[1.60,-1.97,0.95],[1.60,-1.97,-0.95]],sh([52,58,72],[1,0,0]),null);
  /* ---- 磁极：N 上（红）/ S 下（蓝），各 6 面 ---- */
  function box(x0,x1,y0,y1,z0,z1,base){
    poly([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],sh(base,[0,1,0],1.12),null);
    poly([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],sh(base,[0,-1,0]),null);
    poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],sh(base,[0,0,1]),'rgba(0,0,0,.25)',0.6);
    poly([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],sh(base,[0,0,-1]),null);

    poly([[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],sh(base,[1,0,0]),null);
  }
  box(-1.45,1.45,1.53,1.97,-0.85,0.85,[201,42,42]);
  box(-1.45,1.45,-1.97,-1.53,-0.85,0.85,[28,109,217]);
  /* ---- 磁感线（N→S 向下，8 束） ---- */

  /* ---- 中性面（水平半透明面：线圈边到左右时 v∥B，e=0） ---- */

    }
  }
  /* ---- 滑环（黄铜）+ 电刷（碳块 + 接线柱） ---- */

    poly([[-0.07,0.26,rz-0.07],[0.07,0.26,rz-0.07],[0.07,0.26,rz+0.07],[-0.07,0.26,rz+0.07]],sh([40,42,48],[0,-1,0]),null);
    poly([[-0.07,0.44,rz-0.07],[0.07,0.44,rz-0.07],[0.07,0.44,rz+0.07],[-0.07,0.44,rz+0.07]],sh([58,60,68],[0,1,0],1.1),null);
    poly([[-0.07,0.26,rz+0.07],[0.07,0.26,rz+0.07],[0.07,0.44,rz+0.07],[-0.07,0.44,rz+0.07]],sh([40,42,48],[0,0,1]),null);
    poly([[-0.07,0.26,rz-0.07],[0.07,0.26,rz-0.07],[0.07,0.44,rz-0.07],[-0.07,0.44,rz-0.07]],sh([40,42,48],[0,0,-1]),null);

  line3([[c1[0],c1[1],-0.75],[c1[0],c1[1],0.75]],'#E88B4D',lwC,gl);

  // 线圈 → 滑环引线（随线圈一起转）
  line3([[c1[0],c1[1],0.75],[0.26*Math.sin(th),0.26*Math.cos(th),1.05]],'#E88B4D',2.2);
  line3([[c2[0],c2[1],0.75],[-0.26*Math.sin(th),-0.26*Math.cos(th),1.35]],'#E88B4D',2.2);
  /* ---- 电流方向箭头（e≥0：c1 电流流向 +z） ---- */
  const dir=e>=0?1:-1;
  arrow3([c1[0],c1[1],-0.28*dir],[c1[0],c1[1],0.28*dir],'rgba(255,243,191,.9)',2);
  arrow3([c2[0],c2[1],0.28*dir],[c2[0],c2[1],-0.28*dir],'rgba(255,243,191,.9)',2);
  /* ---- v 分解：v⊥（切割，琥珀粗箭）/ v∥（平行 B，灰虚线）/ v 合速度（白细箭） ---- */
  const vx=Math.cos(th)*0.85,vy=-Math.sin(th)*0.85;

  noGlow(ctx);
  /* ---- 外电路：电刷 → 灯泡（2D 走线接到 3D 投影点） ---- */

  termDot(ctx,pB1[0]+34,pB1[1]+14);termDot(ctx,pB2[0]+50,pB2[1]+30);
  termDot(ctx,bx,by-30);termDot(ctx,bx,by+34);
  const bright=(e/(Math.SQRT2*400))**2*3;
  drawBulb(ctx,bx,by,24,bright);
  text(ctx,'灯泡亮度 ∝ 实际功率 ∝ e²',bx,by+48,{size:10.5,color:'rgba(255,255,255,.5)',align:'center'});
  drawMeter(ctx,bx,h*0.66,30,U/400*0.95,'V~ 有效值','#00F0FF');
}
function drawScope1(te,e){
  const {w,h,ctx}=fitCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const sc={x:70,y:h*0.18,w:w-115,h:h*0.58,vUp:400,vDn:400,vDiv:100,tWin:0.04,tDiv:0.01,unit:'V'};
  text(ctx,'② 电动势 e(t) 波形 — 与 ① 线圈共用同一转角 θ — 固定标尺',sc.x,sc.y-9,{size:11.5,color:'rgba(255,255,255,.6)',weight:700});
  const yz=drawScope(ctx,sc);
  const Um=Math.SQRT2*U,om=TAU*f;
  trace(ctx,sc,yz,tt=>Um*Math.cos(om*tt),'#00F0FF');
  scopeDot(ctx,sc,yz,e,te,'#00F0FF');
  if(Math.abs(e)>Um*0.985){
    const px=sc.x+(te%sc.tWin)/sc.tWin*sc.w;
    const vv=Math.max(-sc.vDn,Math.min(sc.vUp,e));

    text(ctx,e>0?'▲ 正向峰值':'▼ 负向峰值',Math.max(sc.x+44,Math.min(sc.x+sc.w-44,px)),yy+(e>0?-13:13),{size:10.5,color:'#00F0FF',align:'center',weight:800});
  }
  // 读数
  sec.querySelector('#z1um').textContent=Um.toFixed(0)+' V';
  sec.querySelector('#z1ur').textContent=U+' V';
  sec.querySelector('#z1t').textContent=(1/f*1000).toFixed(1)+' ms';
  sec.querySelector('#z1e').textContent=(e>=0?'+':'')+e.toFixed(0)+' V';
}
makeLoop('z1',draw);
})();

/* ===== ① 三相发电机 3D 模型：自制轻量 3D 渲染（无外部库），画家算法深度排序 ===== */
function drawGen(ph,emf){
  const {w,h,ctx}=fitCanvas(cv3d);

function drawScopes(te,emf){

      const vv=Math.max(-sc1.vDn,Math.min(sc1.vUp,emf[k]));
      const yy=yz1-sc1.h*vv/(sc1.vUp+sc1.vDn);
      text(ctx,emf[k]>0?('▲ '+PN[k]+' 相冲顶'):('▼ '+PN[k]+' 相负向峰值'),Math.max(sc1.x+48,Math.min(sc1.x+sc1.w-48,px)),yy+(emf[k]>0?-14:14),{size:10.5,color:PCOL[k],align:'center',weight:800});
    }
  }
  /* 线电压 u12 = uL1 − uL2：峰值 √3×311 = 539V → 有效值 380V */
  if(showLine){
    trace(ctx,sc1,yz1,tt=>311*(Math.sin(TAU*50*tt)-Math.sin(TAU*50*tt-TAU/3)),'rgba(255,255,255,.85)',{lw:1.8,dash:[7,5]});
    scopeDot(ctx,sc1,yz1,emf[0]-emf[1],te,'#fff');
    text(ctx,'白虚线 u12 = uL1−uL2：两相相位差 120°，矢量差幅值 ×√3 → 峰值 539V，有效值 = 539/√2 = 380V',sc1.x+sc1.w-10,sc1.y+28,{size:10.5,color:'rgba(255,255,255,.8)',align:'right',weight:700});
  }
  const u12=emf[0]-emf[1];
  sec.querySelector('#z2u12').textContent=(u12>=0?'+':'')+u12.toFixed(0)+' V';
  /* ===== ③ 瞬时功率对比 ===== */
  const sc2={x:70,y:h*0.63,w:w-115,h:h*0.27,vUp:20,vDn:4,vDiv:5,tWin:0.04,tDiv:0.01,unit:'kW'};
  text(ctx,'③ 瞬时功率对比：为什么三相电机更稳 — 固定标尺',sc2.x,sc2.y-8,{size:11.5,color:'rgba(255,255,255,.6)',weight:700});
  const yz2=drawScope(ctx,sc2);
  trace(ctx,sc2,yz2,tt=>P*(1-Math.cos(2*TAU*50*tt)),'rgba(255,255,255,.65)',{lw:2});
  trace(ctx,sc2,yz2,()=>P,'#C8FF00',{lw:2.8});
  text(ctx,'单相：0 ~ 2P 脉动',sc2.x+sc2.w*0.375,yz2-2*P*(sc2.h/24)-14,{size:10,color:'rgba(255,255,255,.65)',align:'center'});
  text(ctx,'三相合成：恒等于 P',sc2.x+sc2.w-10,yz2-P*(sc2.h/24)-12,{size:10,color:'#C8FF00',align:'right'});
  sec.querySelector('#z2pt').textContent=P.toFixed(1)+' kW（恒定）';
}
makeLoop('z2',draw);
})();
</script>

<script>
/* ========== ZONE 03 半波整流 ========== */
(function(){
const sec=document.getElementById('sec-z3');
sec.innerHTML=`
<div class="stitle"><span class="step">ZONE 03</span><h2>半波整流：二极管"砍掉"负半周</h2><span class="badge">人教版选必二 §5.1 传感器 · 二极管单向导电性</span></div>
<p class="sdesc">二极管像一扇<b>单向阀门</b>：正向电压导通，反向电压截止。把它串进交流电路，<b>正半周电流通过，负半周被"砍掉"</b>，负载上就得到方向不变、但忽有忽无的脉动直流。观察：负半周二极管截止时，灯泡熄灭、导线中粒子停止流动。代价是<b>浪费了一半的电能</b>。右侧透视窗把二极管放大成一扇<b>单向阀</b>：正向电压把阀板冲开（电流通过），反向电压把阀板压死（电流阻断）——这就是单向导电性。</p>
<div class="lab">
  <div class="panel"><h4>半波整流电路 + 二极管单向阀透视 + 波形（固定标尺）</h4>
    <canvas class="stage" id="cv3" style="aspect-ratio:16/11.8"></canvas>
    <div class="legend">
      <span><i style="background:rgba(255,255,255,.55)"></i>输入交流 u</span>
      <span><i style="background:#FFB800"></i>输出脉动直流 uR（只有正半周）</span>
      <span><i style="background:#FFB800"></i>电流粒子与流动箭头（导通时）</span>
      <span><i style="background:rgba(255,80,80,.5)"></i>被砍掉的负半周</span>
    </div>
  </div>
  <div class="panel"><h4>控制台</h4>
    <div class="ctrl"><label>输入电压有效值 U<output id="z3uv">220 V</output></label><input type="range" id="z3u" min="50" max="400" value="220" step="5"></div>
    <div class="readout">
      <div class="ro"><div class="k">输入峰值 Um</div><div class="v" id="z3um">—</div></div>
      <div class="ro"><div class="k">输出平均值 ≈0.45U</div><div class="v" id="z3avg">—</div></div>
      <div class="ro"><div class="k">输出脉动频率</div><div class="v">50 Hz</div></div>
      <div class="ro"><div class="k">二极管当前状态</div><div class="v" id="z3st">—</div></div>
    </div>
    <div class="knote"><b>二极管怎么看方向？</b><br>实物上一端有<b>银色环带</b>，那是<b>负极（阴极）</b>。电流只能从另一端（阳极）流入、环带端流出——舞台里环带朝右，所以正半周（上端为 +）导通。</div>
    <div class="knote"><b>输出平均值怎么算？</b><br>正弦正半周的平均高度是 <span class="f">2Um/π</span>，负半周为 0，整周期平均：<span class="f">U<sub>avg</sub> = Um/π ≈ 0.45·U<sub>有效</sub></span>。剩下一半周期负载完全断电——这就是半波整流效率低的原因。</div>
  </div>
</div>
<div class="appcards">
  <div class="appcard"><div class="ic">🔦</div><h5>老式手电充电器</h5><p>最便宜的充电电路就是一只二极管半波整流：结构简单、成本低，代价是充电慢、效率低。</p></div>
  <div class="appcard"><div class="ic">🌡️</div><h5>电热毯调温档</h5><p>部分电热毯的"低档"就是串一只二极管：只用半波加热，功率大约减半——成本不到一元钱。</p></div>
  <div class="appcard"><div class="ic">🔋</div><h5>电池涓流充电</h5><p>对充电速度无要求的场合（应急灯电池），半波整流 + 限流电阻就能胜任。</p></div>
  <div class="appcard"><div class="ic">📏</div><h5>信号检波</h5><p>收音机把高频调幅信号"切掉一半"取出声音信号，用的也是二极管单向导电的原理。</p></div>
</div>`;
const cv=sec.querySelector('#cv3');
let U=220;
const uS=sec.querySelector('#z3u');
uS.oninput=()=>{U=+uS.value;sec.querySelector('#z3uv').textContent=U+' V';};
const SLOW=0.04;
/* 沿路径的流动箭头（电流方向可视化） */
function flowChevrons(ctx,pts,s0,gap,color){
  const L=pathLen(pts);
  for(let s=(s0%gap);s<L;s+=gap){
    const p1=posAt(pts,s),p2=posAt(pts,Math.min(L,s+4));
    const a=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]);
    ctx.save();ctx.translate(p1[0],p1[1]);ctx.rotate(a);
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-3,-4);ctx.lineTo(3,0);ctx.lineTo(-3,4);ctx.stroke();
    ctx.restore();
  }
}
function draw(t){
  const {w,h,ctx}=fitCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const te=t*SLOW*SPEED, stm=t*SPEED, ph=TAU*50*te;
  const Um=Math.SQRT2*U, u=Um*Math.sin(ph);
  const on=u>0;
  /* ================= 左侧：半波整流电路 ================= */
  const x0=90,x1=w*0.585,y0=64,y1=h*0.475,cy=(y0+y1)/2;
  const dx=(x0+x1)/2;
  const wc='#9aa5b8', ac='#FFB800'; // 导线基色 / 导通高亮色
  const cur=on?ac:wc;
  // 左竖线（留 AC 盒口）
  wireSeg(ctx,x0,y0,x0,cy-24,cur);wireSeg(ctx,x0,cy+24,x0,y1,wc);
  // 顶线（留二极管口）
  wireSeg(ctx,x0,y0,dx-38,y0,cur);wireSeg(ctx,dx+38,y0,x1,y0,cur);
  // 右竖线（留灯泡口）
  wireSeg(ctx,x1,y0,x1,cy-30,cur);wireSeg(ctx,x1,cy+34,x1,y1,cur);
  // 底线
  wireSeg(ctx,x1,y1,x0,y1,cur);
  termDot(ctx,x0,y0);termDot(ctx,x1,y0);termDot(ctx,x1,y1);termDot(ctx,x0,y1);
  // AC 电源盒 + 瞬时极性
  drawACBox(ctx,x0,cy,te*2);
  text(ctx,u>0?'+':'−',x0+16,cy-30,{size:14,color:u>0?'#FF8B8B':'#8BB8FF',weight:800});
  text(ctx,u>0?'−':'+',x0+16,cy+32,{size:14,color:u>0?'#8BB8FF':'#FF8B8B',weight:800});
  text(ctx,'~ 50Hz',x0-2,cy+46,{size:9.5,color:'rgba(255,255,255,.4)',align:'center'});
  // 二极管（顶线中点，环带=阴极朝右）
  drawDiode(ctx,dx,y0,on,{color:'#FFB800',label:'D（1N4007）'});
  pill(ctx,dx,y0-40,on?'✓ 正向导通':'✗ 反向截止',on,'#FFB800');
  // 灯泡（右竖线）
  drawBulb(ctx,x1,cy,24,on?(u/311)*(u/311):0);
  text(ctx,'负载 R',x1+16,cy+44,{size:10.5,color:'rgba(255,255,255,.5)',align:'center'});
  // 电流：导通时粒子+流动箭头；截止时粒子堵在二极管前
  if(on){
    const pts=[[x0,cy-26],[x0,y0],[dx-40,y0],[dx+40,y0],[x1,y0],[x1,cy-32],[x1,cy+36],[x1,y1],[x0,y1],[x0,cy+26]];
    drawParticles(ctx,pts,(stm*160*(u/Um))%pathLen(pts),26,Math.round(pathLen(pts)/26),ac,3);
    flowChevrons(ctx,pts,(stm*160*(u/Um))%70,70,'rgba(255,184,0,.9)');
  }else{
    for(let i=0;i<4;i++){
      glow(ctx,'#FF6B60',6);ctx.fillStyle='#FF6B60';
      ctx.beginPath();ctx.arc(dx-46-i*12,y0,3,0,TAU);ctx.fill();noGlow(ctx);
    }
    text(ctx,'✗',dx-32,y0-14,{size:13,color:'#FF6B60',weight:800,align:'center'});
    text(ctx,'负半周：阀门关闭，全路无电流',(x0+x1)/2,y1+22,{size:11,color:'#FF6B60',align:'center'});
  }
  /* ================= 右侧：二极管单向阀透视窗 ================= */
  const vx0=w*0.655,vx1=w-24,vy0=64,vy1=h*0.475;
  ctx.fillStyle='#10131b';roundRect(ctx,vx0,vy0,vx1-vx0,vy1-vy0,14);ctx.fill();
  ctx.strokeStyle=on?'rgba(255,184,0,.5)':'rgba(255,80,80,.45)';ctx.lineWidth=1.4;ctx.stroke();
  const vmx=(vx0+vx1)/2;
  text(ctx,'二极管 = 单向阀门（放大透视）',vmx,vy0+20,{size:11.5,color:'rgba(255,255,255,.65)',align:'center',weight:700});
  // 大二极管外形（银环=阴极）
  const dw=(vx1-vx0)*0.34,dy=vy0+64;
  wireSeg(ctx,vx0+14,dy,vmx-dw,dy,'#c8ccd6',2.6);
  wireSeg(ctx,vmx+dw,dy,vx1-14,dy,'#c8ccd6',2.6);
  const dg=ctx.createLinearGradient(0,dy-15,0,dy+15);
  dg.addColorStop(0,'#3d4048');dg.addColorStop(.5,'#17181d');dg.addColorStop(1,'#33363e');
  if(on)glow(ctx,'#FFB800',14);
  ctx.fillStyle=dg;roundRect(ctx,vmx-dw,dy-15,dw*2,30,8);ctx.fill();
  ctx.strokeStyle=on?'#FFB800':'rgba(255,255,255,.3)';ctx.lineWidth=1.4;ctx.stroke();noGlow(ctx);
  ctx.fillStyle='#b9c0cd';ctx.fillRect(vmx+dw-14,dy-15,9,30);
  text(ctx,'银环',vmx+dw-9,dy-27,{size:9.5,color:'#b9c0cd',align:'center'});
  text(ctx,'阳极 A',vmx-dw,dy+31,{size:10.5,color:'#FF8B8B',align:'center',weight:700});
  text(ctx,'阴极 K',vmx+dw-9,dy+31,{size:10.5,color:'#8BB8FF',align:'center',weight:700});
  // 阀室：通道 + 铰链挡板
  const gy=vy0+158,gw2=(vx1-vx0)*0.36,gh=46;
  ctx.fillStyle='#0a0d14';roundRect(ctx,vmx-gw2,gy-gh/2,gw2*2,gh,8);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1.2;ctx.stroke();
  ctx.save();ctx.translate(vmx,gy-gh/2+3);
  ctx.rotate(on?-1.35:0.06); // 导通：挡板被冲开贴顶；截止：垂下关死
  const fg=ctx.createLinearGradient(0,0,0,gh-8);
  fg.addColorStop(0,'#79839b');fg.addColorStop(1,'#4a5060');
  ctx.fillStyle=fg;roundRect(ctx,-4,0,8,gh-10,3);ctx.fill();
  ctx.strokeStyle=on?'#FFB800':'#FF6B60';ctx.lineWidth=1.4;ctx.stroke();
  ctx.restore();
  ctx.fillStyle='#565f75';ctx.beginPath();ctx.arc(vmx,gy-gh/2+3,3.5,0,TAU);ctx.fill();
  if(on){
    for(let i=0;i<8;i++){
      const px=vmx-gw2+((stm*130+i*34)%(gw2*2));
      glow(ctx,'#FFB800',7);ctx.fillStyle='#FFB800';
      ctx.beginPath();ctx.arc(px,gy,3,0,TAU);ctx.fill();noGlow(ctx);
    }
    arrow(ctx,vmx-gw2+14,gy-gh/2-13,vmx+gw2-14,gy-gh/2-13,'#FFB800',2,6);
    text(ctx,'正向电压 → 阀板被冲开，电流通过',vmx,gy+gh/2+18,{size:10.5,color:'#C8FF00',align:'center',weight:700});
  }else{
    for(let i=0;i<5;i++){
      glow(ctx,'#FF6B60',6);ctx.fillStyle='#FF6B60';
      ctx.beginPath();ctx.arc(vmx-11-(i%3)*11,gy-7+Math.floor(i/3)*14,3,0,TAU);ctx.fill();noGlow(ctx);
    }
    text(ctx,'反向电压 → 阀板被压死，电流阻断',vmx,gy+gh/2+18,{size:10.5,color:'#FF6B60',align:'center',weight:700});
  }
  text(ctx,'电流只允许 A → K（阳极进、银环端出）',vmx,vy1-12,{size:9.5,color:'rgba(255,255,255,.45)',align:'center'});
  /* ================= 下部：示波器 ================= */
  const sc={x:70,y:h*0.56,w:w-115,h:h*0.35,vUp:400,vDn:400,vDiv:100,tWin:0.04,tDiv:0.01,unit:'V'};
  text(ctx,'输入 u（灰）与输出 uR（橙）— 红色区域 = 被砍掉的负半周（浪费一半电能）— 固定标尺',sc.x,sc.y-9,{size:11.5,color:'rgba(255,255,255,.6)',weight:700});
  const yz=drawScope(ctx,sc);
  // 被砍掉的负半周区域填充
  ctx.fillStyle='rgba(255,80,80,.10)';
  ctx.beginPath();ctx.moveTo(sc.x,yz);
  for(let px=0;px<=sc.w;px+=2){
    const tt=px/sc.w*sc.tWin,v=Math.min(0,Um*Math.sin(TAU*50*tt));
    ctx.lineTo(sc.x+px,yz-sc.h*v/(sc.vUp+sc.vDn));
  }
  ctx.lineTo(sc.x+sc.w,yz);ctx.closePath();ctx.fill();
  trace(ctx,sc,yz,tt=>Um*Math.sin(TAU*50*tt),'rgba(255,255,255,.55)',{lw:1.8});
  trace(ctx,sc,yz,tt=>Math.max(0,Um*Math.sin(TAU*50*tt)),'#FFB800',{lw:2.6});
  scopeDot(ctx,sc,yz,u,te,'rgba(255,255,255,.8)');
  scopeDot(ctx,sc,yz,Math.max(0,u),te,'#FFB800');
  sec.querySelector('#z3um').textContent=Um.toFixed(0)+' V';
  sec.querySelector('#z3avg').textContent=(0.45*U).toFixed(0)+' V';
  const st=sec.querySelector('#z3st');
  st.textContent=on?'导通 ✓':'截止 ✗';st.style.color=on?'#C8FF00':'#FF6B60';
}
makeLoop('z3',draw);
})();
</script>

<script>
/* ========== ZONE 04 桥式全波整流 ========== */
(function(){
const sec=document.getElementById('sec-z4');
sec.innerHTML=`
<div class="stitle"><span class="step">ZONE 04</span><h2>桥式全波整流：四只二极管"翻转"负半周</h2><span class="badge">人教版选必二 §5.1 应用 · 全波整流</span></div>
<p class="sdesc">四只二极管搭成电桥：<b>正半周 D1、D4 导通，负半周 D2、D3 导通</b>，两班轮流上岗。神奇的是：无论输入是正半周还是负半周，<b>流过灯泡的电流方向始终不变</b>（从上往下）——负半周被"翻转"了上来，输出是连续的全波脉动直流，电能利用率翻倍，脉动频率变成 <b>100Hz</b>。每条桥臂上的<b>白色小箭头</b>标出那只二极管唯一允许的电流方向：导通的发光（✓）、粒子流过，截止的打 ⊘。跟着箭头走一遍，就明白负半周为什么能被"翻转"。</p>
<div class="lab">
  <div class="panel"><h4>桥式整流电路（放大版 · 臂上小箭头=各二极管唯一允许的电流方向）+ 波形（固定标尺）</h4>
    <canvas class="stage" id="cv4" style="aspect-ratio:16/13"></canvas>
    <div class="legend">
      <span><i style="background:#C8FF00"></i>正半周电流路径（D1·D4）</span>
      <span><i style="background:#00F0FF"></i>负半周电流路径（D2·D3）</span>
      <span><i style="background:rgba(255,255,255,.55)"></i>输入交流</span>
      <span><i style="background:#C8FF00"></i>输出全波脉动直流</span>
      <span><i style="background:rgba(255,255,255,.7)"></i>臂上小箭头 = 二极管允许方向</span>
      <span><i style="background:rgba(0,240,255,.5)"></i>被翻转的负半周</span>
    </div>
  </div>
  <div class="panel"><h4>控制台</h4>
    <div class="ctrl"><label>输入电压有效值 U<output id="z4uv">220 V</output></label><input type="range" id="z4u" min="50" max="400" value="220" step="5"></div>
    <div class="readout">
      <div class="ro"><div class="k">输出平均值 ≈0.9U</div><div class="v" id="z4avg">—</div></div>
      <div class="ro"><div class="k">输出脉动频率</div><div class="v">100 Hz</div></div>
      <div class="ro"><div class="k">当前导通二极管</div><div class="v" id="z4st">—</div></div>
      <div class="ro"><div class="k">负载电流方向</div><div class="v">始终向下 ↓</div></div>
    </div>
    <div class="knote"><b>怎么记导通组合？</b><br>电流从"<b>+</b>"角出发，总是沿"<b>能上则上</b>"的二极管爬到输出 + 端；从输出 − 端再沿"<b>能回则回</b>"的二极管回到"−"角。对角线上的两只同时导通：<span class="f">正半周 D1·D4，负半周 D2·D3</span>。</div>
    <div class="knote"><b>输出平均值</b>：负半周被完整翻转上来，平均值翻倍：<span class="f">U<sub>avg</sub> = 2Um/π ≈ 0.90·U<sub>有效</sub></span>。实物里四只二极管常封装成一颗"整流桥堆"，四个引脚：两个 ~ 接交流，+ − 出直流。</div>
  </div>
</div>
<div class="appcards">
  <div class="appcard"><div class="ic">📱</div><h5>手机充电器前端</h5><p>充电器拆开，220V 进来第一关就是整流桥堆：先把交流变成脉动直流，再交给后面的电路处理。</p></div>
  <div class="appcard"><div class="ic">🚗</div><h5>电动车充电桩</h5><p>直流快充桩的核心就是把三相交流整流成可调直流，功率可达几十到几百千瓦。</p></div>
  <div class="appcard"><div class="ic">⚡</div><h5>电焊机</h5><p>直流电焊机电弧稳定、飞溅小，靠的就是整流桥把交流变成直流再供给焊枪。</p></div>
  <div class="appcard"><div class="ic">💡</div><h5>LED 驱动电源</h5><p>LED 灯珠只吃直流，家用 LED 灯泡内部都有一块微型整流滤波电路板。</p></div>
</div>`;
const cv=sec.querySelector('#cv4');
let U=220;
const uS=sec.querySelector('#z4u');
uS.oninput=()=>{U=+uS.value;sec.querySelector('#z4uv').textContent=U+' V';};
const SLOW=0.04;
/* 沿路径的流动箭头（电流方向可视化） */
function flowChevrons(ctx,pts,s0,gap,color){
  const L=pathLen(pts);
  for(let s=(s0%gap);s<L;s+=gap){
    const p1=posAt(pts,s),p2=posAt(pts,Math.min(L,s+4));
    const a=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]);
    ctx.save();ctx.translate(p1[0],p1[1]);ctx.rotate(a);
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-3,-4);ctx.lineTo(3,0);ctx.lineTo(-3,4);ctx.stroke();
    ctx.restore();
  }
}
function draw(t){
  const {w,h,ctx}=fitCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const te=t*SLOW*SPEED, stm=t*SPEED, ph=TAU*50*te;
  const Um=Math.SQRT2*U, u=Um*Math.sin(ph);
  const pos=u>0, neg=u<0;
  const C1='#C8FF00',C2='#00F0FF',WC='rgba(154,165,184,.55)';
  /* ---- 几何（放大版菱形桥） ---- */
  const mx=w*0.35,my=h*0.315;
  const Lx=mx-150,Rx=mx+150,Ty=my-125,By=my+125;
  const top=my-172,bot=my+172,acB=my+198,bulbX=mx+310,bx=mx-255;
  const on=pos?C1:C2;
  /* ---- 全部导线（灰底） ---- */
  // 四条桥臂（留二极管口：30%~70%）
  const arms=[[Lx,my,mx,Ty],[Rx,my,mx,Ty],[mx,By,Lx,my],[mx,By,Rx,my]];
  arms.forEach(([ax,ay,bx2,by2])=>{
    wireSeg(ctx,ax,ay,ax+(bx2-ax)*0.30,ay+(by2-ay)*0.30,WC);
    wireSeg(ctx,ax+(bx2-ax)*0.70,ay+(by2-ay)*0.70,bx2,by2,WC);
  });
  // 输出侧：T 上→顶轨→灯泡→底回→B
  wireSeg(ctx,mx,Ty,mx,top,WC);wireSeg(ctx,mx,top,bulbX,top,WC);
  wireSeg(ctx,bulbX,top,bulbX,my-30,WC);wireSeg(ctx,bulbX,my+34,bulbX,bot,WC);
  wireSeg(ctx,bulbX,bot,mx,bot,WC);wireSeg(ctx,mx,bot,mx,By,WC);
  // AC 侧：盒→L；盒→下→右→R
  wireSeg(ctx,bx+24,my-10,Lx,my-2,WC);
  wireSeg(ctx,bx+24,my+12,bx+44,my+12,WC);wireSeg(ctx,bx+44,my+12,bx+44,acB,WC);
  wireSeg(ctx,bx+44,acB,Rx,acB,WC);wireSeg(ctx,Rx,acB,Rx,my+2,WC);
  /* ---- 臂上常显小箭头 = 该二极管唯一允许的电流方向 ---- */
  arms.forEach(([ax,ay,bx2,by2])=>{
    const a=Math.atan2(by2-ay,bx2-ax);
    for(const f of [0.17,0.83]){
      const px=ax+(bx2-ax)*f,py=ay+(by2-ay)*f;
      ctx.save();ctx.translate(px,py);ctx.rotate(a);
      ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=1.7;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-3,-4.5);ctx.lineTo(3.5,0);ctx.lineTo(-3,4.5);ctx.stroke();
      ctx.restore();
    }
  });
  /* ---- 激活路径高亮 + 粒子 + 流动箭头 ---- */
  const pPos=[[bx+24,my-10],[Lx,my-2],[Lx,my],[mx,Ty],[mx,top],[bulbX,top],[bulbX,my-30],[bulbX,my+34],[bulbX,bot],[mx,bot],[mx,By],[Rx,my],[Rx,acB],[bx+44,acB],[bx+44,my+12],[bx+24,my+12]];
  const pNeg=[[bx+24,my+12],[bx+44,my+12],[bx+44,acB],[Rx,acB],[Rx,my],[mx,Ty],[mx,top],[bulbX,top],[bulbX,my-30],[bulbX,my+34],[bulbX,bot],[mx,bot],[mx,By],[Lx,my],[bx+24,my-10]];
  if(u!==0){
    const P=pos?pPos:pNeg;
    for(let i=1;i<P.length;i++)wireSeg(ctx,P[i-1][0],P[i-1][1],P[i][0],P[i][1],on,3.4);
    drawParticles(ctx,P,(stm*170*Math.abs(u)/Um)%pathLen(P),30,Math.round(pathLen(P)/30),on,3);
    flowChevrons(ctx,P,(stm*170*Math.abs(u)/Um)%72,72,on);
  }
  /* ---- 元件 ---- */
  drawACBox(ctx,bx,my,te*2);
  text(ctx,pos?'+':'−',bx-16,my-14,{size:13,color:pos?'#FF8B8B':'#8BB8FF',weight:800});
  text(ctx,pos?'−':'+',bx-16,my+16,{size:13,color:pos?'#8BB8FF':'#FF8B8B',weight:800});
  text(ctx,'~ 50Hz',bx,my+40,{size:9.5,color:'rgba(255,255,255,.4)',align:'center'});
  // 四只二极管（臂中点）+ 导通 ✓ / 截止 ⊘
  const DS=[
    {x:mx-75,y:my-62.5,a:Math.atan2(-125,150), on:pos,c:C1,n:'D1'},
    {x:mx+75,y:my-62.5,a:Math.atan2(-125,-150),on:neg,c:C2,n:'D2'},
    {x:mx-75,y:my+62.5,a:Math.atan2(-125,-150),on:neg,c:C2,n:'D3'},
    {x:mx+75,y:my+62.5,a:Math.atan2(-125,150), on:pos,c:C1,n:'D4'}
  ];
  DS.forEach(d=>{
    drawDiode(ctx,d.x,d.y,d.on,{angle:d.a,color:d.c,label:d.n});
    const ox=d.x+24*Math.cos(d.a-Math.PI/2),oy=d.y+24*Math.sin(d.a-Math.PI/2);
    text(ctx,d.on?'✓':'⊘',ox,oy,{size:12,color:d.on?'#C8FF00':'rgba(255,107,96,.85)',align:'center',weight:800});
  });
  // 状态牌
  pill(ctx,mx,top-16,u===0?'—':(pos?'正半周：D1、D4 导通（绿路径）':'负半周：D2、D3 导通（蓝路径）'),true,on);
  // 灯泡 + 负载电流方向恒定
  drawBulb(ctx,bulbX,my,24,(u/311)*(u/311));
  text(ctx,'负载 R',bulbX+16,my+44,{size:10.5,color:'rgba(255,255,255,.5)',align:'center'});
  arrow(ctx,bulbX-16,my-48,bulbX-16,my-6,'#fff',2.4,7);
  text(ctx,'电流方向始终向下 ↓',bulbX+62,my-48,{size:11,color:'#fff',weight:700});
  text(ctx,'+ 输出（T 角）',mx+10,top+4,{size:10.5,color:C1,weight:700});
  text(ctx,'− 输出（B 角）',mx+10,bot+4,{size:10.5,color:'#8BB8FF',weight:700});
  // 端子点
  [[Lx,my],[Rx,my],[mx,Ty],[mx,By],[mx,top],[bulbX,top],[bulbX,bot],[mx,bot]].forEach(p=>termDot(ctx,p[0],p[1]));
  /* ---- 下部：示波器 ---- */
  const sc={x:70,y:h*0.705,w:w-115,h:h*0.245,vUp:400,vDn:400,vDiv:100,tWin:0.04,tDiv:0.01,unit:'V'};
  text(ctx,'输入 u（灰）与输出 uR＝|u|（绿）— 蓝色区域 = 被"翻转"上来的负半周 — 固定标尺',sc.x,sc.y-9,{size:11.5,color:'rgba(255,255,255,.6)',weight:700});
  const yz=drawScope(ctx,sc);
  // 被翻转的负半周区域填充
  ctx.fillStyle='rgba(0,240,255,.10)';
  ctx.beginPath();ctx.moveTo(sc.x,yz);
  for(let px=0;px<=sc.w;px+=2){
    const tt=px/sc.w*sc.tWin,v=Um*Math.sin(TAU*50*tt);
    ctx.lineTo(sc.x+px,yz-(v<0?sc.h*Math.abs(v)/(sc.vUp+sc.vDn):0));
  }
  ctx.lineTo(sc.x+sc.w,yz);ctx.closePath();ctx.fill();
  text(ctx,'← 负半周翻转上来',sc.x+sc.w*0.25,yz-sc.h*0.13,{size:10,color:'#00F0FF',align:'center',weight:700});
  trace(ctx,sc,yz,tt=>Um*Math.sin(TAU*50*tt),'rgba(255,255,255,.55)',{lw:1.8});
  trace(ctx,sc,yz,tt=>Math.abs(Um*Math.sin(TAU*50*tt)),'#C8FF00',{lw:2.6});
  scopeDot(ctx,sc,yz,u,te,'rgba(255,255,255,.8)');
  scopeDot(ctx,sc,yz,Math.abs(u),te,'#C8FF00');
  sec.querySelector('#z4avg').textContent=(0.9*U).toFixed(0)+' V';
  const st=sec.querySelector('#z4st');
  st.textContent=pos?'D1 · D4':(neg?'D2 · D3':'—');
  st.style.color=pos?C1:C2;
}
makeLoop('z4',draw);
})();
</script>

 '① <b>交流输入</b>：12V 变压器次级，正负半周交替（示波器灰色正弦，±17V）。',

 '③ <b>充电</b>：电压上升段，电流兵分两路：一路供 7805，一路涌进电容，<b>极板 ± 电荷增多</b>。',

  ht.style.color=heat>4?'#FF3B30':(heat>2?'#FFB800':'#00E5A0');
  /* ===== 控制台：7805 内部透视 ===== */
  {
    const r2=fitCanvas(icv),c2=r2.ctx,W2=r2.w,H2=r2.h;

    arrow(c2,150,my2,174,my2,'rgba(255,255,255,.6)',1.6,5);
    text(c2,'OUT 5V',178,my2,{size:10.5,color:'#00E5A0',weight:700});
    const cy2=H2*0.72;
    c2.strokeStyle='rgba(255,255,255,.35)';c2.lineWidth=1.2;
    c2.beginPath();c2.moveTo(196,my2+8);c2.lineTo(196,cy2);c2.lineTo(148,cy2);c2.stroke();
    c2.strokeStyle='#9B4DFF';c2.lineWidth=1.8;
    c2.beginPath();c2.moveTo(116,cy2-14);c2.lineTo(116,cy2+14);c2.lineTo(146,cy2);c2.closePath();c2.stroke();
    text(c2,'−',120,cy2-6,{size:10,color:'#9B4DFF',weight:800});
    text(c2,'+',120,cy2+8,{size:10,color:'#9B4DFF',weight:800});
    text(c2,'基准 5V',102,cy2+24,{size:8.5,color:'rgba(255,255,255,.55)',align:'center'});
    c2.beginPath();c2.moveTo(110,cy2+8);c2.lineTo(116,cy2+8);c2.stroke();
    c2.setLineDash([4,3]);
    c2.beginPath();c2.moveTo(146,cy2);c2.lineTo(158,cy2);c2.lineTo(158,my2+20);c2.lineTo(150,my2+12);c2.stroke();
    c2.setLineDash([]);

  }
}
makeLoop('z5',draw);

const SLOW=0.04;
const PCOL=['#FFD43B','#69DB7C','#FF6B6B'],PN=['A','B','C'];
const TOPV=['V1','V3','V5'],BOTV=['V4','V6','V2'];
const SEQ=[['V1','V6'],['V1','V2'],['V3','V2'],['V3','V4'],['V5','V4'],['V5','V6']];
function draw(t){
  const {w,h,ctx}=fitCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const te=t*SLOW*SPEED, stm=t*SPEED, ph=TAU*50*te;
  const uu=[0,1,2].map(k=>311*Math.sin(ph-k*TAU/3));
  let mxI=0,mnI=0;
  for(let k=1;k<3;k++){if(uu[k]>uu[mxI])mxI=k;if(uu[k]<uu[mnI])mnI=k;}
  const udNow=uu[mxI]-uu[mnI];
  const PC='#C8FF00',ORC='#FF6B35',WC='rgba(154,165,184,.55)';
  /* ===== 换流桥电路（左侧） ===== */
  const cw=w*0.53;
  const ym=h*0.42,yT=ym-h*0.155,yB=ym+h*0.155;
  const legX=[cw*0.42,cw*0.62,cw*0.82];
  text(ctx,'三相 6 脉动换流桥（阀厅）',34,h*0.115,{size:11.5,color:'rgba(255,255,255,.6)',weight:700});
  // 换流变压器
  const tx=64;
  drawTransformer(ctx,tx,ym,0.72,6,6);
  text(ctx,'换流',tx,ym+44,{size:9.5,color:'rgba(255,255,255,.55)',align:'center',weight:700});
  text(ctx,'变压器',tx,ym+56,{size:9.5,color:'rgba(255,255,255,.55)',align:'center',weight:700});
  // ± 母线
  const railL=tx+40,railR=cw-16;
  wireSeg(ctx,railL,yT,railR,yT,WC,3);
  wireSeg(ctx,railL,yB,railR,yB,WC,3);
  text(ctx,'+ 极',railL-6,yT-10,{size:11,color:PC,weight:800,align:'right'});
  text(ctx,'− 极',railL-6,yB+14,{size:11,color:'#00F0FF',weight:800,align:'right'});
  // 平波电抗器（+ 极母线上）
  const rx=railR-66;
  wireSeg(ctx,railL,yT,rx-42,yT,'rgba(154,165,184,.9)',3);
  drawInductor(ctx,rx,yT,true);
  text(ctx,'平波电抗器',rx,yT-26,{size:9.5,color:'rgba(255,255,255,.6)',align:'center'});
  wireSeg(ctx,rx+42,yT,railR,yT,'rgba(154,165,184,.9)',3);
  arrow(ctx,railR-30,yT,railR-4,yT,PC,2.4,7);
  arrow(ctx,railR-30,yB,railR-4,yB,'#00F0FF',2.4,7);
  text(ctx,'→ ±800kV',railR-2,yT-12,{size:9.5,color:PC,align:'right',weight:700});
  text(ctx,'直流线路',railR-2,yT+12,{size:9.5,color:PC,align:'right'});
  // 三条相线（车道 ym−26 / ym / ym+26）
  const lane=[ym-26,ym,ym+26];
  for(let k=0;k<3;k++){
    wireSeg(ctx,tx+30,lane[k],legX[k],lane[k],PCOL[k],2.2);
    wireSeg(ctx,legX[k],lane[k],legX[k],ym+(k===1?0:(k===0?-4:4)),PCOL[k],2.2);
    termDot(ctx,legX[k],lane[k]);
    text(ctx,PN[k],tx+26,lane[k],{size:11,color:PCOL[k],align:'right',weight:800});
  }
  // 三条桥臂
  for(let k=0;k<3;k++){
    const lx=legX[k];
    const topOn=(k===mxI),botOn=(k===mnI);
    // 上阀段：yT → 上阀 → ym；下阀段：ym → 下阀 → yB
    wireSeg(ctx,lx,yT,lx,ym-109,topOn?PC:WC,topOn?3.4:2.4);
    wireSeg(ctx,lx,ym-41,lx,ym+41,WC,2.4);
    wireSeg(ctx,lx,ym+109,lx,yB,botOn?PC:WC,botOn?3.4:2.4);
    // 上阀（晶闸管=二极管+门极）
    drawDiode(ctx,lx,ym-75,topOn,{angle:-Math.PI/2,color:PC,label:''});
    drawDiode(ctx,lx,ym+75,botOn,{angle:-Math.PI/2,color:PC,label:''});
    // 门极短线 + 触发脉冲光点（刚开通的阀门极闪一下）
    ctx.strokeStyle=topOn?PC:'rgba(255,255,255,.4)';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(lx+14,ym-75+10);ctx.lineTo(lx+24,ym-75+18);ctx.stroke();
    if(topOn){glow(ctx,PC,10);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(lx+24,ym-75+18,3,0,TAU);ctx.fill();noGlow(ctx);}
    ctx.strokeStyle=botOn?PC:'rgba(255,255,255,.4)';
    ctx.beginPath();ctx.moveTo(lx+14,ym+75+10);ctx.lineTo(lx+24,ym+75+18);ctx.stroke();
    if(botOn){glow(ctx,PC,10);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(lx+24,ym+75+18,3,0,TAU);ctx.fill();noGlow(ctx);}
    if(k===2)text(ctx,'G 门极（触发脉冲）',lx+30,ym-75+22,{size:9.5,color:'rgba(255,255,255,.55)'});
    text(ctx,TOPV[k],lx-30,ym-75,{size:11,color:topOn?PC:'rgba(255,255,255,.55)',align:'center',weight:800});
    text(ctx,BOTV[k],lx-30,ym+75,{size:11,color:botOn?PC:'rgba(255,255,255,.55)',align:'center',weight:800});
    termDot(ctx,lx,yT);termDot(ctx,lx,yB);
  }
  // 导通电流路径粒子
  if(udNow>0){
    const p1=[[tx+30,lane[mxI]],[legX[mxI],lane[mxI]],[legX[mxI],ym],[legX[mxI],yT],[railR-6,yT]];
    drawParticles(ctx,p1,(stm*140)%pathLen(p1),26,Math.round(pathLen(p1)/26),PC,2.8);
    const p2=[[railR-6,yB],[legX[mnI],yB],[legX[mnI],ym],[legX[mnI],lane[mnI]],[tx+30,lane[mnI]]];
    drawParticles(ctx,p2,(stm*140)%pathLen(p2),26,Math.round(pathLen(p2)/26),'#00F0FF',2.8);
    pill(ctx,(legX[0]+legX[2])/2,yB+30,TOPV[mxI]+' + '+BOTV[mnI]+' 导通：'+PN[mxI]+' 相最高、'+PN[mnI]+' 相最低',true,PC);
  }
  /* ===== 右上：三相电压 + 导通包络 ===== */
  const sx=w*0.575,sw=w-sx-40;
  const sc1={x:sx,y:h*0.13,w:sw,h:h*0.28,vUp:400,vDn:400,vDiv:200,tWin:0.04,tDiv:0.01,unit:'V'};
  text(ctx,'三相电压：始终"一相最高、一相最低"（亮线=被选中的两相）',sx,sc1.y-9,{size:11,color:'rgba(255,255,255,.6)',weight:700});
  const yz1=drawScope(ctx,sc1);
  for(let k=0;k<3;k++)
    trace(ctx,sc1,yz1,tt=>311*Math.sin(TAU*50*tt-k*TAU/3),PCOL[k],{lw:1.4,dash:k===mxI||k===mnI?null:[3,3]});
  trace(ctx,sc1,yz1,tt=>Math.max(311*Math.sin(TAU*50*tt),311*Math.sin(TAU*50*tt-TAU/3),311*Math.sin(TAU*50*tt-2*TAU/3)),PC,{lw:2.6});
  trace(ctx,sc1,yz1,tt=>Math.min(311*Math.sin(TAU*50*tt),311*Math.sin(TAU*50*tt-TAU/3),311*Math.sin(TAU*50*tt-2*TAU/3)),'#00F0FF',{lw:2.6});
  scopeDot(ctx,sc1,yz1,uu[mxI],te,PC);
  scopeDot(ctx,sc1,yz1,uu[mnI],te,'#00F0FF');
  /* ===== 右下：6 脉动输出 + 平波后 ===== */
  const sc2={x:sx,y:h*0.50,w:sw,h:h*0.30,vUp:600,vDn:60,vDiv:200,tWin:0.04,tDiv:0.01,unit:'V'};
  text(ctx,'输出 ud = u大 − u小：每周期 6 脉动 → 平波后平直（白线 513V）',sx,sc2.y-9,{size:11,color:'rgba(255,255,255,.6)',weight:700});
  const yz2=drawScope(ctx,sc2);
  trace(ctx,sc2,yz2,tt=>{
    const a=311*Math.sin(TAU*50*tt),b=311*Math.sin(TAU*50*tt-TAU/3),c=311*Math.sin(TAU*50*tt-2*TAU/3);
    return Math.max(a,b,c)-Math.min(a,b,c);
  },ORC,{lw:2.6});
  trace(ctx,sc2,yz2,()=>513,'rgba(255,255,255,.85)',{lw:2});
  scopeDot(ctx,sc2,yz2,udNow,te,ORC);
  text(ctx,'Ud ≈ 1.35 × 380 = 513V',sx+8,yz2-sc2.h*513/660-10,{size:10,color:'rgba(255,255,255,.75)'});
  text(ctx,'波谷也有 465V（不跌到 0）',sx+8,yz2-sc2.h*465/660+16,{size:10,color:ORC});
  /* ===== 阀导通顺序表 ===== */
  text(ctx,'阀导通顺序（每只阀导通 120°，每秒轮换 300 次）：',34,h*0.845,{size:11,color:'rgba(255,255,255,.6)',weight:700});
  const curPair=TOPV[mxI]+'+'+BOTV[mnI];
  for(let i=0;i<6;i++){
    const s=SEQ[i][0]+'+'+SEQ[i][1];
    const on=s===curPair;
    const px=44+i*96,py=h*0.885;
    ctx.fillStyle=on?'rgba(200,255,0,.18)':'rgba(255,255,255,.04)';
    roundRect(ctx,px,py-15,86,30,9);ctx.fill();
    ctx.strokeStyle=on?PC:'rgba(255,255,255,.15)';ctx.lineWidth=on?1.8:1;ctx.stroke();
    text(ctx,s,px+43,py,{size:12,color:on?PC:'rgba(255,255,255,.5)',align:'center',weight:800,mono:true});
    if(i<5)arrow(ctx,px+88,py,px+94,py,'rgba(255,255,255,.35)',1.4,4);
  }
  // 读数
  sec.querySelector('#z6pair').textContent=curPair;
  sec.querySelector('#z6ud').textContent=udNow.toFixed(0)+' V';
  sec.querySelector('#z6avg').textContent='513 V';
  /* ===== 线损读数（保留原计算） ===== */
  const Up=ULIST[Ui]*1e3;
  const I=P*1e6/(2*Up);
  const Rloop=2*0.008*L;
  const dP=I*I*Rloop/1e6;
  const pct=dP/P*100;
  const Iac=P*1e6/(Math.sqrt(3)*500e3);
  const pctAc=3*Iac*Iac*(0.008*L)/1e6/P*100;
  sec.querySelector('#z6i').textContent=(I/1000).toFixed(2)+' kA';
  sec.querySelector('#z6dp').textContent=dP.toFixed(0)+' MW';
  const pc=sec.querySelector('#z6pc');
  pc.textContent=pct.toFixed(1)+' %';
  pc.style.color=pct>15?'#FF3B30':(pct>8?'#FFB800':'#C8FF00');
  const ac=sec.querySelector('#z6ac');
  ac.textContent=pctAc.toFixed(1)+' %';
  ac.style.color=pctAc>15?'#FF3B30':'#FFB800';
}
makeLoop('z6',draw);
})();
</script>

const cv=sec.querySelector('#cv7');
/* ---- 工程图标（非 emoji） ---- */
function iconFactory(ctx,x,y){

/* ---- 蓝图卡绘制 ---- */
const BPL='rgba(190,225,255,.92)',BPD='rgba(120,180,240,.55)';

  for(let y=10;y<h;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  ctx.strokeStyle='rgba(110,180,255,.35)';ctx.lineWidth=1.2;ctx.strokeRect(5,5,w-10,h-10);
  fn(ctx,w,h);
}
function bpBox(ctx,x,y,bw,bh,label,sub){
  ctx.strokeStyle=BPL;ctx.lineWidth=1.6;ctx.strokeRect(x-bw/2,y-bh/2,bw,bh);
  text(ctx,label,x,y-(sub?4:0),{size:10.5,color:BPL,align:'center',weight:700});
  if(sub)text(ctx,sub,x,y+9,{size:8.5,color:BPD,align:'center'});
}
function bpLead(ctx,x1,y1,x2,y2,str){
  ctx.strokeStyle=BPD;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.fillStyle=BPD;ctx.beginPath();ctx.arc(x1,y1,1.8,0,TAU);ctx.fill();
  text(ctx,str,x2,y2-7,{size:8.5,color:BPD,align:'center'});
}
function bpCap(ctx,x,y){
  ctx.strokeStyle=BPL;ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(x-10,y-8);ctx.lineTo(x+10,y-8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-10,y-2);ctx.lineTo(x+10,y-2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-14);ctx.lineTo(x,y-8);ctx.moveTo(x,y-2);ctx.lineTo(x,y+6);ctx.stroke();
}
let cardsDone=false;
function drawCards(){
  /* bp1 充电器 */
  bp('bp1',(ctx,w,h)=>{
    const my=h*0.52;
    bpBox(ctx,32,my,34,26,'~','220V');
    bpBox(ctx,w*0.28,my,50,30,'整流桥','KBPC');
    bpBox(ctx,w*0.50,my,44,34,'电解','电容');
    bpBox(ctx,w*0.70,my,46,34,'高频','变压器');
    bpBox(ctx,w*0.905,my,38,26,'稳压','IC');
    ctx.strokeStyle=BPL;ctx.lineWidth=1.4;
    [[49,w*0.28-25],[w*0.28+25,w*0.50-22],[w*0.50+22,w*0.70-23],[w*0.70+23,w*0.905-19]].forEach(([a,b])=>{
      ctx.beginPath();ctx.moveTo(a,my);ctx.lineTo(b,my);ctx.stroke();});
    bpLead(ctx,w*0.28,my+15,w*0.28,h-12,'ZONE 04');
    bpLead(ctx,w*0.50,my+17,w*0.50,h-12,'ZONE 05 滤波');
    text(ctx,'5V/9V →',w-10,my-22,{size:9,color:'#00E5A0',align:'right',weight:700});
  });
  /* bp2 变频空调 */
  bp('bp2',(ctx,w,h)=>{
    const my=h*0.52;
    bpBox(ctx,30,my,34,26,'220V','~50Hz');
    bpBox(ctx,w*0.27,my,44,30,'整流桥','单相');
    bpBox(ctx,w*0.49,my,50,34,'直流母线','≈310V');
    bpCap(ctx,w*0.49,my-2);
    bpBox(ctx,w*0.72,my,52,36,'IPM 模块','6×IGBT');
    ctx.strokeStyle=BPL;ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(w*0.92,my,12,0,TAU);ctx.stroke();
    text(ctx,'M',w*0.92,my,{size:11,color:BPL,align:'center',weight:800});
    [[47,w*0.27-22],[w*0.27+22,w*0.49-25],[w*0.49+25,w*0.72-26]].forEach(([a,b])=>{
      ctx.beginPath();ctx.moveTo(a,my);ctx.lineTo(b,my);ctx.stroke();});
    for(let k=-1;k<=1;k++){
      ctx.beginPath();ctx.moveTo(w*0.72+26,my+k*8);ctx.lineTo(w*0.92-12,my+k*4);ctx.stroke();
    }
    text(ctx,'U/V/W',w*0.83,my-22,{size:8.5,color:BPD,align:'center'});
    bpLead(ctx,w*0.72,my+18,w*0.72,h-12,'交→直→交');
  });
  /* bp3 地铁牵引 */
  bp('bp3',(ctx,w,h)=>{
    const my=h*0.58;
    bpBox(ctx,30,my,36,26,'35kV','三相');
    bpBox(ctx,w*0.27,my,46,32,'整流','变压器');
    bpBox(ctx,w*0.50,my,48,32,'整流机组','12脉动');
    ctx.strokeStyle='#C8FF00';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(w*0.50+24,my);ctx.lineTo(w*0.62,my);ctx.lineTo(w*0.62,h*0.24);ctx.lineTo(w-14,h*0.24);ctx.stroke();
    text(ctx,'DC 1500V 接触网',w*0.80,h*0.24-8,{size:9,color:'#C8FF00',align:'center',weight:700});
    // 列车 + 受电弓
    ctx.strokeStyle=BPL;ctx.lineWidth=1.6;
    roundRect(ctx,w*0.72,h*0.54,w*0.24,h*0.2,5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(w*0.80,h*0.54);ctx.lineTo(w*0.84,h*0.24);ctx.moveTo(w*0.88,h*0.54);ctx.lineTo(w*0.84,h*0.24);ctx.stroke();
    text(ctx,'受电弓',w*0.79,h*0.44,{size:8.5,color:BPD,align:'center'});
    text(ctx,'列车',w*0.84,h*0.65,{size:9.5,color:BPL,align:'center',weight:700});
    bpLead(ctx,w*0.50,my+16,w*0.50,h-12,'ZONE 06 同款三相桥');
  });
  /* bp4 电解铝 */
  bp('bp4',(ctx,w,h)=>{
    // 直流母排
    ctx.strokeStyle='#C8FF00';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(14,20);ctx.lineTo(w/2,20);ctx.stroke();
    ctx.strokeStyle='#00F0FF';
    ctx.beginPath();ctx.moveTo(w/2,20);ctx.lineTo(w-14,20);ctx.stroke();
    text(ctx,'+ 直流母排（数万安培）',w/2,12,{size:9,color:'#C8FF00',align:'center',weight:700});
    text(ctx,'− 回路',w-40,12,{size:9,color:'#00F0FF',align:'center'});
    // 电解槽
    const sx=w*0.28,sy=h*0.30,sw2=w*0.44,sh2=h*0.56;
    ctx.strokeStyle=BPL;ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy+sh2);ctx.lineTo(sx+sw2,sy+sh2);ctx.lineTo(sx+sw2,sy);ctx.stroke();
    // 电解质熔体 + 铝液层
    ctx.fillStyle='rgba(255,140,60,.25)';ctx.fillRect(sx+3,sy+sh2*0.25,sw2-6,sh2*0.45);
    ctx.fillStyle='rgba(180,190,210,.5)';ctx.fillRect(sx+3,sy+sh2*0.7,sw2-6,sh2*0.26);
    text(ctx,'冰晶石熔体（电解质）',sx+sw2/2,sy+sh2*0.42,{size:8.5,color:'#FFB86B',align:'center'});
    text(ctx,'铝液（阴极析出）',sx+sw2/2,sy+sh2*0.84,{size:8.5,color:'#fff',align:'center'});
    // 阳极炭块
    for(let i=0;i<3;i++){
      const ax=sx+sw2*(0.22+i*0.28);
      ctx.fillStyle='#3a3d46';ctx.fillRect(ax-9,sy-14,18,sh2*0.5);
      ctx.strokeStyle=BPL;ctx.lineWidth=1.2;ctx.strokeRect(ax-9,sy-14,18,sh2*0.5);
      ctx.beginPath();ctx.moveTo(ax,sy-14);ctx.lineTo(ax,22);ctx.stroke();
    }
    text(ctx,'阳极炭块 →',sx+sw2+8,sy+8,{size:8.5,color:BPD});
    text(ctx,'Al³⁺ + 3e⁻ → Al ↓',sx+sw2/2,sy+sh2+12,{size:9,color:'#00E5A0',align:'center',weight:700});
  });
  /* bp5 电镀槽 */
  bp('bp5',(ctx,w,h)=>{
    const sx=w*0.22,sy=h*0.24,sw2=w*0.56,sh2=h*0.58;
    // 电源
    bpBox(ctx,w*0.5,20,64,22,'整流电源','DC 12V/大电流');
    ctx.strokeStyle='#C8FF00';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(w*0.5-20,31);ctx.lineTo(sx+16,31);ctx.lineTo(sx+16,sy);ctx.stroke();
    ctx.strokeStyle='#00F0FF';
    ctx.beginPath();ctx.moveTo(w*0.5+20,31);ctx.lineTo(sx+sw2-16,31);ctx.lineTo(sx+sw2-16,sy);ctx.stroke();
    // 槽体 + 电解液
    ctx.strokeStyle=BPL;ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy+sh2);ctx.lineTo(sx+sw2,sy+sh2);ctx.lineTo(sx+sw2,sy);ctx.stroke();
    ctx.fillStyle='rgba(80,160,255,.18)';ctx.fillRect(sx+3,sy+sh2*0.2,sw2-6,sh2*0.76);
    text(ctx,'电解液（Zn²⁺）',sx+sw2/2,sy+sh2*0.55,{size:9,color:BPD,align:'center'});
    // 阳极锌板 / 阴极工件
    ctx.fillStyle='#8a8f9a';ctx.fillRect(sx+10,sy+4,12,sh2*0.7);
    ctx.strokeStyle=BPL;ctx.lineWidth=1.2;ctx.strokeRect(sx+10,sy+4,12,sh2*0.7);
    text(ctx,'阳极 锌板',sx+16,sy+sh2+12,{size:8.5,color:BPD,align:'center'});
    ctx.fillStyle='#c8a86a';ctx.fillRect(sx+sw2-22,sy+4,12,sh2*0.7);
    ctx.strokeRect(sx+sw2-22,sy+4,12,sh2*0.7);
    text(ctx,'阴极 工件',sx+sw2-16,sy+sh2+12,{size:8.5,color:BPD,align:'center'});
    // 离子迁移箭头
    for(let i=0;i<3;i++){
      const ay=sy+sh2*(0.3+i*0.2);
      arrow(ctx,sx+34,ay,sx+sw2-34,ay,'rgba(200,230,255,.6)',1.2,5);
    }
    text(ctx,'Zn²⁺ 迁移 → 析出镀层',sx+sw2/2,sy+sh2*0.25,{size:8.5,color:'#00E5A0',align:'center'});
  });
  /* bp6 数据中心 */
  bp('bp6',(ctx,w,h)=>{
    bpBox(ctx,44,h*0.5,56,34,'整流柜','AC→DC');
    // 直流母线
    ctx.strokeStyle='#C8FF00';ctx.lineWidth=2.4;
    ctx.beginPath();ctx.moveTo(72,h*0.5);ctx.lineTo(w*0.32,h*0.5);ctx.lineTo(w*0.32,h*0.3);ctx.lineTo(w-14,h*0.3);ctx.stroke();
    text(ctx,'240V 直流母线',w*0.62,h*0.3-8,{size:9,color:'#C8FF00',align:'center',weight:700});
    // 机架
    for(let i=0;i<3;i++){
      const rx=w*0.42+i*w*0.20;
      ctx.strokeStyle=BPL;ctx.lineWidth=1.5;
      ctx.strokeRect(rx,h*0.42,w*0.14,h*0.44);
      for(let u=0;u<4;u++){
        ctx.strokeStyle='rgba(190,225,255,.5)';ctx.lineWidth=1;
        ctx.strokeRect(rx+4,h*0.42+6+u*(h*0.10),w*0.14-8,h*0.075);
        ctx.fillStyle=u%2?'#00E5A0':'#FFB800';
        ctx.fillRect(rx+7,h*0.42+9+u*(h*0.10),3,3);
      }
      ctx.strokeStyle='#C8FF00';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(rx+w*0.07,h*0.3);ctx.lineTo(rx+w*0.07,h*0.42);ctx.stroke();
      text(ctx,'PSU→12V',rx+w*0.07,h*0.42+h*0.44+10,{size:8,color:BPD,align:'center'});
    }
    text(ctx,'少两级变换，效率 +5~10%',w/2,h-12,{size:9,color:'#00E5A0',align:'center',weight:700});
  });
  /* bp7 直流快充桩 */
  bp('bp7',(ctx,w,h)=>{
    const my=h*0.52;
    bpBox(ctx,32,my,38,28,'三相','380V');
    bpBox(ctx,w*0.26,my,52,32,'整流+PFC','三相桥');
    bpBox(ctx,w*0.50,my,52,32,'直流母线','≈650V');
    bpCap(ctx,w*0.50,my-2);
    bpBox(ctx,w*0.72,my,52,32,'DC/DC','IGBT 调压');
    ctx.strokeStyle=BPL;ctx.lineWidth=1.4;
    [[51,w*0.26-26],[w*0.26+26,w*0.50-26],[w*0.50+26,w*0.72-26]].forEach(([a,b])=>{
      ctx.beginPath();ctx.moveTo(a,my);ctx.lineTo(b,my);ctx.stroke();});
    // 充电枪 + 电池
    ctx.beginPath();ctx.moveTo(w*0.72+26,my);ctx.lineTo(w*0.84,my);ctx.stroke();
    ctx.strokeStyle='#C8FF00';ctx.lineWidth=2;
    roundRect(ctx,w*0.84,my-9,22,18,4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(w*0.84+22,my-4);ctx.lineTo(w*0.84+30,my-4);ctx.moveTo(w*0.84+22,my+4);ctx.lineTo(w*0.84+30,my+4);ctx.stroke();
    text(ctx,'充电枪',w*0.84+11,my-16,{size:8.5,color:'#C8FF00',align:'center',weight:700});
    ctx.strokeStyle=BPL;ctx.lineWidth=1.6;
    ctx.strokeRect(w*0.92,my-10,20,20);
    ctx.fillStyle='#00E5A0';ctx.fillRect(w*0.92+3,my+2,14,6);
    text(ctx,'电池',w*0.92+10,my+20,{size:8.5,color:BPD,align:'center'});
    bpLead(ctx,w*0.26,my+16,w*0.26,h-12,'ZONE 06 同款三相桥');
    bpLead(ctx,w*0.50,my+16,w*0.68,h-12,'ZONE 05 滤波');
    text(ctx,'200~750V 可调直灌',w-12,16,{size:9,color:'#00E5A0',align:'right',weight:700});
  });
}
function draw(t){
  const {w,h,ctx}=fitCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const stm=t*SPEED;
  if(!cardsDone){drawCards();cardsDone=true;}
  const n=NODES.length,pad=60;
  const step=(w-pad*2)/(n-1),cy=h*0.46;
  for(let i=0;i<n-1;i++){
    const x1=pad+i*step+30,x2=pad+(i+1)*step-30;
    const isDC=i>=2&&i<=3;
    const cc=isDC?'#C8FF00':'#FF6B35';
    wireSeg(ctx,x1,cy,x2,cy,cc,2.6);
    arrow(ctx,(x1+x2)/2-8,cy,(x1+x2)/2+8,cy,cc,2,6);
    for(let k=0;k<3;k++){
      const xx=x1+((stm*60+k*37)%(x2-x1));
      glow(ctx,cc,6);ctx.fillStyle=cc;
      ctx.beginPath();ctx.arc(xx,cy+(isDC?0:Math.sin(stm*6+k)*4),2.4,0,TAU);ctx.fill();noGlow(ctx);
    }
    text(ctx,isDC?'直流':'交流',(x1+x2)/2,cy-14,{size:9,color:cc,align:'center'});
  }
  NODES.forEach((nd,i)=>{
    const x=pad+i*step;
    ctx.fillStyle='#141821';roundRect(ctx,x-30,cy-30,60,60,10);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1.2;ctx.stroke();
    nd.ic(ctx,x,cy-2);
    text(ctx,nd.t,x,cy+22,{size:10.5,color:'#fff',align:'center',weight:700});
    text(ctx,nd.s,x,cy+44,{size:9.5,color:'rgba(255,255,255,.55)',align:'center'});
    text(ctx,'ZONE '+nd.z,x,cy-44,{size:9,color:'#FF2D8F',align:'center',weight:700,mono:true});
  });
}
makeLoop('z7',draw);
})();
</script>

<script>
/* 初始化：支持 #zoneId 深链 */
const hashId=location.hash.slice(1);
showTab(SECTIONS.some(s=>s.id===hashId)?hashId:SECTIONS[0].id);
</script>
