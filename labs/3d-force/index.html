    '<div class="readout">'+
      '<div class="ro"><div class="k">F = √(F₁²+F₂²+2F₁F₂cosθ)</div><div class="v" id="r65a">—</div></div>'+
      '<div class="ro"><div class="k">∂F/∂F₂ = (F₂+F₁cosθ)/F</div><div class="v" id="r65b">—</div></div>'+
      '<div class="ro"><div class="k">情形判定</div><div class="v" id="r65c">—</div></div>'+
      '<div class="ro"><div class="k">结论</div><div class="v" id="r65d" style="font-size:13px">—</div></div>'+
    '</div>'+
    '<div class="knote"><b>选项辨析（答案 B）</b>：A ✗ cosθ 在 0°~180° 单调递减 ⟹ 仅增大 θ，F <b>一定</b>减小；B ✓ ∂F/∂F₁=(F₁+F₂cosθ)/F &gt; (F₁−F₂)/F ≥ 0 ⟹ 仅增大 F₁，F <b>一定</b>增大；C ✗ 钝角且 F₂&lt;F₁·|cosθ| 时 ∂F/∂F₂&lt;0，增大 F₂，F 反而<b>减小</b>（曲线先降后升，最低点处 F⊥F₂）；D ✗ 三角形两边之和大于第三边 ⟹ F ≤ F₁+F₂（等号仅 θ=0 取得），不可能大于代数和。</div>'+
  '</div>'+
'</div>';

/* ---------- 共享 2D 工具 ---------- */
function ar6(ctx,x1,y1,x2,y2,color,lw,label,dx,dy){
  ctx.save();ctx.shadowColor=color;ctx.shadowBlur=9;
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),hd=8.5;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hd*Math.cos(a-.42),y2-hd*Math.sin(a-.42));
  ctx.lineTo(x2-hd*Math.cos(a+.42),y2-hd*Math.sin(a+.42));
  ctx.closePath();ctx.fill();ctx.restore();
  if(label){ctx.save();ctx.shadowColor=color;ctx.shadowBlur=6;ctx.fillStyle=color;
    ctx.font='700 12.5px "Cambria Math",serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(label,x2+(dx||8),y2+(dy||-8));ctx.restore();}
}
function da6(ctx,x1,y1,x2,y2,color,lw){
  ctx.strokeStyle=color;ctx.lineWidth=lw||1.1;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
}
function arc6(ctx,x,y,r,a0,a1,color,label){
  ctx.strokeStyle=color;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,r,a0,a1);ctx.stroke();
  if(label){const am=(a0+a1)/2;
    textC(ctx,label,x+(r+12)*Math.cos(am),y+(r+12)*Math.sin(am),{size:12,color:color,weight:700,align:'center'});}
}
function sq6(ctx,px,py,ux,uy,vx,vy,s,color){
  ctx.strokeStyle=color;ctx.lineWidth=1.4;ctx.beginPath();
  ctx.moveTo(px+ux*s,py+uy*s);
  ctx.lineTo(px+(ux+vx)*s,py+(uy+vy)*s);
  ctx.lineTo(px+vx*s,py+vy*s);ctx.stroke();
}

/* ---------- 6.1 挡板缓转 ---------- */
const cv61=document.getElementById('cv61'),c61=cv61.getContext('2d');
let phi1=0,alp1=30,play1=false,last1=0,vec61='par';
const G1=10,D2R=Math.PI/180;
function draw61(t){
  const{w,h,ctx}=fitCanvas(cv61);if(w<40||h<40)return;ctx.clearRect(0,0,w,h);const c61=ctx;
  const dt=Math.min(.05,(t-last1)/1000||0);last1=t;
  if(play1){phi1+=dt*16;if(phi1>=88){phi1=88;play1=false;document.getElementById('pl61').textContent='▶ 挡板缓转';}
    const sl=document.getElementById('p61');sl.value=phi1;document.getElementById('p61v').textContent=phi1.toFixed(0)+'°';}
  const al=alp1*D2R,ph=phi1*D2R;
  const sc=Math.min((w-150)/7.6,(h-74)/4.2);
  const ox=64,oy=h-44,X=x=>ox+x*sc,Y=y=>oy-y*sc;
  // wedge
  const wx=6.6,wy=wx*Math.tan(al);
  ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(wx),Y(0));ctx.lineTo(X(wx),Y(wy));ctx.closePath();
  ctx.fillStyle='rgba(120,140,170,.16)';ctx.fill();ctx.strokeStyle='rgba(170,190,220,.85)';ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,Y(0)+1);ctx.lineTo(w,Y(0)+1);ctx.stroke();
  const sa=[Math.cos(al),Math.sin(al)],n1=[-Math.sin(al),Math.cos(al)];
  const O=[sa[0]*2.1,sa[1]*2.1];
  const db=[-Math.sin(ph),Math.cos(ph)],n2=[Math.cos(ph),Math.sin(ph)];
  const r=.46;
  const tt=r*(1-Math.sin(ph-al))/Math.cos(ph-al);
  const C=[O[0]+sa[0]*tt+n1[0]*r,O[1]+sa[1]*tt+n1[1]*r];
  // ghost: phi=alpha (N2 min)
  const Cm=[O[0]+sa[0]*r+n1[0]*r,O[1]+sa[1]*r+n1[1]*r];
  const dbm=[-Math.sin(al),Math.cos(al)];
  da6(ctx,X(O[0]),Y(O[1]),X(O[0]+dbm[0]*2.35),Y(O[1]+dbm[1]*2.35),'rgba(255,255,255,.38)',1.4);
  ctx.strokeStyle='rgba(255,255,255,.30)';ctx.setLineDash([4,4]);ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(X(Cm[0]),Y(Cm[1]),r*sc,0,7);ctx.stroke();ctx.setLineDash([]);
  if(Math.abs(phi1-alp1)>1.5)
    textC(ctx,'最小位',X(O[0]+dbm[0]*2.5),Y(O[1]+dbm[1]*2.5),{size:11,color:'rgba(255,255,255,.5)',align:'left'});
  // baffle
  ctx.save();ctx.shadowColor='#9B4DFF';ctx.shadowBlur=10;
  ctx.strokeStyle='rgba(155,77,255,.95)';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(X(O[0]-db[0]*.35),Y(O[1]-db[1]*.35));
  ctx.lineTo(X(O[0]+db[0]*2.35),Y(O[1]+db[1]*.35));ctx.stroke();ctx.restore();
  textC(ctx,'挡板',X(O[0]+db[0]*2.35)+12,Y(O[1]+db[1]*2.35)-2,{size:11.5,color:'#c9a0ff',align:'left'});
  textC(ctx,'O',X(O[0])+2,Y(O[1])+16,{size:12,color:'#fff',weight:700});
  // ball
  const g=ctx.createRadialGradient(X(C[0])-8,Y(C[1])-10,4,X(C[0]),Y(C[1]),r*sc);
  g.addColorStop(0,'#ffd9b0');g.addColorStop(1,'#c85f1e');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(X(C[0]),Y(C[1]),r*sc,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.2;ctx.stroke();
  // angles
  arc6(ctx,X(0),Y(0),.62*sc,-al,0,'rgba(255,209,102,.85)','α');
  arc6(ctx,X(O[0]),Y(O[1]),.55*sc,-Math.PI/2,-Math.PI/2+ph,'rgba(155,77,255,.9)','φ');
  // forces + construction at C
  const N1=G1*Math.cos(ph)/Math.cos(ph-al),N2=G1*Math.sin(al)/Math.cos(ph-al);
  const k=1.9/G1*sc;
  const cxp=X(C[0]),cyp=Y(C[1]);
  const P1=[cxp+n1[0]*N1*k,cyp-n1[1]*N1*k];
  const P2v=[cxp+n2[0]*N2*k,cyp-n2[1]*N2*k];
  const Pmg=[cxp,cyp+G1*k],Pup=[cxp,cyp-G1*k];
  const N1m=G1*Math.cos(al),N2m=G1*Math.sin(al),n2m=[Math.cos(al),Math.sin(al)];
  if(vec61==='tri'){
    /* 三角形：以 mg 箭头（小球处）为公共边，首尾相接平移 F_N1、F_N2 */
    const Q0=Pmg,Q1=[Q0[0]+n1[0]*N1*k,Q0[1]-n1[1]*N1*k];
    da6(ctx,Q0[0],Q0[1],Q0[0]+n1[0]*(G1/Math.cos(al))*k*1.06,Q0[1]-n1[1]*(G1/Math.cos(al))*k*1.06,'rgba(0,240,255,.5)',1.3);
    textC(ctx,'F_N1 定射线',Q0[0]+n1[0]*(G1/Math.cos(al))*k*.60-8,Q0[1]-n1[1]*(G1/Math.cos(al))*k*.60-12,{size:10.5,color:'rgba(0,240,255,.75)',align:'right'});
    ar6(ctx,Q0[0],Q0[1],Q1[0],Q1[1],'#00F0FF',2.2,'F_N1',8,-12);
    ar6(ctx,Q1[0],Q1[1],cxp,cyp,'#9B4DFF',2.2,'F_N2',10,-2);
    const Q1m=[Q0[0]+n1[0]*N1m*k,Q0[1]-n1[1]*N1m*k];
    da6(ctx,Q1m[0],Q1m[1],cxp,cyp,'rgba(155,77,255,.6)',1.6);
    textC(ctx,'min',Q1m[0]-4,Q1m[1]+15,{size:11,color:'#c9a0ff',align:'center'});
    const vx=(cxp-Q1m[0]),vy=(cyp-Q1m[1]),vl=Math.hypot(vx,vy);
    sq6(ctx,Q1m[0],Q1m[1],n1[0],-n1[1],vx/vl,vy/vl,8,'rgba(200,255,0,.85)');
  }else{
    /* 平行四边形：重力翻折 −mg 作等效合力对角线 */
    da6(ctx,P1[0],P1[1],Pup[0],Pup[1],'rgba(255,255,255,.45)',1.3);
    da6(ctx,P2v[0],P2v[1],Pup[0],Pup[1],'rgba(255,255,255,.45)',1.3);
    ar6(ctx,cxp,cyp,Pup[0],Pup[1],'#FF8B5E',2.8,'−mg',10,-2);
    const P1m=[cxp+n1[0]*N1m*k,cyp-n1[1]*N1m*k],P2m=[cxp+n2m[0]*N2m*k,cyp-n2m[1]*N2m*k];
    da6(ctx,cxp,cyp,P2m[0],P2m[1],'rgba(155,77,255,.55)',1.5);
    da6(ctx,P2m[0],P2m[1],Pup[0],Pup[1],'rgba(155,77,255,.4)',1.1);
    da6(ctx,P1m[0],P1m[1],Pup[0],Pup[1],'rgba(155,77,255,.4)',1.1);
    textC(ctx,'min',P2m[0]+10,P2m[1]+2,{size:11,color:'#c9a0ff',align:'left'});
    sq6(ctx,P1m[0],P1m[1],n1[0],-n1[1],n2m[0],-n2m[1],8,'rgba(200,255,0,.85)');
  }
  // forces at ball (solid)
  ar6(ctx,cxp,cyp,cxp,cyp+G1*k,'#FF4D5E',2.6,'mg',10,4);
  ar6(ctx,cxp,cyp,P1[0],P1[1],'#00F0FF',2.6,'F_N1',10,-10);
  ar6(ctx,cxp,cyp,P2v[0],P2v[1],'#9B4DFF',2.6,'F_N2',10,-10);
  // readouts
  document.getElementById('r61a').textContent=N1.toFixed(2)+' N';
  document.getElementById('r61b').textContent=N2.toFixed(2)+' N';
  document.getElementById('r61c').textContent=(G1*Math.sin(al)).toFixed(2)+' N（φ=α 时）';
  const st=document.getElementById('r61d');
  if(Math.abs(phi1-alp1)<1.5){st.textContent='✦ 此刻 F_N1⊥F_N2，F_N2 最小！';st.style.color='#C8FF00';}
  else if(phi1<alp1){st.textContent='φ<α：F_N2 正在减小…';st.style.color='#9DB2CE';}
  else{st.textContent='φ>α：F_N2 转为增大';st.style.color='#FFB800';}
  st.style.textShadow='none';
}

/* ---------- 6.2 相似三角形法 ---------- */
const cv62=document.getElementById('cv62'),c62=cv62.getContext('2d');
let gam2=105,play2=false,last2=0,vec62='par';
const G2=10,AC2=3,BC2=2.6;
function draw62(t){
  const{w,h,ctx}=fitCanvas(cv62);if(w<40||h<40)return;ctx.clearRect(0,0,w,h);const c62=ctx;
  const dt=Math.min(.05,(t-last2)/1000||0);last2=t;
  if(play2){gam2-=dt*10;if(gam2<=30){gam2=30;play2=false;document.getElementById('pl62').textContent='▶ 缓慢收绳';}
    document.getElementById('g62').value=gam2;document.getElementById('g62v').textContent=gam2.toFixed(0)+'°';}
  const ga=gam2*D2R;
  const sc=Math.min((w-140)/6.0,(h-92)/5.6);
  const ox=70,oy=h-40,X=x=>ox+x*sc,Y=y=>oy-y*sc;
  const C=[1.0,2.2],A=[1.0,2.2+AC2];
  const dir=[Math.sin(ga),Math.cos(ga)];
  const B=[C[0]+dir[0]*BC2,C[1]+dir[1]*BC2];
  const ABv=[A[0]-B[0],A[1]-B[1]],AB=Math.hypot(ABv[0],ABv[1]),uBA=[ABv[0]/AB,ABv[1]/AB];
  const FN=G2*BC2/AC2,F=G2*AB/AC2;
  // ground
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,Y(0)+1);ctx.lineTo(w,Y(0)+1);ctx.stroke();
  // geometric triangle ACB (faint fill)
  ctx.beginPath();ctx.moveTo(X(A[0]),Y(A[1]));ctx.lineTo(X(C[0]),Y(C[1]));ctx.lineTo(X(B[0]),Y(B[1]));ctx.closePath();
  ctx.fillStyle='rgba(255,209,102,.05)';ctx.fill();
  // rod AC (vertical pole)
  ctx.strokeStyle='rgba(180,195,220,.9)';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(X(A[0]),Y(0));ctx.lineTo(X(A[0]),Y(A[1]));ctx.stroke();
  textC(ctx,'A',X(A[0])+14,Y(A[1])+2,{size:13,color:'#fff',weight:700});
  // pulley at A
  ctx.strokeStyle='#FFB800';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.arc(X(A[0]),Y(A[1]),.16*sc,0,7);ctx.stroke();
  ctx.fillStyle='#FFB800';ctx.beginPath();ctx.arc(X(A[0]),Y(A[1]),2.4,0,7);ctx.fill();
  // rod BC
  ctx.strokeStyle='rgba(0,240,255,.95)';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(X(C[0]),Y(C[1]));ctx.lineTo(X(B[0]),Y(B[1]));ctx.stroke();
  // hinge C
  ctx.fillStyle='#0A0A0F';ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(X(C[0]),Y(C[1]),6,0,7);ctx.fill();ctx.stroke();
  textC(ctx,'C',X(C[0])-14,Y(C[1])+14,{size:13,color:'#fff',weight:700});
  // rope: B -> over pulley top -> horizontal free end (collinear with F)
  const py=Y(A[1])-.17*sc;
  ctx.strokeStyle='rgba(220,225,235,.85)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(X(B[0]),Y(B[1]));
  ctx.lineTo(X(A[0])+10,py+5);
  ctx.lineTo(X(A[0])-1.35*sc,py);ctx.stroke();
  ar6(ctx,X(A[0])-.78*sc,py,X(A[0])-1.38*sc,py,'#9B4DFF',2.6,'F',-2,-14);
  // weight box at B
  ctx.fillStyle='rgba(255,77,94,.9)';
  const bs=.34*sc;
  ctx.fillRect(X(B[0])-bs/2,Y(B[1])-bs/2,bs,bs);
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.2;ctx.strokeRect(X(B[0])-bs/2,Y(B[1])-bs/2,bs,bs);
  textC(ctx,'B',X(B[0])+bs*.8,Y(B[1])-bs*.7,{size:13,color:'#fff',weight:700});
  // gamma arc at C
  arc6(ctx,X(C[0]),Y(C[1]),.5*sc,-Math.PI/2,-Math.PI/2+ga,'rgba(255,184,0,.9)','∠BCA');
  // forces + construction at B
  const k=1.35/G2*sc,bxp=X(B[0]),byp=Y(B[1]);
  const PF=[bxp+uBA[0]*F*k,byp-uBA[1]*F*k];
  const PN=[bxp+dir[0]*FN*k,byp-dir[1]*FN*k];
  if(vec62==='tri'){
    const Q0=[bxp,byp+G2*k];
    const Q1=[Q0[0]+uBA[0]*F*k,Q0[1]-uBA[1]*F*k];
    ar6(ctx,Q0[0],Q0[1],Q1[0],Q1[1],'#9B4DFF',2.2,'F',10,-10);
    ar6(ctx,Q1[0],Q1[1],bxp,byp,'#00F0FF',2.2,'F_N',12,4);
    textC(ctx,'∥AB',(Q0[0]+Q1[0])/2,(Q0[1]+Q1[1])/2+14,{size:10.5,color:'rgba(155,77,255,.8)',align:'center'});
    textC(ctx,'∥CB',(Q1[0]+bxp)/2+16,(Q1[1]+byp)/2,{size:10.5,color:'rgba(0,240,255,.8)',align:'left'});
  }else{
    const Pup=[bxp,byp-G2*k];
    da6(ctx,PF[0],PF[1],Pup[0],Pup[1],'rgba(255,255,255,.45)',1.3);
    da6(ctx,PN[0],PN[1],Pup[0],Pup[1],'rgba(255,255,255,.45)',1.3);
    ar6(ctx,bxp,byp,Pup[0],Pup[1],'#FF8B5E',2.8,'−G',10,-2);
    textC(ctx,'∥AB',(bxp+PF[0])/2+14,(byp+PF[1])/2,{size:10.5,color:'rgba(155,77,255,.8)',align:'left'});
    textC(ctx,'∥CB',(bxp+PN[0])/2+16,(byp+PN[1])/2,{size:10.5,color:'rgba(0,240,255,.8)',align:'left'});
  }
  ar6(ctx,bxp,byp,bxp,byp+G2*k,'#FF4D5E',2.6,'G',10,4);
  ar6(ctx,bxp,byp,PN[0],PN[1],'#00F0FF',2.6,'F_N',12,-6);
  ar6(ctx,bxp,byp,PF[0],PF[1],'#9B4DFF',2.6,'F',10,-12);
  // dashed geometric triangle edges + labels
  da6(ctx,X(A[0]),Y(A[1]),X(C[0]),Y(C[1]),'rgba(255,255,255,.35)',1.2);
  da6(ctx,X(C[0]),Y(C[1]),X(B[0]),Y(B[1]),'rgba(255,255,255,.35)',1.2);
  da6(ctx,X(A[0]),Y(A[1]),X(B[0]),Y(B[1]),'rgba(255,255,255,.35)',1.2);
  textC(ctx,'AC=3',X(A[0])-16,Y((A[1]+C[1])/2),{size:11,color:'rgba(255,255,255,.65)',align:'right'});
  textC(ctx,'BC=2.6',X((B[0]+C[0])/2)+10,Y((B[1]+C[1])/2)+14,{size:11,color:'rgba(255,255,255,.65)',align:'left'});
  textC(ctx,'AB='+AB.toFixed(2),X((A[0]+B[0])/2)+12,Y((A[1]+B[1])/2)-8,{size:11,color:'rgba(255,209,102,.85)',align:'left'});
  // similarity formula top-right
  textC(ctx,'G/AC = F_N/BC = F/AB',w-20,30,{size:14,color:'#FFD166',weight:700,mono:1,align:'right'});
  textC(ctx,'AC、BC 固定 ⟹ F_N 恒定',w-20,52,{size:12,color:'rgba(200,255,0,.85)',align:'right'});
  // readouts
  document.getElementById('r62a').textContent=AB.toFixed(2);
  const rb=document.getElementById('r62b');rb.textContent=FN.toFixed(2)+' N';rb.style.color='#C8FF00';
  document.getElementById('r62c').textContent=F.toFixed(2)+' N';
  const st=document.getElementById('r62d');
  st.textContent='收绳中：F_N 不变，F 随 AB 减小';st.style.color='#9DB2CE';st.style.textShadow='none';
}

const cv63=document.getElementById('cv63'),c63=cv63.getContext('2d');
let phi3=15,play3=false,last3=0;
const G3=10,SQ32=Math.sqrt(3)/2;
function draw63(t){
  const{w,h,ctx}=fitCanvas(cv63);if(w<40||h<40)return;ctx.clearRect(0,0,w,h);const c63=ctx;

  const ph=phi3*D2R;

  const CC=[cxp-RR/2,cyp+G3*k/2];        /* 圆心在弦左侧（与 V 同侧） */
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.setLineDash([5,5]);ctx.lineWidth=1.4;

  ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(CC[0],CC[1],2.2,0,7);ctx.fill();
  textC(ctx,'外接圆 · R=mg/√3（顶点 V 在圆上滑动）',w-18,26,{size:12.5,color:'rgba(255,255,255,.6)',weight:700,align:'right'});
  // ghost initial (phi=0) vertex
  const F10=G3*.5/SQ32;

  da6(ctx,M[0],M[1],V0[0],V0[1],'rgba(255,255,255,.28)',1.2);
  da6(ctx,V0[0],V0[1],cxp,cyp,'rgba(255,255,255,.28)',1.2);
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(V0[0],V0[1],2.6,0,7);ctx.fill();
  textC(ctx,'初态',V0[0],V0[1]+14,{size:10.5,color:'rgba(255,255,255,.45)',align:'center'});
  // diameter from M through center (F1 max = 2R)
  const dxb=CC[0]-M[0],dyb=CC[1]-M[1],db2=Math.hypot(dxb,dyb);
  const VM=[CC[0]+dxb/db2*RR,CC[1]+dyb/db2*RR];

  textC(ctx,'F₁ max = 2R',VM[0]-8,VM[1]-10,{size:10.5,color:'rgba(0,240,255,.7)',align:'right'});
  // initial ghost scene rays

  da6(ctx,X(C[0]),Y(C[1]),X(C[0]+0.5*2.4),Y(C[1]+0.866*2.4),'rgba(255,255,255,.22)',1.2);

  ctx.lineTo(X(B[0]+h1[0]*0.5),Y(B[1]+h1[1]*0.5));ctx.stroke();
  // knots at A,B

  ctx.beginPath();ctx.arc(X(B[0]),Y(B[1]),3.2,0,7);ctx.fill();
  textC(ctx,'A',X(A[0])-12,Y(A[1])+2,{size:12.5,color:'#fff',weight:700});
  textC(ctx,'B',X(B[0])+2,Y(B[1])-12,{size:12.5,color:'#fff',weight:700});
  // ropes
  ctx.strokeStyle='rgba(0,240,255,.85)';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.moveTo(X(C[0]),Y(C[1]));ctx.lineTo(X(A[0]),Y(A[1]));ctx.stroke();
  if(F2>.03){ctx.strokeStyle='rgba(200,255,0,.85)';ctx.setLineDash([]);}
  else{ctx.strokeStyle='rgba(200,255,0,.4)';ctx.setLineDash([5,5]);}
  ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(X(C[0]),Y(C[1]));ctx.lineTo(X(B[0]),Y(B[1]));ctx.stroke();ctx.setLineDash([]);
  // ball at C

  ctx.fillStyle=g;ctx.beginPath();ctx.arc(X(C[0]),Y(C[1]),.24*sc,0,7);ctx.fill();

  textC(ctx,'C',X(C[0])-12,Y(C[1])+20,{size:12.5,color:'#fff',weight:700});
  // 120° arc at C between ropes
  arc6(ctx,X(C[0]),Y(C[1]),.42*sc,Math.atan2(-u1[1],u1[0]),Math.atan2(-u2[1],u2[0]),'rgba(255,209,102,.9)','120°');
  // phi arc at C
  if(phi3>1) arc6(ctx,X(C[0]),Y(C[1]),.7*sc,-Math.PI,Math.atan2(-u1[1],u1[0]),'rgba(255,107,53,.9)','φ');

  ar6(ctx,M[0],M[1],V[0],V[1],'#00F0FF',2.2,'F₁',10,10);

  document.getElementById('r63b').textContent=F2<.03?'0（松弛）':F2.toFixed(2)+' N';
  document.getElementById('r63c').textContent=(G3/Math.sqrt(3)).toFixed(2)+' N';
  const st=document.getElementById('r63d');
  if(phi3>=89){st.textContent='✦ CA 竖直：F₂=0，F₁=mg';st.style.color='#C8FF00';}
  else if(Math.abs(phi3-60)<1.5){st.textContent='✦ φ=60°：F₁ 为直径，最大！';st.style.color='#C8FF00';}
  else if(phi3<60){st.textContent='φ<60°：F₁ 增大，F₂ 减小';st.style.color='#9DB2CE';}

/* ---------- 6.4 抬杆挂物（活结绳模型） ---------- */
const cv64=document.getElementById('cv64'),c64=cv64.getContext('2d');
let bet4=0,play4=false,last4=0;
const AB4=2.6,LL4=3.0,MG4=10,SHB4=2.0;
function draw64(t){
  const{w,h,ctx}=fitCanvas(cv64);if(w<40||h<40)return;ctx.clearRect(0,0,w,h);const c64=ctx;

    document.getElementById('b64').value=bet4;document.getElementById('b64v').textContent=bet4.toFixed(0)+'°';}
  const be=bet4*D2R;

  ctx.beginPath();ctx.moveTo(0,Y(0)+1);ctx.lineTo(w,Y(0)+1);ctx.stroke();
  // ghost initial (beta=0): level rod + initial hook
  if(bet4>0.5){
    const A0=[1.3-AB4,SHB4];
    const s0=AB4/LL4,c0=Math.sqrt(1-s0*s0);
    const H0=[A0[0]+LL4/2*s0,SHB4-LL4/2*c0];
    da6(ctx,X(A0[0]),Y(A0[1]),X(1.3),Y(SHB4),'rgba(255,255,255,.22)',1.2);
    da6(ctx,X(A0[0]),Y(A0[1]),X(H0[0]),Y(H0[1]),'rgba(0,240,255,.25)',1.1);
    da6(ctx,X(1.3),Y(SHB4),X(H0[0]),Y(H0[1]),'rgba(0,240,255,.25)',1.1);
    ctx.strokeStyle='rgba(255,209,102,.4)';ctx.setLineDash([4,4]);ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(X(H0[0]),Y(H0[1]),5,0,7);ctx.stroke();ctx.setLineDash([]);
    textC(ctx,'初态',X(H0[0])+14,Y(H0[1])+16,{size:10.5,color:'rgba(255,255,255,.45)',align:'left'});
  }

  const ydm=Y(0.30);

  da6(ctx,X(B[0]),Y(SHB4-0.1),X(B[0]),ydm,'rgba(255,255,255,.3)',1);
  ar6(ctx,X(A[0])+4,ydm,X(B[0])-4,ydm,'rgba(255,255,255,.45)',1.4,'',0,0);
  ar6(ctx,X(B[0])-4,ydm,X(A[0])+4,ydm,'rgba(255,255,255,.45)',1.4,'',0,0);
  textC(ctx,'d = AB·cosβ',(X(A[0])+X(B[0]))/2,ydm+15,{size:11.5,color:'rgba(255,255,255,.6)',align:'center'});

  ctx.beginPath();ctx.moveTo(X(A[0]),Y(A[1]));ctx.lineTo(X(B[0]),Y(B[1]));ctx.stroke();ctx.restore();
  textC(ctx,'刚性轻杆',X((A[0]+B[0])/2),Y((A[1]+B[1])/2)-22,{size:11.5,color:'#FFD166',align:'center'});
  textC(ctx,'A',X(A[0])-14,Y(A[1])+4,{size:12.5,color:'#fff',weight:700});
  textC(ctx,'B',X(B[0])+14,Y(B[1])+4,{size:12.5,color:'#fff',weight:700});

  da6(ctx,Hx,Hy,Pm4[0],Pm4[1],'rgba(255,139,94,.6)',1.6);

const cv65=document.getElementById('cv65'),c65=cv65.getContext('2d');

  if(obt){
    const B2x=Ax+f2s*ct*k5,B2y=Ay-f2s*st*k5;

    sq6(ctx,B2x,B2y,-ux/ul,-uy/ul,ct,-st,8,'rgba(200,255,0,.85)');
    textC(ctx,'min：F⊥F₂，F=F₁·sinθ='+(f15*st).toFixed(2),B2x,B2y-16,{size:11,color:'#FF8B9A',align:'center'});
    textC(ctx,'F₂*='+f2s.toFixed(2),Ax+f2s*ct*k5,Ay+46,{size:10.5,color:'rgba(200,255,0,.7)',align:'center'});
  }
  // main arrows
  ar6(ctx,ox,oy,Ax,Ay,'#00F0FF',2.8,'F₁',6,16);
  ar6(ctx,Ax,Ay,Bx,By,'#C8FF00',2.8,'F₂',10,-10);
  ar6(ctx,ox,oy,Bx,By,'#FF4D5E',2.8,'F',10,-8);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ox,oy,3,0,7);ctx.fill();
  textC(ctx,'O',ox-4,oy+16,{size:12,color:'#fff',weight:700,align:'center'});
  /* ===== 右：F–F₂ 曲线（固定标尺：x 0~12N，y 0~20N） ===== */
  const gx0=w*.60,gx1=w-36,gy0=h-64,gyT=44;
  const kx=(gx1-gx0)/12,ky=(gy0-gyT)/20;
  ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;
  for(let v=0;v<=12;v+=2){const xx=gx0+v*kx;ctx.beginPath();ctx.moveTo(xx,gyT);ctx.lineTo(xx,gy0);ctx.stroke();
    textC(ctx,v+'',xx,gy0+14,{size:10.5,color:'rgba(255,255,255,.5)',align:'center'});}
  for(let v=0;v<=20;v+=5){const yy=gy0-v*ky;ctx.beginPath();ctx.moveTo(gx0,yy);ctx.lineTo(gx1,yy);ctx.stroke();
    textC(ctx,v+'',gx0-8,yy,{size:10.5,color:'rgba(255,255,255,.5)',align:'right'});}
  textC(ctx,'F₂ / N',gx1,gy0+30,{size:11,color:'rgba(255,255,255,.6)',align:'right'});
  textC(ctx,'F / N',gx0+4,gyT-12,{size:11,color:'rgba(255,255,255,.6)',align:'left'});
  textC(ctx,'F–F₂ 曲线（θ、F₁ 固定）',gx0+70,gyT-26,{size:12.5,color:'rgba(255,209,102,.85)',weight:700,align:'left'});
  // curve
  let clip=false;
  ctx.save();ctx.shadowColor='#FFD166';ctx.shadowBlur=7;
  ctx.strokeStyle='#FFD166';ctx.lineWidth=2.4;ctx.beginPath();
  for(let i=0;i<=240;i++){
    const f2=i/240*12, fv=Math.sqrt(f15*f15+f2*f2+2*f15*f2*ct);
    let yy=fv/20; if(yy>1){clip=true;yy=1;}
    const px=gx0+f2*kx,py=gy0-yy*(gy0-gyT);
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.stroke();ctx.restore();
  if(clip)textC(ctx,'⚠ 超量程削顶',gx0+8,gyT+12,{size:10.5,color:'#FF3B30',weight:700});
  // min marker on curve (obtuse)
  if(obt&&f2s<=12){
    const mv=f15*st,mx=gx0+f2s*kx,my=gy0-(mv/20)*(gy0-gyT);
    da6(ctx,mx,my,mx,gy0,'rgba(200,255,0,.5)',1.2);
    da6(ctx,mx,my,gx0,my,'rgba(200,255,0,.35)',1);
    ctx.fillStyle='#C8FF00';ctx.beginPath();ctx.arc(mx,my,3.4,0,7);ctx.fill();
    textC(ctx,'min=' +mv.toFixed(2),mx+8,my-4,{size:10.5,color:'#C8FF00',align:'left'});
  }
  // current point
  const cpx=gx0+f25*kx,cpy=gy0-(Math.min(F,20)/20)*(gy0-gyT);
  da6(ctx,cpx,cpy,cpx,gy0,'rgba(255,255,255,.3)',1);
  ctx.save();ctx.shadowColor='#FF4D5E';ctx.shadowBlur=10;
  ctx.fillStyle='#FF4D5E';ctx.beginPath();ctx.arc(cpx,cpy,4.5,0,7);ctx.fill();ctx.restore();
  // readouts
  document.getElementById('r65a').textContent=F.toFixed(2)+' N';
  const rb=document.getElementById('r65b');
  rb.textContent=(dF2>=0?'+':'')+dF2.toFixed(3);
  rb.style.color=dF2>=0?'#C8FF00':'#FF4D5E';
  const rc=document.getElementById('r65c'),st5=document.getElementById('r65d');
  if(acute){rc.textContent='锐角';rc.style.color='#9DB2CE';
    st5.textContent='增大 F₂：F 单调增大';st5.style.color='#9DB2CE';}
  else if(!obt){rc.textContent='直角';rc.style.color='#9DB2CE';
    st5.textContent='增大任一分力，F 都增大';st5.style.color='#9DB2CE';}
  else if(f25<f2s-.05){rc.textContent='钝角 · F₂<F₁|cosθ|';rc.style.color='#FF4D5E';
    st5.textContent='⚠ 增大 F₂，F 反而减小！';st5.style.color='#FF4D5E';}
  else if(Math.abs(f25-f2s)<=.05){rc.textContent='钝角 · F₂=F₁|cosθ|';rc.style.color='#C8FF00';
    st5.textContent='✦ 此刻 F⊥F₂，F 最小=F₁·sinθ';st5.style.color='#C8FF00';}
  else{rc.textContent='钝角 · F₂>F₁|cosθ|';rc.style.color='#FFB800';
    st5.textContent='增大 F₂，F 转为增大';st5.style.color='#FFB800';}
  st5.style.textShadow='none';
}
function setTh5(v){th5=v;document.getElementById('t65').value=v;
  document.getElementById('t65v').textContent=v+'°';
  ['th60','th90','th135'].forEach(id=>document.getElementById(id).classList.remove('sel'));
  const id=v===60?'th60':v===90?'th90':v===135?'th135':null;
  if(id)document.getElementById(id).classList.add('sel');}
document.getElementById('pl65').onclick=()=>{play5=!play5;
  if(play5&&f25>=10){f25=0.3;document.getElementById('f265').value=0.3;document.getElementById('f265v').textContent='0.3 N';}
  document.getElementById('pl65').textContent=play5?'⏸ 暂停':'▶ F₂ 从零增大';};
document.getElementById('rs65').onclick=()=>{play5=false;f15=8;f25=3;setTh5(135);
  document.getElementById('f165').value=8;document.getElementById('f165v').textContent='8.0 N';
  document.getElementById('f265').value=3;document.getElementById('f265v').textContent='3.0 N';
  document.getElementById('pl65').textContent='▶ F₂ 从零增大';};
document.getElementById('t65').oninput=e=>{setTh5(+e.target.value);};
document.getElementById('f165').oninput=e=>{f15=+e.target.value;
  document.getElementById('f165v').textContent=f15.toFixed(1)+' N';};
document.getElementById('f265').oninput=e=>{f25=+e.target.value;
  document.getElementById('f265v').textContent=f25.toFixed(1)+' N';};
document.getElementById('th60').onclick=()=>setTh5(60);
document.getElementById('th90').onclick=()=>setTh5(90);
document.getElementById('th135').onclick=()=>setTh5(135);

makeLoop('z6',t=>{draw61(t);draw62(t);draw63(t);draw64(t);draw65(t);},()=>play1||play2||play3||play4||play5);
})();

</script>
