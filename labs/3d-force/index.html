<!DOCTYPE html>

<style>
:root{
  --bg-primary:#0A0A0F; --bg-secondary:#12121A; --bg-tertiary:#1A1A26;
  --glass:rgba(18,18,26,.78); --border:rgba(255,255,255,.07); --border-active:rgba(255,255,255,.16);
  --cyan:#00F0FF; --magenta:#FF2D8F; --lime:#C8FF00; --amber:#FFB800; --violet:#9B4DFF; --emerald:#00E5A0; --orange:#FF6B35;
  --text:#FFF; --text2:rgba(255,255,255,.68); --text3:rgba(255,255,255,.38);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-primary);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% -10%,rgba(0,240,255,.09),transparent 55%),
             radial-gradient(ellipse at 90% 110%,rgba(155,77,255,.06),transparent 50%);}
header{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.hwrap{max-width:1480px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo small{color:var(--text3);font-weight:500;font-size:11px;display:block;letter-spacing:.14em}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{background:transparent;border:1px solid transparent;color:var(--text2);font-size:13px;padding:8px 14px;border-radius:100px;cursor:pointer;transition:all .22s;font-family:inherit;white-space:nowrap}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.05)}
nav.tabs button.on{color:#06121a;font-weight:700;background:var(--ac,#00F0FF);box-shadow:0 0 18px 2px color-mix(in srgb,var(--ac,#00F0FF) 45%,transparent)}
main{max-width:1480px;margin:0 auto;padding:26px 28px 80px;position:relative;z-index:1}
section.tab{display:none;animation:fadeUp .5s cubic-bezier(.22,.9,.3,1)}
section.tab.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.stitle{display:flex;align-items:baseline;gap:14px;margin:6px 0 4px;flex-wrap:wrap}
.stitle h2{font-size:clamp(22px,3vw,30px);font-weight:800}
.stitle .step{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);padding:3px 10px;border-radius:100px;letter-spacing:.1em}
.sdesc{color:var(--text2);font-size:14.5px;line-height:1.8;max-width:980px;margin-bottom:18px}
.sdesc b{color:var(--ac);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media(max-width:980px){.lab{grid-template-columns:1fr}}

.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac,#00F0FF) 55%,transparent),transparent)}

canvas.stage{width:100%;display:block;border-radius:16px;background:#0a0a11;border:1px solid var(--border);cursor:grab;touch-action:none}
canvas.stage:active{cursor:grabbing}
.ctrl{margin-bottom:16px}.ctrl:last-child{margin-bottom:0}

input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;background:var(--bg-tertiary);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ac,#00F0FF);box-shadow:0 0 12px color-mix(in srgb,var(--ac,#00F0FF) 55%,transparent);cursor:pointer}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border-active);background:transparent;color:var(--text2);padding:9px 18px;border-radius:100px;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{border-color:var(--ac);color:#fff}

.btn.mini{padding:6px 13px;font-size:12px}
.btn.sel{background:color-mix(in srgb,var(--ac) 18%,transparent);border-color:var(--ac);color:#fff}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.ro{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:12px;padding:9px 12px}
.ro .k{font-size:11px;color:var(--text3)}
.ro .v{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:600;color:var(--ac);margin-top:2px}
.knote{margin-top:14px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);border:1px solid var(--border);border-left:3px solid var(--ac);border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.9;color:var(--text2)}
.knote b{color:#fff}
.knote .f{font-family:"JetBrains Mono",monospace;color:var(--ac);background:rgba(0,0,0,.35);padding:1px 7px;border-radius:6px;font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
footer{border-top:1px solid var(--border);padding:26px;text-align:center;color:var(--text3);font-size:12px;letter-spacing:.08em}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:100px;border:1px solid var(--border-active);color:var(--text3);margin-left:8px;vertical-align:middle}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border-active),transparent);margin:14px 0}
.fx{display:flex;align-items:center;gap:.35em;font-family:"Cambria Math","Times New Roman",serif;font-style:italic;font-size:16.5px;color:#fff;margin:9px 0;flex-wrap:wrap;line-height:1.5}
.fx .up{font-style:normal;color:var(--text3);font-size:.72em;vertical-align:super;font-family:"JetBrains Mono",monospace}
.fx .dn{font-style:normal;color:var(--text3);font-size:.72em;vertical-align:sub;font-family:"JetBrains Mono",monospace}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;font-size:.92em}
.frac .num{padding:0 .3em;border-bottom:1.2px solid rgba(255,255,255,.75)}
.frac .den{padding:0 .3em}
.fx .eq{color:var(--ac);font-style:normal;margin:0 .2em;font-weight:700}
.fx .hl{color:var(--ac);font-weight:700}
.viewbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.viewbar .btn.mini{padding:5px 11px;font-size:11.5px}
.hint{font-size:11.5px;color:var(--text3);margin-top:8px;letter-spacing:.03em}
.hint b{color:var(--text2)}
</style>

<header>

    <div class="logo"><div>三维受力分析实验室<small>3D FORCE LAB · 空间力系的平衡</small></div></div>

  </div>
</header>
<main id="main"></main>
<footer>三维受力分析 · 交互式教学仿真 · 拖拽旋转 / 滚轮缩放</footer>

<script>
/* ================= 分区注册 ================= */
const SECTIONS=[
  {id:'z1',num:'01',name:'四球垛 · 空间汇交力系',color:'#00F0FF'},
  {id:'z2',num:'02',name:'斜面挡板 · 力的三维分解',color:'#FF2D8F'},
  {id:'z3',num:'03',name:'木板双翻转 · 静摩擦',color:'#FFB800'},
  {id:'z4',num:'04',name:'晾衣绳 · 动态平衡',color:'#9B4DFF'},
  {id:'z5',num:'05',name:'V形槽圆柱 · 三维摩擦',color:'#00E5A0'},
  {id:'z6',num:'06',name:'图解法 · 方法篇',color:'#FF6B35'},
];
const main=document.getElementById('main'),tabsEl=document.getElementById('tabs');
const loops={};
SECTIONS.forEach(s=>{
  const b=document.createElement('button');
  b.textContent=s.num+' '+s.name;b.style.setProperty('--ac',s.color);
  b.onclick=()=>showTab(s.id);b.dataset.id=s.id;tabsEl.appendChild(b);
  const sec=document.createElement('section');
  sec.className='tab';sec.id='sec-'+s.id;sec.style.setProperty('--ac',s.color);
  main.appendChild(sec);
});
function showTab(id){
  window.__curZone=id;
  SECTIONS.forEach(s=>{
    document.getElementById('sec-'+s.id).classList.toggle('on',s.id===id);
    document.querySelector('nav.tabs button[data-id="'+s.id+'"]').classList.toggle('on',s.id===id);
    if(loops[s.id]){s.id===id?loops[s.id].start():loops[s.id].stop();}
  });
  window.scrollTo({top:0});
}
/* ================= Canvas / 循环 ================= */
const TAU=Math.PI*2;
function fitCanvas(cv){
  const dpr=Math.min(window.devicePixelRatio||1,1.5),r=cv.getBoundingClientRect();
  if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){
    cv.width=Math.max(2,r.width*dpr);cv.height=Math.max(2,r.height*dpr);
  }
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  return {w:r.width,h:r.height,ctx};
}
/* 按需渲染循环：30 FPS 上限；active()=true（播放中/相机缓动中/拖影消退中）才逐帧渲染，
   否则仅 dirty（滑杆/按钮/resize/切区等状态变化）时渲染一次，静止零重画 */
function makeLoop(id,draw,active){
  let raf=null,last=performance.now(),lastRender=0;
  const st={dirty:true};
  const tick=(now)=>{
    raf=requestAnimationFrame(tick);
    const animating=active?active():true;
    if(!animating&&!st.dirty)return;          // 静止且画面已最新：本帧跳过
    if(now-lastRender<33)return;               // 30 FPS 闸（dirty 保持到下一帧）
    const dt=Math.min(.05,(now-last)/1000);last=now;lastRender=now;st.dirty=false;
    draw(now/1000,dt);
  };
  loops[id]={start(){if(!raf){last=performance.now();st.dirty=true;raf=requestAnimationFrame(tick);}},
             stop(){if(raf){cancelAnimationFrame(raf);raf=null;}},
             poke(){st.dirty=true;}};
}
/* 页面切后台自动暂停，回前台恢复当前分区 */
document.addEventListener('visibilitychange',()=>{
  const id=window.__curZone;
  if(!id||!loops[id])return;
  if(document.hidden)loops[id].stop();else loops[id].start();
});
/* resize 触发一次 dirty 重绘 */
window.addEventListener('resize',()=>{
  const id=window.__curZone;
  if(id&&loops[id])loops[id].poke();
});
/* 滑杆拖动 / 按钮点击等交互触发一次 dirty 重绘（捕获阶段，覆盖全部分区控件） */
['input','click'].forEach(ev=>document.addEventListener(ev,()=>{
  const id=window.__curZone;
  if(id&&loops[id])loops[id].poke();
},true));
const D2R=Math.PI/180;
/* ================= 3D 数学库 ================= */
const V={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];},
  rot:(a,axis,ang)=>{const k=V.norm(axis),c=Math.cos(ang),s=Math.sin(ang);
    const t=V.cross(k,a),d=V.dot(k,a)*(1-c);
    return[a[0]*c+t[0]*s+k[0]*d,a[1]*c+t[1]*s+k[1]*d,a[2]*c+t[2]*s+k[2]*d];},
};
/* ================= 轨道相机 ================= */
class OrbitCam{
  constructor(cv,o){
    o=o||{};
    this.cv=cv;
    this.az=o.az!=null?o.az:.65;this.el=o.el!=null?o.el:.42;
    this.dist=o.dist||13;this.target=(o.target||[0,1.5,0]).slice();this.fov=o.fov||12;
    this.tAz=this.az;this.tEl=this.el;this.tDist=this.dist;this.tTarget=this.target.slice();
    this._bind();
  }
  flyTo(az,el,dist,target){this.tAz=az;this.tEl=el;if(dist)this.tDist=dist;if(target)this.tTarget=target.slice();}
  step(){const k=.14;
    this.az+=(this.tAz-this.az)*k;this.el+=(this.tEl-this.el)*k;this.dist+=(this.tDist-this.dist)*k;
    for(let i=0;i<3;i++)this.target[i]+=(this.tTarget[i]-this.target[i])*k;
    if(this.settled()){this.az=this.tAz;this.el=this.tEl;this.dist=this.tDist;this.target=this.tTarget.slice();}}
  settled(){return Math.abs(this.tAz-this.az)<1e-4&&Math.abs(this.tEl-this.el)<1e-4
    &&Math.abs(this.tDist-this.dist)<1e-3&&V.len(V.sub(this.tTarget,this.target))<1e-3;}
  _bind(){
    const cv=this.cv;let drag=false,lx=0,ly=0;
    cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
    cv.addEventListener('pointermove',e=>{if(!drag)return;
      this.tAz-=(e.clientX-lx)*.006;this.tEl+=(e.clientY-ly)*.006;
      this.tEl=Math.max(.06,Math.min(1.52,this.tEl));lx=e.clientX;ly=e.clientY;});
    cv.addEventListener('pointerup',()=>drag=false);
    cv.addEventListener('pointercancel',()=>drag=false);
    cv.addEventListener('wheel',e=>{e.preventDefault();
      this.tDist=Math.max(4,Math.min(45,this.tDist*(1+Math.sign(e.deltaY)*.09)));},{passive:false});
  }
  basis(){
    const ce=Math.cos(this.el),se=Math.sin(this.el),ca=Math.cos(this.az),sa=Math.sin(this.az);
    const eye=[this.target[0]+this.dist*ce*ca,this.target[1]+this.dist*se,this.target[2]+this.dist*ce*sa];
    const fwd=V.norm(V.sub(this.target,eye));
    let right=V.cross(fwd,[0,1,0]);
    if(V.len(right)<1e-4)right=[1,0,0];else right=V.norm(right);
    const up=V.cross(right,fwd);
    return{eye:eye,fwd:fwd,right:right,up:up};
  }
  project(p,w,h){
    const b=this._b;
    const d=V.sub(p,b.eye);
    const x=V.dot(d,b.right),y=V.dot(d,b.up),z=V.dot(d,b.fwd);
    const s=(this.fov*Math.min(w,h)/10)/Math.max(z,.4);
    return{x:w/2+x*s,y:h/2-y*s,s:s,depth:z};
  }
  begin(){this._b=this.basis();this.step();}
}
/* ================= 3D 绘制件 ================= */
function textC(ctx,str,x,y,o){
  o=o||{};
  ctx.fillStyle=o.color||'rgba(255,255,255,.75)';
  ctx.font=(o.weight||500)+' '+(o.size||12)+'px '+(o.mono?'"JetBrains Mono",monospace':'"PingFang SC","Microsoft YaHei",sans-serif');
  ctx.textAlign=o.align||'left';ctx.textBaseline='middle';ctx.fillText(str,x,y);
}
function grid3(ctx,cam,w,h,o){
  o=o||{};const size=o.size||10,div=o.div||10,y=o.y||0,alpha=o.alpha||.10;
  const st=size/div;
  ctx.lineWidth=1;
  for(let i=0;i<=div;i++){
    const c=-size/2+i*st;
    const a=cam.project([c,y,-size/2],w,h),b=cam.project([c,y,size/2],w,h);
    const cc=cam.project([-size/2,y,c],w,h),d=cam.project([size/2,y,c],w,h);
    ctx.strokeStyle='rgba(140,180,255,'+(i===div/2?alpha+.09:alpha)+')';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cc.x,cc.y);ctx.lineTo(d.x,d.y);ctx.stroke();
  }
}
function seg3(ctx,cam,w,h,a,b,color,lw,dash){
  const pa=cam.project(a,w,h),pb=cam.project(b,w,h);
  ctx.strokeStyle=color;ctx.lineWidth=lw||1.5;
  if(dash)ctx.setLineDash(dash);else ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();
  ctx.setLineDash([]);
}
function arrow3(ctx,cam,w,h,a,b,o){
  o=o||{};
  const color=o.color||'#00F0FF',lw=o.lw||3,head=o.head||9;
  const pa=cam.project(a,w,h),pb=cam.project(b,w,h);
  const sc=Math.max(.5,Math.min(1.5,pb.s/60));
  ctx.save();
  ctx.shadowColor=color;ctx.shadowBlur=o.ghost?0:12;
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();
  const an=Math.atan2(pb.y-pa.y,pb.x-pa.x),hd=head*sc;
  ctx.beginPath();ctx.moveTo(pb.x,pb.y);
  ctx.lineTo(pb.x-hd*Math.cos(an-.42),pb.y-hd*Math.sin(an-.42));
  ctx.lineTo(pb.x-hd*Math.cos(an+.42),pb.y-hd*Math.sin(an+.42));
  ctx.closePath();ctx.fill();
  ctx.restore();
  if(o.label){
    ctx.save();ctx.shadowColor=color;ctx.shadowBlur=8;
    ctx.fillStyle=color;ctx.font='700 13.5px "Cambria Math","Times New Roman",serif';
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(o.label,pb.x+(o.labelDx||10),pb.y+(o.labelDy||-10));
    ctx.restore();
  }
}
function arc3(ctx,cam,w,h,c,u,v,r,a0,a1,o){
  o=o||{};
  const color=o.color||'#FFD166';
  const uu=V.norm(u),vv=V.norm(V.sub(v,V.mul(uu,V.dot(v,V.norm(u)))));
  const pts=[],n=24;
  for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;
    pts.push(V.add(c,V.add(V.mul(uu,Math.cos(a)*r),V.mul(vv,Math.sin(a)*r))));}
  ctx.strokeStyle=color;ctx.lineWidth=1.6;ctx.beginPath();
  pts.forEach((p,i)=>{const q=cam.project(p,w,h);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});
  ctx.stroke();
  if(o.label){
    const am=(a0+a1)/2,lr=o.lr||1.4;
    const pm=V.add(c,V.add(V.mul(uu,Math.cos(am)*r*lr),V.mul(vv,Math.sin(am)*r*lr)));
    const q=cam.project(pm,w,h);
    ctx.fillStyle=color;ctx.font='600 '+(o.size||12.5)+'px "Cambria Math","Times New Roman",serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.label,q.x,q.y);
  }
}
function shade(hex,k){
  const n=parseInt(hex.slice(1),16);
  return 'rgb('+(((n>>16)&255)*k|0)+','+(((n>>8)&255)*k|0)+','+((n&255)*k|0)+')';
}
function sphere3(ctx,cam,w,h,c,r,o){
  o=o||{};
  const color=o.color||'#4CC9F0',ghost=o.ghost||false;
  const q=cam.project(c,w,h);
  const rr=r*q.s;
  ctx.save();
  if(ghost){
    const g=ctx.createRadialGradient(q.x-rr*.3,q.y-rr*.3,rr*.1,q.x,q.y,rr);
    g.addColorStop(0,color+'55');g.addColorStop(1,color+'15');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,rr,0,TAU);ctx.fill();
    ctx.strokeStyle=color+'bb';ctx.lineWidth=1.4;ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=.8;
    ctx.beginPath();ctx.ellipse(q.x,q.y,rr,rr*.32,0,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.ellipse(q.x,q.y,rr*.32,rr,0,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.ellipse(q.x,q.y,rr,rr*.7,0,0,TAU);ctx.stroke();
  }else{
    ctx.shadowColor=color;ctx.shadowBlur=26;
    const g=ctx.createRadialGradient(q.x-rr*.38,q.y-rr*.42,rr*.06,q.x,q.y,rr*1.02);
    g.addColorStop(0,'#ffffff');g.addColorStop(.18,color);
    g.addColorStop(.75,shade(color,.42));g.addColorStop(1,shade(color,.16));
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(q.x,q.y,rr,0,TAU);ctx.fill();
    ctx.shadowBlur=0;
    const hg=ctx.createRadialGradient(q.x-rr*.4,q.y-rr*.45,1,q.x-rr*.4,q.y-rr*.45,rr*.42);
    hg.addColorStop(0,'rgba(255,255,255,.85)');hg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(q.x,q.y,rr,0,TAU);ctx.fill();
  }
  ctx.restore();
  return q;
}
function face3(ctx,cam,w,h,pts,o){
  o=o||{};
  ctx.beginPath();
  pts.forEach((p,i)=>{const q=cam.project(p,w,h);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});
  ctx.closePath();
  if(o.fill){ctx.fillStyle=o.fill;ctx.fill();}
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.lw||1.2;
    if(o.dash)ctx.setLineDash(o.dash);ctx.stroke();ctx.setLineDash([]);}
}
function boxFaces(c,ax,ay,az){
  const v=(i,j,k)=>V.add(c,V.add(V.add(V.mul(ax,i),V.mul(ay,j)),V.mul(az,k)));
  return[
    [v(1,1,1),v(1,1,-1),v(1,-1,-1),v(1,-1,1)],
    [v(-1,1,1),v(-1,1,-1),v(-1,-1,-1),v(-1,-1,1)],
    [v(1,1,1),v(-1,1,1),v(-1,1,-1),v(1,1,-1)],
    [v(1,-1,1),v(-1,-1,1),v(-1,-1,-1),v(1,-1,-1)],
    [v(1,1,1),v(-1,1,1),v(-1,-1,1),v(1,-1,1)],
    [v(1,1,-1),v(-1,1,-1),v(-1,-1,-1),v(1,-1,-1)]];
}
function drawBox(ctx,cam,w,h,c,ax,ay,az,o){
  o=o||{};
  const faces=boxFaces(c,ax,ay,az);
  const sorted=faces.map(f=>{
    const d=f.reduce((s,p)=>s+V.dot(V.sub(p,cam._b.eye),cam._b.fwd),0)/f.length;
    return{f:f,d:d};}).sort((a,b)=>b.d-a.d);
  sorted.forEach(it=>face3(ctx,cam,w,h,it.f,{fill:o.fill,stroke:o.stroke,lw:o.lw||1.4}));
}
function viewBarHTML(){return''+
  '<div class="ctrl"><label>定向视角</label>'+
    '<div class="viewbar">'+
      '<button class="btn mini vw" data-v="iso">等轴测</button>'+
      '<button class="btn mini vw" data-v="front">正视</button>'+
      '<button class="btn mini vw" data-v="side">侧视</button>'+
      '<button class="btn mini vw" data-v="top">俯视</button>'+
    '</div>'+
    '<div class="hint"><b>拖拽</b> 旋转视角 · <b>滚轮</b> 缩放 · 淡蓝网格 = 绝对水平面</div>'+
  '</div>';
}
function ghostHTML(){return''+
  '<div class="ctrl"><label>物体显示</label><div class="btnrow">'+
    '<button class="btn mini gv sel" data-g="solid">实心质感</button>'+
    '<button class="btn mini gv" data-g="ghost">半透明透视</button>'+
  '</div></div>';
}
function auxHTML(){return''+
  '<div class="ctrl"><label>几何辅助线</label><div class="btnrow">'+
    '<button class="btn mini ax sel" data-a="on">显示</button>'+
    '<button class="btn mini ax" data-a="off">隐藏</button>'+
  '</div></div>';
}
function bindCommon(sec,cam,views,onGhost,onAux){
  sec.querySelectorAll('.vw').forEach(b=>b.onclick=()=>{
    const v=views[b.dataset.v];if(v)cam.flyTo(v[0],v[1],v[2],v[3]);
    sec.querySelectorAll('.vw').forEach(x=>x.classList.toggle('sel',x===b));
  });
  const gv=sec.querySelectorAll('.gv');
  gv.forEach(b=>b.onclick=()=>{
    gv.forEach(x=>x.classList.toggle('sel',x===b));
    onGhost(b.dataset.g==='ghost');
  });
  const ax=sec.querySelectorAll('.ax');
  ax.forEach(b=>b.onclick=()=>{
    ax.forEach(x=>x.classList.toggle('sel',x===b));
    if(onAux)onAux(b.dataset.a==='on');
  });
}
</script>

<script>
/* ================= ZONE 01 · 四球垛（共点力模型） ================= */
(function(){
const sec=document.getElementById('sec-z1');
sec.innerHTML=
'<div class="stitle"><span class="step">ZONE 01</span><h2>四球垛 · 空间汇交力系平衡</h2><span class="badge">必修一 · 相互作用</span></div>'+
'<p class="sdesc">三个相同的光滑球两两<b>刚好接触、彼此无挤压</b>，置于水平面上，第四个球稳放在凹槽正上方，四球心构成<b>正四面体</b>。按人教版<b>共点力模型</b>：各力的作用点平移至球心。顶球受三个对称支持力，支持力与竖直方向夹角 θ 满足 <b>cosθ = √(2/3)</b>；底球的水平分力由<b>地面静摩擦</b>平衡。</p>'+
'<div class="lab">'+
  '<div class="panel"><h4>三维舞台 · 可拖拽旋转</h4>'+
    '<canvas class="stage" id="cv1" style="aspect-ratio:16/10.2"></canvas>'+
    '<div class="legend">'+
      '<span><i style="background:#FF4D5E"></i>重力 G</span>'+
      '<span><i style="background:#00F0FF"></i>球面支持力 N / 地面支持力 F_N</span>'+
      '<span><i style="background:#FFB800"></i>顶球压力 N′</span>'+
      '<span><i style="background:#C8FF00"></i>地面静摩擦 f</span>'+
      '<span><i style="background:rgba(255,255,255,.45)"></i>虚线 · 辅助/分量</span>'+
    '</div>'+
  '</div>'+
  '<div class="panel"><h4>控制台</h4>'+
    '<div class="ctrl"><label>研究对象</label><div class="btnrow">'+
      '<button class="btn mini sel" id="mdTop">顶球 ④</button>'+
      '<button class="btn mini" id="mdBot">底球（任选）</button>'+
    '</div></div>'+
    '<div class="ctrl" id="pickRow" style="display:none"><label>选择底球</label><div class="btnrow">'+
      '<button class="btn mini pk sel" data-k="0">球 ①</button>'+
      '<button class="btn mini pk" data-k="1">球 ②</button>'+
      '<button class="btn mini pk" data-k="2">球 ③</button>'+
    '</div></div>'+
    '<div class="ctrl"><label>单球质量 m<output id="m1v">1.0 kg</output></label>'+
      '<input type="range" id="m1" min="0.5" max="3" step="0.1" value="1"></div>'+
    viewBarHTML()+ghostHTML()+auxHTML()+
    '<div class="readout">'+
      '<div class="ro"><div class="k">夹角 θ（N 与竖直）</div><div class="v" id="ro1a">35.26°</div></div>'+
      '<div class="ro"><div class="k">球面支持力 N</div><div class="v" id="ro1b">—</div></div>'+
      '<div class="ro"><div class="k">地面支持力 F_N</div><div class="v" id="ro1c">—</div></div>'+
      '<div class="ro"><div class="k">地面静摩擦 f</div><div class="v" id="ro1d">—</div></div>'+
    '</div>'+
    '<div class="knote"><b>顶球平衡（共点力）</b>：三个支持力的竖直分量合力托住重力'+
      '<div class="fx">3N·cos θ <span class="eq">=</span> G，cos θ <span class="eq">=</span> <span class="frac"><span class="num">h</span><span class="den">2R</span></span> <span class="eq">=</span> <span class="frac"><span class="num">√6</span><span class="den">3</span></span> ⟹ <span class="hl">N = G/√6</span></div>'+
      '<b>底球平衡</b>：竖直方向 F<span class="dn">N</span> = G + N·cosθ = <span class="f">7G/6</span>；底球两两刚好接触、<b>之间无弹力</b>，顶球压力的水平分力由地面静摩擦平衡：<span class="f">f = N·sinθ = (√2/6)G</span>。</div>'+
  '</div>'+
'</div>';
const cv=sec.querySelector('#cv1');
const cam=new OrbitCam(cv,{az:.7,el:.4,dist:11.8,target:[0,1.9,0]});
const views={iso:[.7,.4,11.8,[0,1.9,0]],front:[0,.14,11.5,[0,1.9,0]],side:[Math.PI/2,.14,11.5,[0,1.9,0]],top:[.7,1.45,13,[0,1,0]]};
let ghost=false,showAux=true,mode='top',pick=0,m=1;
bindCommon(sec,cam,views,g=>ghost=g,a=>showAux=a);
sec.querySelector('#mdTop').onclick=e=>{mode='top';sec.querySelector('#mdTop').classList.add('sel');sec.querySelector('#mdBot').classList.remove('sel');sec.querySelector('#pickRow').style.display='none';};
sec.querySelector('#mdBot').onclick=e=>{mode='bot';sec.querySelector('#mdBot').classList.add('sel');sec.querySelector('#mdTop').classList.remove('sel');sec.querySelector('#pickRow').style.display='';};
sec.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{pick=+b.dataset.k;sec.querySelectorAll('.pk').forEach(x=>x.classList.toggle('sel',x===b));});
sec.querySelector('#m1').oninput=e=>{m=+e.target.value;sec.querySelector('#m1v').textContent=m.toFixed(1)+' kg';};
const R=1.15, rb=2*R/Math.sqrt(3), hh=2*R*Math.sqrt(2/3);
const botC=[0,1,2].map(i=>{const a=Math.PI/2+i*TAU/3;return[rb*Math.cos(a),R,rb*Math.sin(a)];});
const topC=[0,R+hh,0];
const TH=Math.acos(Math.sqrt(2/3));
const cTh=Math.sqrt(2/3),sTh=1/Math.sqrt(3);
function draw(){
  const {w,h,ctx}=fitCanvas(cv);
  cam.begin();
  ctx.clearRect(0,0,w,h);
  grid3(ctx,cam,w,h,{size:16,div:16,alpha:.09});
  const G=10*m, u=2.6/G;
  const N=G/Math.sqrt(6), FN=7*G/6, FF=N*sTh;
  // 球心连线（正四面体棱，虚线）
  // 画球（按深度远→近）
  const balls=botC.map((c,i)=>({c:c,r:R,col:['#38BDF8','#818CF8','#34D399'][i],d:V.dot(V.sub(c,cam._b.eye),cam._b.fwd),tag:'①②③'[i]}))
    .concat([{c:topC,r:R,col:'#00F0FF',d:V.dot(V.sub(topC,cam._b.eye),cam._b.fwd),tag:'④'}])
    .sort((a,b)=>b.d-a.d);
  balls.forEach(b=>{
    const q=sphere3(ctx,cam,w,h,b.c,b.r,{color:b.col,ghost:ghost});
    textC(ctx,b.tag,q.x,q.y,{size:Math.max(12,b.r*q.s*.5),color:'rgba(10,15,25,.85)',align:'center',weight:800});
  });
  /* 球心连线：正四面体六棱，加粗高亮（叠加在球面上，透视效果） */
  botC.forEach(c=>seg3(ctx,cam,w,h,c,topC,'rgba(0,240,255,.8)',2.8));
  for(let i=0;i<3;i++)seg3(ctx,cam,w,h,botC[i],botC[(i+1)%3],'rgba(255,255,255,.5)',2);
  if(showAux){
    const Op=[0,R,0];                                  // 顶心在底面的投影 O'
    face3(ctx,cam,w,h,botC,{fill:'rgba(0,240,255,.06)',stroke:'rgba(0,240,255,.45)',lw:1.2,dash:[4,4]});
    seg3(ctx,cam,w,h,topC,Op,'rgba(255,209,102,.85)',1.6,[6,4]);
    botC.forEach(c=>seg3(ctx,cam,w,h,Op,c,'rgba(255,209,102,.6)',1.3,[4,4]));
    const qo=cam.project(Op,w,h);
    ctx.fillStyle='#FFD166';ctx.beginPath();ctx.arc(qo.x,qo.y,3.2,0,TAU);ctx.fill();
    textC(ctx,"O'",qo.x+10,qo.y+10,{size:12,color:'#FFD166',weight:700});
    const qh=cam.project(V.mul(V.add(topC,Op),.5),w,h);
    textC(ctx,'h',qh.x+11,qh.y,{size:13.5,color:'#FFD166',weight:700});
    const q2=cam.project(V.mul(V.add(topC,botC[0]),.5),w,h);
    textC(ctx,'2R',q2.x-16,q2.y-6,{size:12.5,color:'#00F0FF',weight:700});
    const qr=cam.project(V.mul(V.add(Op,botC[1]),.5),w,h);
    textC(ctx,'2R/√3',qr.x,qr.y+13,{size:11.5,color:'rgba(255,209,102,.9)',weight:600});
  }
  const DASH='rgba(255,255,255,.5)';
  if(mode==='top'){
    /* 共点力：全部从顶球球心出发 */
    arrow3(ctx,cam,w,h,topC,V.add(topC,[0,-G*u,0]),{color:'#FF4D5E',label:'G',labelDx:8,labelDy:14});
    botC.forEach(c=>{
      const dir=V.norm(V.sub(topC,c));                     // N 方向（由接触指向球心）
      const tip=V.add(topC,V.mul(dir,N*u));
      arrow3(ctx,cam,w,h,topC,tip,{color:'#00F0FF',label:'N'});
      const tipV=V.add(topC,[0,N*u*cTh,0]);                // 竖直分量端点
      if(showAux){seg3(ctx,cam,w,h,tip,tipV,DASH,1.1,[4,4]);
      seg3(ctx,cam,w,h,topC,tipV,'rgba(255,255,255,.25)',1,[3,4]);}
    });
    arc3(ctx,cam,w,h,topC,V.norm(V.sub(topC,botC[0])),[0,1,0],1.35,0,TH,{color:'#FFD166',label:'θ',lr:1.4});
    textC(ctx,'3N·cosθ = G',w-18,24,{size:14,color:'#00F0FF',align:'right',weight:700});
  }else{
    const c=botC[pick];
    const dirP=V.norm(V.sub(c,topC));                      // 压力方向（顶→底）
    arrow3(ctx,cam,w,h,c,V.add(c,[0,-G*u,0]),{color:'#FF4D5E',label:'G',labelDy:14});
    arrow3(ctx,cam,w,h,c,V.add(c,[0,FN*u,0]),{color:'#00F0FF',label:'F_N',labelDx:10,labelDy:-6});
    const tipP=V.add(c,V.mul(dirP,N*u));
    arrow3(ctx,cam,w,h,c,tipP,{color:'#FFB800',label:'N′'});
    // N′ 的分解虚线：竖直分量 + 水平分量
    const tipV=V.add(c,[0,-N*u*cTh,0]);
    const tipH=V.add(c,[dirP[0]*N*u,0,dirP[2]*N*u]);
    if(showAux){seg3(ctx,cam,w,h,tipP,tipV,DASH,1.1,[4,4]);
    seg3(ctx,cam,w,h,tipP,tipH,DASH,1.1,[4,4]);}
    // 地面静摩擦：指向中轴（与水平分力相反）
    const hz=V.norm([-dirP[0],0,-dirP[2]]);
    arrow3(ctx,cam,w,h,c,V.add(c,V.mul(hz,FF*u*1.6)),{color:'#C8FF00',lw:2.6,label:'f',labelDy:16});
    arc3(ctx,cam,w,h,c,dirP,[0,-1,0],1.8,0,TH,{color:'#FFD166',label:'θ',lr:1.5});
    textC(ctx,'F_N = 7G/6 · f = N·sinθ',w-18,24,{size:13.5,color:'#FFB800',align:'right',weight:700});
  }
  sec.querySelector('#ro1a').textContent=(TH/D2R).toFixed(2)+'°';
  sec.querySelector('#ro1b').textContent='G/√6 = '+N.toFixed(2)+' N';
  sec.querySelector('#ro1c').textContent='7G/6 = '+FN.toFixed(2)+' N';
  sec.querySelector('#ro1d').textContent='(√2/6)G = '+FF.toFixed(2)+' N';
}
makeLoop('z1',draw,()=>!cam.settled());
})();
</script>

<script>
/* ================= ZONE 02 · 斜面挡板 ================= */
(function(){
const sec=document.getElementById('sec-z2');
sec.innerHTML=
'<div class="stitle"><span class="step">ZONE 02</span><h2>斜面挡板 · 重力的三维分解</h2><span class="badge">必修一 · 力的分解</span></div>'+
'<p class="sdesc">坡面为<b>正方形</b>的斜面置于水平面，挡板沿坡面<b>左上角 → 右下角</b>的对角线竖立、与坡面垂直；小方块贴在挡板<b>中央靠上</b>处，底面坐坡面。重力须向三个方向分解：<b>⊥挡板（N₁）</b>、<b>⊥斜面（N₂）</b>、<b>沿挡板与斜面交线（静摩擦 f）</b>。默认倾角 37°，sin37°=0.6 方便口算。</p>'+
'<div class="lab">'+
  '<div class="panel"><h4>三维舞台 · 可拖拽旋转</h4>'+
    '<canvas class="stage" id="cv2" style="aspect-ratio:16/10.2"></canvas>'+
    '<div class="legend">'+
      '<span><i style="background:#FF4D5E"></i>重力 G</span>'+
      '<span><i style="background:#00F0FF"></i>斜面支持力 N₂</span>'+
      '<span><i style="background:#9B4DFF"></i>挡板支持力 N₁</span>'+
      '<span><i style="background:#C8FF00"></i>静摩擦 f（沿交线）</span>'+
      '<span><i style="background:rgba(255,255,255,.45)"></i>虚线 · 分解辅助</span>'+
    '</div>'+
  '</div>'+
  '<div class="panel"><h4>控制台</h4>'+
    '<div class="ctrl"><label>斜面倾角 α<output id="a2v">37°</output></label>'+
      '<input type="range" id="a2" min="20" max="60" step="1" value="37">'+
      '<div class="btnrow" style="margin-top:8px">'+
        '<button class="btn mini ap" data-a="30">30°</button>'+
        '<button class="btn mini ap sel" data-a="37">37°</button>'+
        '<button class="btn mini ap" data-a="45">45°</button>'+
        '<button class="btn mini ap" data-a="53">53°</button>'+
      '</div></div>'+
    '<div class="ctrl"><label>方块质量 m<output id="m2v">1.0 kg</output></label>'+
      '<input type="range" id="m2" min="0.5" max="3" step="0.1" value="1"></div>'+
    viewBarHTML()+ghostHTML()+auxHTML()+
    '<div class="readout">'+
      '<div class="ro"><div class="k">N₁ = (√2/2)G·sinα</div><div class="v" id="ro2a">—</div></div>'+
      '<div class="ro"><div class="k">N₂ = G·cosα</div><div class="v" id="ro2b">—</div></div>'+
      '<div class="ro"><div class="k">f = (√2/2)G·sinα</div><div class="v" id="ro2c">—</div></div>'+
      '<div class="ro"><div class="k">挡板与水平面夹角 φ</div><div class="v" id="ro2d">—</div></div>'+
    '</div>'+
    '<div class="knote"><b>三维分解口诀</b>：先把 G 拆成「⊥斜面 G·cosα」与「沿坡向下 G·sinα」；后者在坡面内再按对角线 45° 拆成两份：'+
      '<div class="fx">N<span class="dn">1</span> <span class="eq">=</span> f <span class="eq">=</span> G·sin α·sin 45° <span class="eq">=</span> <span class="frac"><span class="num">√2</span><span class="den">2</span></span> G·sin α</div>'+
      '<div class="fx">N<span class="dn">2</span> <span class="eq">=</span> G·cos α</div>'+
      '挡板与水平面夹角满足 <span class="f">cos φ = sinα/√2</span>（α=37° 时 φ≈65°）。摩擦力沿<b>挡板与斜面的交线</b>指向高处，这是最易错点！</div>'+
  '</div>'+
'</div>';
const cv=sec.querySelector('#cv2');
const cam=new OrbitCam(cv,{az:.55,el:.36,dist:11.5,target:[0,1.8,0]});
const views={iso:[.55,.36,11.5,[0,1.8,0]],front:[Math.PI/2,.14,11.5,[0,1.6,0]],side:[0,.2,11.5,[0,1.6,0]],top:[.55,1.45,13.5,[0,.6,0]]};
let ghost=false,showAux=true,alpha=37,m=1;
bindCommon(sec,cam,views,g=>ghost=g,a=>showAux=a);
sec.querySelector('#a2').oninput=e=>{alpha=+e.target.value;syncA();};
sec.querySelectorAll('.ap').forEach(b=>b.onclick=()=>{alpha=+b.dataset.a;sec.querySelector('#a2').value=alpha;syncA();
  sec.querySelectorAll('.ap').forEach(x=>x.classList.toggle('sel',x===b));});
function syncA(){sec.querySelector('#a2v').textContent=alpha+'°';}
sec.querySelector('#m2').oninput=e=>{m=+e.target.value;sec.querySelector('#m2v').textContent=m.toFixed(1)+' kg';};
const L=7.5, HB=1.9, A=1.6;
function draw(){
  const {w,h,ctx}=fitCanvas(cv);
  cam.begin();ctx.clearRect(0,0,w,h);
  grid3(ctx,cam,w,h,{size:17,div:17,alpha:.09});
  const a=alpha*D2R, ca=Math.cos(a), sa=Math.sin(a);
  const G=10*m, u=2.6/G;
  /* 坡面正方形：底边朝前（+z），山脊朝后（-z）抬升 */
  const U=[0,sa,-ca];                                   // 上坡方向
  const nS=[0,ca,sa];                                   // 坡面法向
  const p00=[-L/2,0, L*ca/2], p01=[L/2,0, L*ca/2];      // 底边左/右
  const p10=V.add(p00,V.mul(U,L)), p11=V.add(p01,V.mul(U,L)); // 山脊左/右
  const q10=[p10[0],0,p10[2]], q11=[p11[0],0,p11[2]];   // 后底边
  const gh=ghost?'rgba(255,45,143,.05)':'rgba(255,45,143,.14)';
  const gs=ghost?'rgba(255,45,143,.5)':'rgba(255,120,180,.8)';
  const wedge=[
    [p00,p01,p11,p10],
    [p10,p11,q11,q10],
    [p00,p10,q10],[p01,p11,q11],
    [p00,p01,q11,q10]];
  const sorted=wedge.map(f=>({f:f,d:f.reduce((s,p)=>s+V.dot(V.sub(p,cam._b.eye),cam._b.fwd),0)/f.length})).sort((x,y)=>y.d-x.d);
  sorted.forEach(it=>face3(ctx,cam,w,h,it.f,{fill:gh,stroke:gs,lw:1.3}));
  /* 对角线：左上角 p10 → 右下角 p01 */
  const diag=V.sub(p01,p10), dl=V.len(diag), uD=V.mul(diag,1/dl);
  const vD=V.norm(V.cross(nS,uD));                      // 坡面内 ⊥ 对角线 = 挡板法向（方块在 +vD 一侧，重力分量将其压向挡板）
  seg3(ctx,cam,w,h,p10,p01,'rgba(0,240,255,.85)',2.8);   // 交线（摩擦方向线）高亮
  /* 挡板：沿对角线、⊥坡面的薄板 */
  const dmid=V.add(p10,V.mul(uD,dl/2));
  const bc=V.add(dmid,V.mul(nS,HB/2));
  drawBox(ctx,cam,w,h,bc,V.mul(uD,dl/2),V.mul(nS,HB/2),V.mul(vD,.12),
    {fill:ghost?'rgba(155,77,255,.08)':'rgba(155,77,255,.16)',stroke:'rgba(200,160,255,.95)',lw:1.6});
  /* 方块：贴挡板中央靠上（沿对角线 42% 处），在挡板朝观众一侧 */
  const spot=V.add(p10,V.mul(uD,dl*.42));
  const cc=V.add(V.add(spot,V.mul(nS,A/2+.03)),V.mul(vD,A/2+.15));
  const cubeAx=V.mul(uD,A/2),cubeAy=V.mul(vD,A/2),cubeAz=V.mul(nS,A/2);
  const N1=Math.SQRT1_2*G*sa, N2=G*ca, f=N1;
  const phi=Math.acos(Math.min(1,sa/Math.SQRT2));
  /* 分解辅助 */
  const gEnd=V.add(cc,[0,-G*u,0]);
  const downS=V.mul(U,-1);
  if(showAux){
    const tip1=V.add(cc,V.mul(downS,G*u*sa));           // 沿坡向下分量端点
    const tip2=V.add(cc,V.mul(nS,-G*u*ca));             // ⊥斜面分量端点
    seg3(ctx,cam,w,h,gEnd,tip1,'rgba(255,255,255,.55)',1.3,[4,4]);
    seg3(ctx,cam,w,h,gEnd,tip2,'rgba(255,255,255,.55)',1.3,[4,4]);
    seg3(ctx,cam,w,h,tip1,tip2,'rgba(255,255,255,.3)',1,[3,4]);
    seg3(ctx,cam,w,h,cc,tip1,'rgba(255,255,255,.3)',1,[3,4]);
    /* 二次分解：沿坡分量 → uD（交线）与 vD（⊥挡板） */
    const tU=V.add(cc,V.mul(uD,G*u*sa/Math.SQRT2));
    const tV=V.add(cc,V.mul(vD,-G*u*sa/Math.SQRT2));
    seg3(ctx,cam,w,h,cc,tU,'rgba(200,255,0,.5)',1.2,[4,4]);
    seg3(ctx,cam,w,h,cc,tV,'rgba(190,140,255,.55)',1.2,[4,4]);
    seg3(ctx,cam,w,h,tip1,tU,'rgba(255,255,255,.35)',1,[3,4]);
    seg3(ctx,cam,w,h,tip1,tV,'rgba(255,255,255,.35)',1,[3,4]);
    /* 方块中心 → 坡面 / 挡板 的垂线 */
    seg3(ctx,cam,w,h,cc,V.add(cc,V.mul(nS,-(A/2+.05))),'rgba(0,240,255,.5)',1.2,[3,4]);
    seg3(ctx,cam,w,h,cc,V.add(cc,V.mul(vD,-(A/2+.17))),'rgba(190,140,255,.5)',1.2,[3,4]);
  }
  /* 方块 */
  drawBox(ctx,cam,w,h,cc,cubeAx,cubeAy,cubeAz,
    {fill:ghost?'rgba(0,240,255,.07)':'rgba(0,240,255,.24)',stroke:'rgba(0,240,255,.95)',lw:1.6});
  const q=cam.project(cc,w,h);
  textC(ctx,'m',q.x,q.y,{size:13,color:'#062a33',align:'center',weight:800});
  /* 四个力（共点：方块中心） */
  arrow3(ctx,cam,w,h,cc,gEnd,{color:'#FF4D5E',label:'G',labelDy:16});
  arrow3(ctx,cam,w,h,cc,V.add(cc,V.mul(nS,N2*u)),{color:'#00F0FF',label:'N₂'});
  arrow3(ctx,cam,w,h,cc,V.add(cc,V.mul(vD,N1*u)),{color:'#9B4DFF',label:'N₁'});
  arrow3(ctx,cam,w,h,cc,V.add(cc,V.mul(uD,-f*u)),{color:'#C8FF00',label:'f',labelDy:16});
  /* 角度：α 在左下角，45° 在左上角 */
  arc3(ctx,cam,w,h,p00,[0,0,-1],[0,1,0],1.9,0,a,{color:'#FFD166',label:'α='+alpha+'°',lr:1.55});
  arc3(ctx,cam,w,h,p10,[1,0,0],uD,1.6,0,Math.PI/4,{color:'rgba(255,209,102,.85)',label:'45°',lr:1.6,size:11.5});
  textC(ctx,'N₁ = f = (√2/2)G·sinα    N₂ = G·cosα',w-18,24,{size:13.5,color:'#FF2D8F',align:'right',weight:700});
  sec.querySelector('#ro2a').textContent=N1.toFixed(2)+' N';
  sec.querySelector('#ro2b').textContent=N2.toFixed(2)+' N';
  sec.querySelector('#ro2c').textContent=f.toFixed(2)+' N';
  sec.querySelector('#ro2d').textContent=(phi/D2R).toFixed(1)+'°';
}
makeLoop('z2',draw,()=>!cam.settled());
})();
</script>

<script>
/* ================= ZONE 03 · 木板双翻转 ================= */
(function(){
const sec=document.getElementById('sec-z3');
sec.innerHTML=
'<div class="stitle"><span class="step">ZONE 03</span><h2>木板双翻转 · 斜面等效与静摩擦</h2><span class="badge">必修一 · 摩擦力 · 竞赛思维</span></div>'+
'<p class="sdesc">正方形木板平放桌面，中央放一小方块。先以边 A 为轴抬起 <b>α=30°</b>，再以边 B（与 A 相邻）为轴向远离桌面方向转 <b>β=30°</b>。两次转动后板面与水平面夹角 γ 满足 <b>cosγ = cosα·cosβ = 3/4</b>，静摩擦 f = mg·sinγ = <b>(√7/4)mg</b>。点「演示翻转」看完整过程。</p>'+
'<div class="lab">'+
  '<div class="panel"><h4>三维舞台 · 可拖拽旋转</h4>'+
    '<canvas class="stage" id="cv3" style="aspect-ratio:16/10.2"></canvas>'+
    '<div class="legend">'+
      '<span><i style="background:#FF4D5E"></i>重力 mg</span>'+
      '<span><i style="background:#00F0FF"></i>支持力 N</span>'+
      '<span><i style="background:#C8FF00"></i>静摩擦 f</span>'+
      '<span><i style="background:#FFD166"></i>角度弧 α / β / γ</span>'+
      '<span><i style="background:rgba(255,255,255,.45)"></i>虚线 · 初始位置/分解</span>'+
    '</div>'+
  '</div>'+
  '<div class="panel"><h4>控制台</h4>'+
    '<div class="ctrl"><div class="btnrow">'+
      '<button class="btn primary" id="play3">▶ 演示翻转</button>'+
      '<button class="btn" id="rst3">复位</button>'+
    '</div></div>'+
    '<div class="ctrl"><label>翻转进程（阶段①绕A → 阶段②绕B）<output id="t3v">完成</output></label>'+
      '<input type="range" id="t3" min="0" max="2" step="0.01" value="2"></div>'+
    '<div class="ctrl"><label>α（绕边 A）<output id="a3v">30°</output></label>'+
      '<input type="range" id="a3" min="10" max="60" step="1" value="30"></div>'+
    '<div class="ctrl"><label>β（绕边 B）<output id="b3v">30°</output></label>'+
      '<input type="range" id="b3" min="10" max="60" step="1" value="30"></div>'+
    '<div class="ctrl"><label>方块质量 m<output id="m3v">1.0 kg</output></label>'+
      '<input type="range" id="m3" min="0.5" max="3" step="0.1" value="1"></div>'+
    viewBarHTML()+ghostHTML()+auxHTML()+
    '<div class="readout">'+
      '<div class="ro"><div class="k">板面倾角 γ</div><div class="v" id="ro3a">—</div></div>'+
      '<div class="ro"><div class="k">cosγ = cosα·cosβ</div><div class="v" id="ro3b">—</div></div>'+
      '<div class="ro"><div class="k">静摩擦 f = mg·sinγ</div><div class="v" id="ro3c">—</div></div>'+
      '<div class="ro"><div class="k">支持力 N = mg·cosγ</div><div class="v" id="ro3d">—</div></div>'+
    '</div>'+
    '<div class="knote"><b>等效斜面</b>：两次翻转的合成效果 = 一块倾角 γ 的斜面'+
      '<div class="fx">cos γ <span class="eq">=</span> cos α·cos β <span class="eq">=</span> <span class="frac"><span class="num">√3</span><span class="den">2</span></span>·<span class="frac"><span class="num">√3</span><span class="den">2</span></span> <span class="eq">=</span> <span class="frac"><span class="num">3</span><span class="den">4</span></span></div>'+
      '<div class="fx">f <span class="eq">=</span> mg·sin γ <span class="eq">=</span> mg·<span class="frac"><span class="num">√7</span><span class="den">4</span></span> <span class="eq">≈</span> <span class="hl">0.661 mg</span></div>'+
      '<b>为什么乘两次余弦</b>：第二次转动给法向量新增的分量（图中橙色「水平增量」段）完全水平，不贡献竖直高度，所以法向量的竖直投影只在 cosα 基础上<b>再乘 cosβ</b>。易错：γ ≠ α+β，也 ≠ √(α²+β²)；摩擦沿板面「最陡上升方向」，不沿任何边！</div>'+
  '</div>'+
'</div>';
const cv=sec.querySelector('#cv3');
const cam=new OrbitCam(cv,{az:.62,el:.4,dist:11.8,target:[0,1.6,0]});
const views={iso:[.62,.4,11.8,[0,1.6,0]],front:[0,.18,11.5,[0,1.4,0]],side:[Math.PI/2,.18,11.5,[0,1.4,0]],top:[.62,1.45,13.5,[0,.6,0]]};
let ghost=false,showAux=true,alpha=30,beta=30,m=1,tprog=2,playing=false,trails=[],lastTp=2,lastPush=0,maxTp=2;
bindCommon(sec,cam,views,g=>ghost=g,a=>showAux=a);
const t3=sec.querySelector('#t3');
t3.oninput=e=>{tprog=+e.target.value;playing=false;syncT();};
function syncT(){sec.querySelector('#t3v').textContent=tprog<1?'阶段① 绕A':(tprog<2?'阶段② 绕B':'完成');}
sec.querySelector('#a3').oninput=e=>{alpha=+e.target.value;sec.querySelector('#a3v').textContent=alpha+'°';};
sec.querySelector('#b3').oninput=e=>{beta=+e.target.value;sec.querySelector('#b3v').textContent=beta+'°';};
sec.querySelector('#m3').oninput=e=>{m=+e.target.value;sec.querySelector('#m3v').textContent=m.toFixed(1)+' kg';};
sec.querySelector('#play3').onclick=()=>{tprog=0;playing=true;};
sec.querySelector('#rst3').onclick=()=>{tprog=0;playing=false;syncT();t3.value=0;};
const S=3, THB=.22, AC=1.4;                 // 板半边长 / 板厚 / 方块边长
function xform(p,a1,a2){
  // 阶段①：绕边 A（直线 x=-S，轴方向 z）转角 a1，转轴参考点共享角点 pC=(-S,0,-S)
  const pC=[-S,0,-S];
  let q=V.add(pC,V.rot(V.sub(p,pC),[0,0,1],a1));
  if(a2>0){
    // 阶段②：绕边 B（第一次转动后的边 z=-S，轴方向 = rot(x̂)）
    const bAxis=V.rot([1,0,0],[0,0,1],a1);
    q=V.add(pC,V.rot(V.sub(q,pC),bAxis,-a2));
  }
  return q;
}
function draw(t,dt){
  const {w,h,ctx}=fitCanvas(cv);
  if(playing){tprog+=dt*.55;if(tprog>=2){tprog=2;playing=false;}t3.value=tprog;syncT();}
  cam.begin();ctx.clearRect(0,0,w,h);
  grid3(ctx,cam,w,h,{size:17,div:17,alpha:.09});
  const a1=alpha*D2R*Math.min(tprog,1), a2=beta*D2R*Math.max(0,Math.min(tprog-1,1));
  const G=10*m, u=2.4/G;
  /* 幽灵板绘制器：拖影与阶段残影共用 */
  function ghostBoard(aa1,aa2,color,lw,dash,withCube){
    const bc2=xform([0,THB/2,0],aa1,aa2);
    const ax2=V.sub(xform([S,THB/2,0],aa1,aa2),bc2);
    const ay2=V.sub(xform([0,THB,0],aa1,aa2),bc2);
    const az2=V.sub(xform([0,THB/2,S],aa1,aa2),bc2);
    boxFaces(bc2,ax2,ay2,az2).forEach(f=>{for(let i=0;i<4;i++)seg3(ctx,cam,w,h,f[i],f[(i+1)%4],color,lw,dash);});
    if(withCube){
      const cc2=xform([0,THB+AC/2,0],aa1,aa2);
      const cx2=V.mul(V.norm(V.sub(xform([AC/2,THB+AC/2,0],aa1,aa2),cc2)),AC/2);
      const cy2=V.mul(V.norm(V.sub(xform([0,THB+AC,0],aa1,aa2),cc2)),AC/2);
      const cz2=V.mul(V.norm(V.sub(xform([0,THB+AC/2,AC/2],aa1,aa2),cc2)),AC/2);
      boxFaces(cc2,cx2,cy2,cz2).forEach(f=>{for(let i=0;i<4;i++)seg3(ctx,cam,w,h,f[i],f[(i+1)%4],color,lw,dash);});
    }
  }
  /* 运动拖影：拉动进度时保留轨迹数秒 */
  const nowMs=performance.now();
  if(Math.abs(tprog-lastTp)>0.002){
    if(nowMs-lastPush>110){trails.push({a1:alpha*D2R*Math.min(lastTp,1),a2:beta*D2R*Math.max(0,Math.min(lastTp-1,1)),t:nowMs});lastPush=nowMs;}
    lastTp=tprog;
  }
  maxTp=Math.max(maxTp,tprog);
  trails=trails.filter(tr=>nowMs-tr.t<2600);
  trails.forEach(tr=>{
    const al=.5*(1-(nowMs-tr.t)/2600);
    ghostBoard(tr.a1,tr.a2,'rgba(255,200,90,'+al.toFixed(3)+')',1.2,null,false);
  });
  // 初始板位置（虚线残影，始终保留）
  if(tprog>.02){
    const c0=[[-S,0,-S],[S,0,-S],[S,0,S],[-S,0,S]];
    face3(ctx,cam,w,h,c0,{fill:null,stroke:'rgba(255,255,255,.4)',lw:1.3,dash:[5,5]});
  }
  /* 阶段残影：一翻完成态（琥珀虚线）；回拖时最终态（绿虚线） */
  if(tprog>1.02)ghostBoard(alpha*D2R,0,'rgba(255,200,90,.45)',1.4,[5,5],true);
  if(maxTp>=1.99&&tprog<1.98)ghostBoard(alpha*D2R,beta*D2R,'rgba(200,255,0,.4)',1.4,[5,5],true);
  // 板（局部坐标→变换）
  const bc0=[0,THB/2,0];
  const bax=[S,0,0],bay=[0,THB/2,0],baz=[0,0,S];
  const bc=xform(bc0,a1,a2);
  const baxx=V.sub(xform([S,THB/2,0],a1,a2),bc);
  const bayy=V.sub(xform([0,THB,0],a1,a2),bc);
  const bazz=V.sub(xform([0,THB/2,S],a1,a2),bc);
  const nB=V.norm(bayy);                     // 板法向
  drawBox(ctx,cam,w,h,bc,baxx,V.mul(bayy,1),bazz,
    {fill:ghost?'rgba(255,184,0,.06)':'rgba(255,184,0,.15)',stroke:'rgba(255,200,90,.85)',lw:1.4});
  // 边 A、边 B 高亮
  const eA0=xform([-S,0,-S],a1,a2),eA1=xform([-S,0,S],a1,a2);
  const eB0=xform([-S,0,-S],a1,a2),eB1=xform([S,0,-S],a1,a2);
  seg3(ctx,cam,w,h,eA0,eA1,'#FFD166',3);
  seg3(ctx,cam,w,h,eB0,eB1,'#FF8C42',3);
  const qa=cam.project(V.lerp?V.add(eA0,[0,.5,0]):eA0,w,h);
  textC(ctx,'A',qa.x,qa.y-8,{size:13,color:'#FFD166',weight:800});
  const qb=cam.project(V.add(eB1,[.4,.4,0]),w,h);
  textC(ctx,'B',qb.x,qb.y-8,{size:13,color:'#FF8C42',weight:800});
  // 方块
  const cc0=[0,THB+AC/2,0];
  const cc=xform(cc0,a1,a2);
  const cax=V.mul(V.norm(V.sub(xform([AC/2,THB+AC/2,0],a1,a2),cc)),AC/2);
  const cay=V.mul(V.norm(V.sub(xform([0,THB+AC,0],a1,a2),cc)),AC/2);
  const caz=V.mul(V.norm(V.sub(xform([0,THB+AC/2,AC/2],a1,a2),cc)),AC/2);
  drawBox(ctx,cam,w,h,cc,cax,cay,caz,
    {fill:ghost?'rgba(0,240,255,.06)':'rgba(0,240,255,.22)',stroke:'rgba(0,240,255,.9)',lw:1.5});
  const q=cam.project(cc,w,h);
  textC(ctx,'m',q.x,q.y,{size:13,color:'#062a33',align:'center',weight:800});
  // 角度弧：α 在边A中点处（垂直A的截面内）
  if(a1>.02){
    const mA=V.mul(V.add(eA0,eA1),.5);
    arc3(ctx,cam,w,h,mA,[1,0,0],[0,1,0],1.7,0,a1,{color:'#FFD166',label:'α',lr:1.5});
  }
  if(a2>.02){
    const bAxis=V.rot([1,0,0],[0,0,1],a1);
    const inB2=V.rot([0,0,1],bAxis,-a2);
    const mB=V.mul(V.add(eB0,eB1),.5);
    arc3(ctx,cam,w,h,mB,[0,0,1],inB2,1.35,0,a2,{color:'#FF8C42',label:'β',lr:1.55});
  }
  // 力的分析（始终显示当前倾角下）
  const cg=Math.max(0,V.dot(nB,[0,1,0]));
  const gam=Math.acos(Math.min(1,cg));
  const N=G*cg, f=G*Math.sin(gam);
  // 最陡上升方向 = 板面内 ⊥ 等效坡脚线，指向高：proju of +y onto plane
  const uphill=V.norm(V.sub([0,1,0],V.mul(nB,cg)));
  arrow3(ctx,cam,w,h,cc,V.add(cc,[0,-G*u,0]),{color:'#FF4D5E',label:'mg',labelDy:16});
  arrow3(ctx,cam,w,h,cc,V.add(cc,V.mul(nB,N*u)),{color:'#00F0FF',label:'N'});
  arrow3(ctx,cam,w,h,cc,V.add(cc,V.mul(uphill,f*u)),{color:'#C8FF00',label:'f'});
  // 分解虚线
  const gEnd=V.add(cc,[0,-G*u,0]);
  if(showAux){
    const tN=V.add(cc,V.mul(nB,-N*u)), tF=V.add(cc,V.mul(uphill,-f*u));
    seg3(ctx,cam,w,h,gEnd,tN,'rgba(255,255,255,.55)',1.3,[4,4]);
    seg3(ctx,cam,w,h,gEnd,tF,'rgba(255,255,255,.55)',1.3,[4,4]);
    seg3(ctx,cam,w,h,tN,tF,'rgba(255,255,255,.3)',1,[3,4]);
    /* 转轴延长线 */
    const dA=V.norm(V.sub(eA1,eA0)), dB=V.norm(V.sub(eB1,eB0));
    seg3(ctx,cam,w,h,V.add(eA0,V.mul(dA,-2)),V.add(eA1,V.mul(dA,2)),'rgba(255,209,102,.45)',1.2,[6,5]);
    seg3(ctx,cam,w,h,V.add(eB0,V.mul(dB,-2)),V.add(eB1,V.mul(dB,2)),'rgba(255,140,66,.45)',1.2,[6,5]);
    /* 方块中心 → 地面垂线 + 投影点 */
    const cproj=[cc[0],0,cc[2]];
    seg3(ctx,cam,w,h,cc,cproj,'rgba(255,255,255,.5)',1.3,[4,4]);
    const qp=cam.project(cproj,w,h);
    ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.arc(qp.x,qp.y,2.8,0,TAU);ctx.fill();
    /* 板面最陡方向线（过方块中心） */
    seg3(ctx,cam,w,h,V.add(cc,V.mul(uphill,-2.4)),V.add(cc,V.mul(uphill,2.4)),'rgba(200,255,0,.4)',1.2,[4,4]);
    /* 方块中心 → 板面垂线 */
    seg3(ctx,cam,w,h,cc,V.add(cc,V.mul(nB,-(AC/2+THB))),'rgba(0,240,255,.45)',1.2,[3,4]);
  }
  // γ 弧：板法向与竖直
  /* —— 角度构造：为什么是 cosγ = cosα·cosβ（固定在公共角点 pC） —— */
  if(showAux){
    const k=2.3, pC=[-S,0,-S];
    const n1d=V.rot([0,1,0],[0,0,1],a1);
    const n1tip=V.add(pC,V.mul(n1d,k));
    seg3(ctx,cam,w,h,pC,V.add(pC,[0,k*1.12,0]),'rgba(255,255,255,.5)',1.3,[5,4]);
    if(a1>.02){
      seg3(ctx,cam,w,h,pC,n1tip,'rgba(0,240,255,.8)',2.2);
      arc3(ctx,cam,w,h,pC,[0,1,0],n1d,1.2,0,a1,{color:'#FFD166',label:'α',lr:1.45});
      const P1=V.add(pC,[0,k*Math.cos(a1),0]);
      seg3(ctx,cam,w,h,n1tip,P1,'rgba(255,255,255,.45)',1.2,[4,4]);
      const qP1=cam.project(P1,w,h);
      textC(ctx,'cosα',qP1.x-9,qP1.y-4,{size:12.5,color:'#FFD166',align:'right',weight:700});
    }
    if(a2>.02){
      const n2tip=V.add(pC,V.mul(nB,k));
      arrow3(ctx,cam,w,h,pC,n2tip,{color:'#00F0FF',lw:2.6,label:'n',labelDx:8,labelDy:-8});
      arc3(ctx,cam,w,h,pC,n1d,nB,1.7,0,a2,{color:'#FF8C42',label:'β',lr:1.45});
      arc3(ctx,cam,w,h,pC,[0,1,0],nB,2.35,0,gam,{color:'#C8FF00',label:'γ',lr:1.28});
      const Q=V.add(pC,V.mul(n1d,k*Math.cos(a2)));
      const P2=V.add(pC,[0,k*Math.cos(a1)*Math.cos(a2),0]);
      seg3(ctx,cam,w,h,n1tip,Q,'rgba(0,240,255,.45)',1.2,[3,4]);
      seg3(ctx,cam,w,h,Q,n2tip,'rgba(255,140,66,.95)',2,[6,4]);
      seg3(ctx,cam,w,h,Q,P2,'rgba(255,255,255,.35)',1.1,[3,4]);
      seg3(ctx,cam,w,h,n2tip,P2,'rgba(255,255,255,.45)',1.2,[4,4]);
      const qQ=cam.project(V.mul(V.add(Q,n2tip),.5),w,h);
      textC(ctx,'水平增量',qQ.x+10,qQ.y-16,{size:11.5,color:'#FF8C42',weight:700});
      const qP2=cam.project(P2,w,h);
      textC(ctx,'cosα·cosβ',qP2.x+11,qP2.y+16,{size:12.5,color:'#C8FF00',weight:700});
    }
  }
  textC(ctx,'cosγ = cosα·cosβ · f = (√7/4)mg',w-18,24,{size:13.5,color:'#FFB800',align:'right',weight:700});
  sec.querySelector('#ro3a').textContent=(gam/D2R).toFixed(2)+'°';
  sec.querySelector('#ro3b').textContent=cg.toFixed(4);
  sec.querySelector('#ro3c').textContent=f.toFixed(2)+' N ('+(f/G).toFixed(3)+'·mg)';
  sec.querySelector('#ro3d').textContent=N.toFixed(2)+' N';
}
makeLoop('z3',draw,()=>playing||trails.length>0||!cam.settled());
})();
</script>

<script>
/* ================= ZONE 04 · 晾衣绳（2D） ================= */
(function(){
const sec=document.getElementById('sec-z4');
sec.innerHTML=
'<div class="stitle"><span class="step">ZONE 04</span><h2>晾衣绳 · 光滑挂钩的动态平衡</h2><span class="badge">必修一 · 共点力平衡</span></div>'+
'<p class="sdesc">一根轻绳两端系在两杆上，衣服用<b>光滑挂钩</b>挂在绳上。同一根绳 ⟹ 两侧张力相等 T；水平平衡 ⟹ 两绳与竖直夹角相等 θ。几何约束给出 <b>sinθ = d/L</b>——只由杆距与绳长决定，<b>与悬点高低无关</b>。进阶：悬点 b 匀速上升时，悬挂点 O 的速度如何合成？</p>'+
'<div class="lab">'+
  '<div class="panel"><h4>平面舞台</h4>'+
    '<canvas class="stage" id="cv4" style="aspect-ratio:16/10.4"></canvas>'+
    '<div class="legend">'+
      '<span><i style="background:#00F0FF"></i>绳张力 T</span>'+
      '<span><i style="background:#FF4D5E"></i>重力 mg / 速度 v_O</span>'+
      '<span><i style="background:#C8FF00"></i>速度沿绳分量</span>'+
      '<span><i style="background:rgba(255,255,255,.45)"></i>虚线 · 辅助/分量</span>'+
    '</div>'+
  '</div>'+
  '<div class="panel"><h4>控制台</h4>'+
    '<div class="ctrl"><label>杆间距 d（绳长 L=4 m 固定）<output id="d4v">3.46 m</output></label>'+
      '<input type="range" id="d4" min="1.2" max="3.85" step="0.01" value="3.464"></div>'+
    '<div class="ctrl"><label>左悬点 a 高度<output id="ha4v">3.80 m</output></label>'+
      '<input type="range" id="ha4" min="1.2" max="4.4" step="0.05" value="3.8"></div>'+
    '<div class="ctrl"><label>右悬点 b 高度<output id="hb4v">3.80 m</output></label>'+
      '<input type="range" id="hb4" min="1.2" max="4.6" step="0.05" value="3.8"></div>'+
    '<div class="ctrl"><label>衣服质量 m<output id="m4v">1.0 kg</output></label>'+
      '<input type="range" id="m4" min="0.5" max="3" step="0.1" value="1"></div>'+
    '<div class="ctrl"><label>进阶 · 悬点匀速运动</label><div class="btnrow">'+
      '<button class="btn primary" id="play4">▶ 仅 b 匀速</button>'+
      '<button class="btn primary" id="play4b">▶ a、b 同上·速度不等</button>'+
      '<button class="btn" id="pause4">⏸ 暂停</button>'+
    '</div>'+
    '<div style="margin-top:8px"><label>a 端速度 v_a（同上模式）<output id="va4v">3.0 m/s</output></label>'+
      '<input type="range" id="va4" min="0.2" max="4" step="0.1" value="3"></div>'+
    '<div style="margin-top:4px"><label>b 端速度 v_b<output id="v4v">1.0 m/s</output></label>'+
      '<input type="range" id="v4" min="0.2" max="4" step="0.1" value="1"></div>'+
    '<div style="margin-top:6px"><label>同上模式 · 分析法</label><div class="btnrow">'+
      '<button class="btn mini sel" id="anaB">B 参考系法</button>'+
      '<button class="btn mini" id="anaC">分量法</button>'+
    '</div></div></div>'+
    '<div class="readout">'+
      '<div class="ro"><div class="k">绳角 θ = asin(d/L)</div><div class="v" id="ro4a">—</div></div>'+
      '<div class="ro"><div class="k">张力 T = mg/(2cosθ)</div><div class="v" id="ro4b">—</div></div>'+
      '<div class="ro"><div class="k">左绳 l_a / 右绳 l_b</div><div class="v" id="ro4c" style="font-size:13px">—</div></div>'+
      '<div class="ro"><div class="k">悬挂点速度 v_O</div><div class="v" id="ro4d">—</div></div>'+
    '</div>'+
    '<div class="knote"><b>结论一</b>：sinθ = d/L，T = mg/(2cosθ)。上下移动悬点，<b>θ 与 T 都不变</b>（挂钩自动平移）；拉大杆距 d → θ↑ → T 急增（d→L 时 T→∞）。'+
    '<div class="divider"></div><b>结论二（进阶）</b>：b 以 v 匀速上升，绳长不变 ⟹ 右绳伸长率 = 左绳缩短率，O 只能<b>沿左绳方向</b>运动：'+
      '<div class="fx">v<span class="dn">O</span> <span class="eq">=</span> <span class="frac"><span class="num">v</span><span class="den">2cos θ</span></span>，竖直分量 <span class="eq">=</span> <span class="frac"><span class="num">v</span><span class="den">2</span></span>，水平分量 <span class="eq">=</span> <span class="frac"><span class="num">v</span><span class="den">2</span></span>·tan θ</div>'+
      '处理技巧：把 v 向「沿绳/垂绳」分解，沿绳分量 v·cosθ 全部转化为另一侧的收绳速度。'+
      '<div class="divider"></div><b>结论三（a、b 同上，v_a ≠ v_b）</b>：两端速度各自向绳方向投影，由绳长不变联立 ⟹'+
      '<div class="fx">v<span class="dn">O,y</span> <span class="eq">=</span> <span class="frac"><span class="num">v_a + v_b</span><span class="den">2</span></span>，v<span class="dn">O,x</span> <span class="eq">=</span> <span class="frac"><span class="num">v_a − v_b</span><span class="den">2</span></span>·tan θ</div>'+
      '竖直分量 = 两端<b>平均速度</b>；水平分量偏向<b>慢端</b>。特例 v_a = v_b：水平分量为零，衣服纯竖直上升且速度等于端点速度。'+
      '<div class="divider"></div><b>参考系法（网友神操作）</b>：以 B 为参考系——B 静止、A 以 V<span class="dn">AB</span> = v_a − v_b 上升，退化为「仅一端动」：'+
      '<div class="fx">V<span class="dn">OB</span> <span class="eq">=</span> <span class="frac"><span class="num">V_AB</span><span class="den">2cos θ</span></span>（沿 OB 绳），v<span class="dn">O</span> <span class="eq">=</span> V<span class="dn">OB</span> <span class="eq">+</span> v<span class="dn">B</span>（矢量合成）</div>'+
      '余弦定理：v² = v_B² + V_OB² − 2v_B·V_OB·cos(180°−θ)。默认数据 v_a=3、v_b=1、θ=60°：V_AB = 2、V_OB = 2，合成 <b>v = √7 m/s</b>！</div>'+
  '</div>'+
'</div>';
const cv=sec.querySelector('#cv4');
const L=4;
let d=3.464,ha=3.8,hb=3.8,m=1,v0=1,va=3,mode=0,dirB=1,dir2=1,ana='B',paused=false;
const $=id=>sec.querySelector(id);
$('#d4').oninput=e=>{d=+e.target.value;$('#d4v').textContent=d.toFixed(2)+' m';};
$('#ha4').oninput=e=>{ha=+e.target.value;$('#ha4v').textContent=ha.toFixed(2)+' m';};
$('#hb4').oninput=e=>{hb=+e.target.value;$('#hb4v').textContent=hb.toFixed(2)+' m';};
$('#m4').oninput=e=>{m=+e.target.value;$('#m4v').textContent=m.toFixed(1)+' kg';};
$('#v4').oninput=e=>{v0=+e.target.value;$('#v4v').textContent=v0.toFixed(2)+' m/s';};
$('#play4').onclick=()=>{mode=1;paused=false;$('#pause4').textContent='⏸ 暂停';};
$('#play4b').onclick=()=>{mode=2;paused=false;$('#pause4').textContent='⏸ 暂停';};
$('#pause4').onclick=()=>{paused=!paused;$('#pause4').textContent=paused?'▶ 继续':'⏸ 暂停';};
$('#va4').oninput=e=>{va=+e.target.value;$('#va4v').textContent=va.toFixed(1)+' m/s';};
$('#anaB').onclick=()=>{ana='B';$('#anaB').classList.add('sel');$('#anaC').classList.remove('sel');};
$('#anaC').onclick=()=>{ana='C';$('#anaC').classList.add('sel');$('#anaB').classList.remove('sel');};
function ar2(ctx,x1,y1,x2,y2,color,lw,label,dx,dy){
  ctx.save();ctx.shadowColor=color;ctx.shadowBlur=10;
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),hd=9;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hd*Math.cos(a-.42),y2-hd*Math.sin(a-.42));
  ctx.lineTo(x2-hd*Math.cos(a+.42),y2-hd*Math.sin(a+.42));
  ctx.closePath();ctx.fill();ctx.restore();
  if(label){ctx.save();ctx.shadowColor=color;ctx.shadowBlur=7;ctx.fillStyle=color;
    ctx.font='700 13px "Cambria Math",serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(label,x2+(dx||8),y2+(dy||-8));ctx.restore();}
}
function dash2(ctx,x1,y1,x2,y2,color,lw){
  ctx.strokeStyle=color;ctx.lineWidth=lw||1.1;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
}
function draw(t,dt){
  const {w,h,ctx}=fitCanvas(cv);
  ctx.clearRect(0,0,w,h);
  /* b 点匀速往复 */
  const sMax=Math.sqrt(L*L-d*d)-.25;
  if(!paused&&mode===1){
    hb+=dirB*v0*dt*.45;
    if(hb>ha+sMax){hb=ha+sMax;dirB=-1;}
    if(hb<Math.max(1.1,ha-sMax)){hb=Math.max(1.1,ha-sMax);dirB=1;}
    $('#hb4').value=hb;$('#hb4v').textContent=hb.toFixed(2)+' m';
  }else if(!paused&&mode===2){
    const nha=ha+dir2*va*dt*.3, nhb=hb+dir2*v0*dt*.3;
    if(nha<1.15||nha>4.35||nhb<1.15||nhb>4.55||Math.abs(nhb-nha)>sMax){dir2*=-1;}
    else{ha=nha;hb=nhb;}
    $('#ha4').value=ha;$('#ha4v').textContent=ha.toFixed(2)+' m';
    $('#hb4').value=hb;$('#hb4v').textContent=hb.toFixed(2)+' m';
  }
  hb=Math.min(Math.max(hb,Math.max(1.1,ha-sMax)),ha+sMax);
  ha=Math.min(Math.max(ha,1.1),4.5);
  /* 布局换算 */
  const sc=Math.min((w-110)/(d+1.6),(h-110)/5.9);
  const iPad=mode>0?330:40;
  const oxp=Math.max(56,(w-iPad-d*sc)/2+20), oyp=h-60;
  const X=x=>oxp+x*sc, Y=y=>oyp-y*sc;
  /* 物理 */
  const sTH=Math.min(.985,d/L), TH=Math.asin(sTH), cTH=Math.cos(TH);
  const la=(L+(ha-hb)/cTH)/2, lb=L-la;
  const Ox=la*sTH, Oy=ha-la*cTH;
  const G=10*m, T=G/(2*cTH), k=1.7/G;
  /* 地面 */
  ctx.strokeStyle='rgba(140,180,255,.25)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(20,Y(0));ctx.lineTo(w-20,Y(0));ctx.stroke();
  ctx.lineWidth=1;
  for(let gx=.4;gx<d+1.4;gx+=.4){ctx.beginPath();ctx.moveTo(X(gx),Y(0));ctx.lineTo(X(gx-.18),Y(-.22));ctx.stroke();}
  /* 两杆 */
  [[0,'M'],[d,'N']].forEach(([px,nm])=>{
    const g=ctx.createLinearGradient(X(px)-6,0,X(px)+6,0);
    g.addColorStop(0,'#3a3f4d');g.addColorStop(.5,'#8b93a5');g.addColorStop(1,'#2c303b');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.roundRect(X(px)-6,Y(5.2),12,5.2*sc,4);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.stroke();
    textC(ctx,nm,X(px),Y(5.45),{size:15,color:'#fff',weight:800,align:'center'});
  });
  /* d 标注 */
  const yd=Y(.3);
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.2;
  ar2(ctx,X(.15),yd,X(d-.15),yd,'rgba(255,255,255,.5)',1.2);
  ar2(ctx,X(d-.15),yd,X(.15),yd,'rgba(255,255,255,.5)',1.2);
  ctx.fillStyle='rgba(10,10,16,.8)';
  ctx.beginPath();ctx.roundRect(X(d/2)-58,yd-24,116,19,9);ctx.fill();
  textC(ctx,'d = '+d.toFixed(2)+' m',X(d/2),yd-14,{size:12.5,color:'rgba(255,255,255,.8)',align:'center',mono:true});
  /* 悬点 */
  [[0,ha,'a'],[d,hb,'b']].forEach(([px,py,nm])=>{
    ctx.fillStyle='#FFD166';ctx.beginPath();ctx.arc(X(px),Y(py),4.5,0,TAU);ctx.fill();
    textC(ctx,nm,X(px)-14,Y(py)+2,{size:14,color:'#FFD166',weight:800,align:'right'});
  });
  /* 绳 */
  ctx.save();ctx.shadowColor='#00F0FF';ctx.shadowBlur=10;
  ctx.strokeStyle='#00E5F0';ctx.lineWidth=2.6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(X(0),Y(ha));ctx.lineTo(X(Ox),Y(Oy));ctx.lineTo(X(d),Y(hb));ctx.stroke();
  ctx.restore();
  /* 挂钩 + 衣服 */
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(X(Ox),Y(Oy),5.5,0,TAU);ctx.stroke();
  ctx.beginPath();ctx.moveTo(X(Ox),Y(Oy)+5.5);ctx.lineTo(X(Ox),Y(Oy)+14);ctx.stroke();
  const sw=.62*sc, sh=.6*sc, sx=X(Ox), sy=Y(Oy)+14;
  ctx.save();ctx.shadowColor='#9B4DFF';ctx.shadowBlur=14;
  ctx.fillStyle='rgba(155,77,255,.4)';ctx.strokeStyle='rgba(190,140,255,.9)';ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(sx-.18*sw,sy);
  ctx.lineTo(sx-.5*sw,sy+.22*sh);ctx.lineTo(sx-.36*sw,sy+.42*sh);
  ctx.lineTo(sx-.30*sw,sy+.3*sh);ctx.lineTo(sx-.30*sw,sy+sh);
  ctx.lineTo(sx+.30*sw,sy+sh);ctx.lineTo(sx+.30*sw,sy+.3*sh);
  ctx.lineTo(sx+.36*sw,sy+.42*sh);ctx.lineTo(sx+.5*sw,sy+.22*sh);
  ctx.lineTo(sx+.18*sw,sy);
  ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  /* 力矢量（O 点） */
  const ax=X(0),ay=Y(ha),bx=X(d),by=Y(hb),ox=X(Ox),oy2=Y(Oy);
  const TaLen=T*k*sc, TbLen=TaLen, gLen=G*k*sc;
  const ua=[(ax-ox)/Math.hypot(ax-ox,ay-oy2),(ay-oy2)/Math.hypot(ax-ox,ay-oy2)];
  const ub=[(bx-ox)/Math.hypot(bx-ox,by-oy2),(by-oy2)/Math.hypot(bx-ox,by-oy2)];
  ar2(ctx,ox,oy2,ox+ua[0]*TaLen,oy2+ua[1]*TaLen,'#00F0FF',3,'T',-6,-12);
  ar2(ctx,ox,oy2,ox+ub[0]*TbLen,oy2+ub[1]*TbLen,'#00F0FF',3,'T',6,-12);
  ar2(ctx,ox,oy2,ox,oy2+gLen,'#FF4D5E',3,'mg',10,10);
  /* 竖直虚线 + θ 弧 */
  dash2(ctx,ox,oy2,ox,Y(Math.max(ha,hb)+.35),'rgba(255,255,255,.45)',1.1);
  [ua,ub].forEach(uu=>{
    const ang=Math.atan2(uu[1],uu[0]);
    const lo=Math.min(ang,-Math.PI/2),hi=Math.max(ang,-Math.PI/2);
    ctx.strokeStyle=mode>0?'rgba(255,209,102,.45)':'#FFD166';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.arc(ox,oy2,(mode>0?.42:.62)*sc,lo,hi);ctx.stroke();
  });
  if(mode===0){
    textC(ctx,'θ',ox-.78*sc,oy2-.5*sc,{size:13,color:'#FFD166',weight:700});
    textC(ctx,'θ',ox+.82*sc,oy2-.5*sc,{size:13,color:'#FFD166',weight:700});
  }
  /* 速度分析 */
  if(mode>0){
    const kv=Math.min(1.35*sc, h*.34/Math.max(va,v0,.5));
    const sva=mode===2?dir2*va:0, svb=(mode===2?dir2:dirB)*v0;
    if(mode===2&&ana==='B'){
      /* ===== B 参考系法 ===== */
      const vab=sva-svb, vob=vab/(2*cTH);
      const vox2=vob*sTH, voy2=svb+vob*cTH, vom2=Math.hypot(vox2,voy2);
      const kv2=.5*sc;
      /* A：相对速度 V_AB */
      ar2(ctx,ax,ay,ax,ay-vab*kv2,'#FFD166',2.8,'V_AB = v_a−v_b',12,-6);
      /* B：牵连速度 v_b */
      ar2(ctx,bx,by,bx,by-svb*kv2,'#ffffff',2.4,'v_b',-34,-4);
      /* O：v_b + V_OB 合成 */
      const btx=ox, bty=oy2-svb*kv2;
      const votx=btx+vox2*kv2, voty=bty-vob*cTH*kv2;
      ar2(ctx,ox,oy2,btx,bty,'#ffffff',2.4,'v_b',10,0);
      if(Math.abs(vob)>.02)ar2(ctx,btx,bty,votx,voty,'#00F0FF',2.8,'V_OB',10,-8);
      ar2(ctx,ox,oy2,votx,voty,'#FF4D5E',3,'v_O',10,-12);
      dash2(ctx,ox,oy2,ox+vox2*kv2,oy2-vob*cTH*kv2,'rgba(0,240,255,.5)',1.1);
      dash2(ctx,ox+vox2*kv2,oy2-vob*cTH*kv2,votx,voty,'rgba(255,255,255,.4)',1.1);
      textC(ctx,'B 参考系 · v_O = v_B + V_OB',w-16,22,{size:12.5,color:'#FF4D5E',align:'right',weight:700});
      /* 插图：矢量合成平行四边形 */
      const iw=296, ih=216, ix=Math.min(X(d)+24,w-iw-16), iy=44;
      ctx.fillStyle='rgba(14,14,22,.82)';ctx.strokeStyle='rgba(255,77,94,.35)';ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(ix,iy,iw,ih,14);ctx.fill();ctx.stroke();
      textC(ctx,'参考系法 · 矢量合成',ix+14,iy+20,{size:12.5,color:'#FF4D5E',weight:800});
      const sc2=96/Math.max(vob,Math.abs(svb),vom2,.1);
      const P0x=ix+80, P0y=iy+146;
      const bPx=P0x, bPy=P0y-svb*sc2;
      const rPx=P0x+vox2*sc2, rPy=P0y-voy2*sc2;
      ar2(ctx,P0x,P0y,bPx,bPy,'#ffffff',2.4,'v_b',8,0);
      if(Math.abs(vob)>.02){
        ar2(ctx,P0x,P0y,P0x+vox2*sc2,P0y-vob*cTH*sc2,'#00F0FF',2.6,'V_OB',8,-8);
        dash2(ctx,bPx,bPy,rPx,rPy,'rgba(255,255,255,.4)',1.1);
        dash2(ctx,P0x+vox2*sc2,P0y-vob*cTH*sc2,rPx,rPy,'rgba(255,255,255,.4)',1.1);
        /* θ 弧（v_b 与 V_OB 间） */
        const a1=Math.atan2(bPy-P0y,bPx-P0x), a2=Math.atan2(-vob*cTH,vox2);
        const lo=Math.min(a1,a2),hi=Math.max(a1,a2);
        ctx.strokeStyle='#FFD166';ctx.lineWidth=1.4;
        ctx.beginPath();ctx.arc(P0x,P0y,24,lo,hi);ctx.stroke();
        textC(ctx,'θ',P0x+20*Math.cos((lo+hi)/2)+14*Math.cos((lo+hi)/2),P0y+30*Math.sin((lo+hi)/2),{size:11.5,color:'#FFD166',weight:700});
      }else{
        textC(ctx,'v_a = v_b：纯竖直上升',P0x+60,P0y-30,{size:12,color:'#C8FF00',weight:700});
      }
      ar2(ctx,P0x,P0y,rPx,rPy,'#FF4D5E',3,'v_O',8,-8);
      const tx1='V_AB = v_a−v_b = '+vab.toFixed(1)+' m/s，V_OB = V_AB/(2cosθ) = '+vob.toFixed(2)+' m/s';
      const tx2='v² = v_B² + V_OB² − 2v_B·V_OB·cos(180°−θ)';
      const tx3='v = '+vom2.toFixed(2)+' m/s'+(Math.abs(vom2-Math.sqrt(7))<.02?'（= √7）':'')+'，tanα = '+(Math.abs(vox2)>.01?((svb+vob*cTH)/Math.abs(vox2)).toFixed(2):'—');
      textC(ctx,tx1,ix+14,iy+ih-46,{size:10.8,color:'rgba(255,255,255,.72)',mono:true});
      textC(ctx,tx2,ix+14,iy+ih-31,{size:10.8,color:'rgba(255,255,255,.55)',mono:true});
      textC(ctx,tx3,ix+14,iy+ih-15,{size:11.5,color:'#FF6B7E',weight:700,mono:true});
    }else{
    /* 端点速度：沿绳/垂绳分解 */
    const endDecomp=(ex,ey,vv,lb2)=>{
      if(Math.abs(vv)<1e-6)return;
      const vw=[0,-vv];
      const eb=[(ox-ex)/Math.hypot(ox-ex,oy2-ey),(oy2-ey)/Math.hypot(ox-ex,oy2-ey)];
      const comp=vw[0]*eb[0]+vw[1]*eb[1];
      const al=[eb[0]*comp,eb[1]*comp], pp=[vw[0]-al[0],vw[1]-al[1]];
      ar2(ctx,ex,ey,ex+vw[0]*kv,ey+vw[1]*kv,'#ffffff',2.6,lb2,10,-4);
      ar2(ctx,ex,ey,ex+al[0]*kv,ey+al[1]*kv,'#C8FF00',2.4,lb2+'·cosθ',12,8);
      ar2(ctx,ex,ey,ex+pp[0]*kv,ey+pp[1]*kv,'rgba(255,255,255,.5)',1.6,lb2+'·sinθ',-8,-12);
      dash2(ctx,ex+vw[0]*kv,ey+vw[1]*kv,ex+al[0]*kv,ey+al[1]*kv,'rgba(255,255,255,.35)',1);
      dash2(ctx,ex+vw[0]*kv,ey+vw[1]*kv,ex+pp[0]*kv,ey+pp[1]*kv,'rgba(255,255,255,.35)',1);
    };
    if(mode===2)endDecomp(ax,ay,sva,'v_a');
    endDecomp(bx,by,svb,mode===2?'v_b':'v');
    /* O 点速度：竖直=(v_a+v_b)/2，水平=(v_a−v_b)/2·tanθ */
    const vox=(sva-svb)/2*sTH/cTH, voy=(sva+svb)/2, vom=Math.max(.05,Math.hypot(vox,voy));
    ar2(ctx,ox,oy2,ox+vox*kv,oy2-voy*kv,'#FF4D5E',3,'v_O',vox<0?-8:10,-14);
    textC(ctx,mode===2?'a、b 同上 · v_O = 平均↑ + 差量→':'b 匀速运动 · v_O 沿左绳',w-16,22,{size:12.5,color:'#FF4D5E',align:'right',weight:700});
    /* 速度合成放大图（插图） */
    const iw=252, ih=196, ix=Math.min(X(d)+24,w-iw-16), iy=44;
    ctx.fillStyle='rgba(14,14,22,.82)';ctx.strokeStyle='rgba(255,77,94,.35)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(ix,iy,iw,ih,14);ctx.fill();ctx.stroke();
    textC(ctx,'速度合成 · 放大图',ix+14,iy+20,{size:12.5,color:'#FF4D5E',weight:800});
    const sV=108/vom;
    const P0x=ix+152, P0y=iy+158;
    const vyPx=voy*sV, vxPx=vox*sV;
    const P1x=P0x, P1y=P0y-vyPx, P2x=P0x+vxPx, P2y=P1y;
    ar2(ctx,P0x,P0y,P1x,P1y,'rgba(255,255,255,.75)',2);
    textC(ctx,mode===2?'(v_a+v_b)/2':'v/2',P0x+9,(P0y+P1y)/2,{size:11.5,color:'rgba(255,255,255,.8)',weight:700});
    ar2(ctx,P1x,P1y,P2x,P2y,'rgba(255,255,255,.55)',1.8);
    ar2(ctx,P0x,P0y,P2x,P2y,'#FF4D5E',2.8,'v_O',vxPx<0?-6:8,vxPx<0?18:-12);
    textC(ctx,mode===2?'(v_a−v_b)/2·tanθ':'(v/2)·tanθ',(P1x+P2x)/2,P1y-11,{size:11.5,color:'rgba(255,255,255,.7)',weight:700,align:'center'});
    if(mode===1){
      const aV=Math.atan2(P2y-P0y,P2x-P0x), aVert=vyPx>=0?-Math.PI/2:Math.PI/2;
      const lo=Math.min(aV,aVert),hi=Math.max(aV,aVert), am=(lo+hi)/2;
      ctx.strokeStyle='#FFD166';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(P0x,P0y,26,lo,hi);ctx.stroke();
      textC(ctx,'θ',P0x+34*Math.cos(am),P0y+34*Math.sin(am),{size:11.5,color:'#FFD166',weight:700});
    }
    textC(ctx,mode===2?'竖直=平均速度，水平偏向慢端':'v_O 方向：沿左绳',ix+14,iy+ih-14,{size:11.5,color:'rgba(255,255,255,.6)'});
    }
  }else{
    textC(ctx,'2T·cosθ = mg · sinθ = d/L',w-16,22,{size:13,color:'#9B4DFF',align:'right',weight:700});
  }
  /* 读数 */
  $('#ro4a').textContent=(TH/D2R).toFixed(2)+'°';
  $('#ro4b').textContent=T.toFixed(2)+' N';
  $('#ro4c').textContent=la.toFixed(2)+' m / '+lb.toFixed(2)+' m';
  $('#ro4d').textContent=mode===0?'—':(mode===1?v0/(2*cTH):Math.hypot((va-v0)/2*sTH/cTH,(va+v0)/2)).toFixed(2)+' m/s';
}
makeLoop('z4',draw,()=>!paused&&mode>0);
})();
</script>

<script>
/* ================= ZONE 05 · V形槽圆柱（3D） ================= */
(function(){
const sec=document.getElementById('sec-z5');
sec.innerHTML=
'<div class="stitle"><span class="step">ZONE 05</span><h2>V形槽中的圆柱 · 三维摩擦分析</h2><span class="badge">必修一 · 力的分解 · 摩擦力</span></div>'+
'<p class="sdesc">圆柱搁在顶角 <b>α=60°</b> 的 V 形槽中，动摩擦因数 μ=0.25。<b>甲</b>：槽水平，沿槽轴方向匀速拉出圆柱——最小拉力多大？<b>乙</b>：装置倾斜使槽轴与水平成 <b>37°</b>，圆柱沿槽下滑——摩擦力多大？拖动 β，看<b>截面等效重力</b>从 mg 变为 mg·cosβ，两侧支持力与总摩擦力随之改变。</p>'+
'<div class="lab">'+
  '<div class="panel"><h4>三维舞台 · 可拖拽旋转</h4>'+
    '<canvas class="stage" id="cv5" style="aspect-ratio:16/10.4"></canvas>'+
    '<div class="legend">'+
      '<span><i style="background:#FF4D5E"></i>重力 mg</span>'+
      '<span><i style="background:#00F0FF"></i>槽侧支持力 N×2</span>'+
      '<span><i style="background:#C8FF00"></i>摩擦力 f=2μN</span>'+
      '<span><i style="background:#FFB800"></i>沿轴分量 mg·sinβ</span>'+
      '<span><i style="background:rgba(255,255,255,.45)"></i>截面分量 mg·cosβ</span>'+
    '</div>'+
  '</div>'+
  '<div class="panel"><h4>控制台</h4>'+
    '<div class="ctrl"><div class="btnrow">'+
      '<button class="btn mini" id="psA">甲 · 水平拉出</button>'+
      '<button class="btn mini sel" id="psB">乙 · 倾斜 37°</button>'+
    '</div></div>'+
    '<div class="ctrl"><label>槽轴倾角 β<output id="b5v">37°</output></label>'+
      '<input type="range" id="b5" min="0" max="45" step="1" value="37"></div>'+
    '<div class="ctrl"><label>V 形槽顶角 α<output id="a5v">60°</output></label>'+
      '<input type="range" id="a5" min="40" max="120" step="5" value="60"></div>'+
    '<div class="ctrl"><label>动摩擦因数 μ<output id="u5v">0.25</output></label>'+
      '<input type="range" id="u5" min="0.05" max="0.5" step="0.01" value="0.25"></div>'+
    '<div class="ctrl"><label>圆柱质量 m<output id="m5v">1.0 kg</output></label>'+
      '<input type="range" id="m5" min="0.5" max="3" step="0.1" value="1"></div>'+
    viewBarHTML()+ghostHTML()+auxHTML()+
    '<div class="readout">'+
      '<div class="ro"><div class="k">单侧支持力 N</div><div class="v" id="ro5a">—</div></div>'+
      '<div class="ro"><div class="k">总摩擦力 f = 2μN</div><div class="v" id="ro5b">—</div></div>'+
      '<div class="ro"><div class="k">沿轴下滑力 mg·sinβ</div><div class="v" id="ro5c">—</div></div>'+
      '<div class="ro"><div class="k">状态</div><div class="v" id="ro5d" style="font-size:13px">—</div></div>'+
    '</div>'+
    '<div class="knote"><b>甲 · 槽水平（β=0）</b>：截面内平衡 2N·sin(α/2) = mg ⟹ N = mg = <b>10 N</b>；两个接触面都有摩擦，'+
      '<div class="fx">F<span class="dn">min</span> <span class="eq">=</span> 2μN <span class="eq">=</span> <span class="frac"><span class="num">μmg</span><span class="den">sin(α/2)</span></span> <span class="eq">=</span> <span class="hl">0.5 mg</span></div>'+
      '<div class="divider"></div><b>乙 · 轴倾 37°</b>：把 mg 按「沿轴 / 截面」正交分解——截面内只剩 mg·cos37° = 0.8mg：'+
      '<div class="fx">N <span class="eq">=</span> <span class="frac"><span class="num">mg·cosβ</span><span class="den">2 sin(α/2)</span></span> <span class="eq">=</span> 0.8mg， f <span class="eq">=</span> 2μN <span class="eq">=</span> <span class="hl">0.4 mg</span></div>'+
      '<div class="fx">mg·sin37° <span class="eq">=</span> 0.6mg <span class="eq">&gt;</span> f ⟹ 圆柱沿槽<b>加速下滑</b></div>'+
      '<b>易错</b>：槽的支持力是两侧<b>各一个 N</b>，先算截面等效重力再按 V 形分解；摩擦力有两个接触面，<b>别漏乘 2</b>；倾斜时 N ≠ mg·cosβ，还要除以 2sin(α/2)！</div>'+
  '</div>'+
'</div>';
const cv=sec.querySelector('#cv5');
const cam=new OrbitCam(cv,{az:.72,el:.46,dist:13.5,target:[-.5,1.8,0]});
const views={iso:[.72,.46,13.5,[-.5,1.8,0]],front:[0,.1,13,[0,1.8,0]],side:[Math.PI/2,.14,13.5,[-.5,1.6,0]],top:[.72,1.45,15,[-.5,.6,0]]};
let ghost=false,showAux=true,beta=37,alp=60,mu=.25,m=1;
bindCommon(sec,cam,views,g=>ghost=g,a=>showAux=a);
const $=id=>sec.querySelector(id);
$('#b5').oninput=e=>{beta=+e.target.value;$('#b5v').textContent=beta+'°';syncPs();};
$('#a5').oninput=e=>{alp=+e.target.value;$('#a5v').textContent=alp+'°';};
$('#u5').oninput=e=>{mu=+e.target.value;$('#u5v').textContent=mu.toFixed(2);};
$('#m5').oninput=e=>{m=+e.target.value;$('#m5v').textContent=m.toFixed(1)+' kg';};
$('#psA').onclick=()=>{beta=0;$('#b5').value=0;$('#b5v').textContent='0°';syncPs();};
$('#psB').onclick=()=>{beta=37;$('#b5').value=37;$('#b5v').textContent='37°';syncPs();};
function syncPs(){
  $('#psA').classList.toggle('sel',beta===0);
  $('#psB').classList.toggle('sel',beta===37);
}
/* 几何与物理 */
const Wf=3.8, HL=4.5, rc=.8, P0=[-4.5,0,0];
function draw(t){
  cam.begin();const {w,h,ctx}=fitCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const bR=beta*D2R, hA=alp/2*D2R;
  const cB=Math.cos(bR), sB=Math.sin(bR);
  const Rv=v=>[v[0]*cB-v[1]*sB, v[0]*sB+v[1]*cB, v[2]];
  const Tf=p=>V.add(P0,Rv(V.sub(p,P0)));
  const sA=Math.sin(hA), cA=Math.cos(hA);
  const dR=[0,cA,sA], dL=[0,cA,-sA], nR=[0,sA,-cA], nL=[0,sA,cA];
  const hc=rc/sA;
  const G=10*m, k=2.2/G;
  const N=G*cB/(2*sA), f=2*mu*N, slide=G*sB;
  /* 地面参考 */
  grid3(ctx,cam,w,h,{});
  face3(ctx,cam,w,h,[[-5.5,0,-3.5],[5.5,0,-3.5],[5.5,0,3.5],[-5.5,0,3.5]],{fill:'rgba(140,180,255,.045)',stroke:'rgba(140,180,255,.18)',lw:1});
  /* 槽两板（盒体） */
  const th=.07;
  const plateR={c:Tf([0,Wf/2*cA,Wf/2*sA]),ax:Rv([HL,0,0]),ay:Rv(V.mul(dR,Wf/2)),az:Rv(V.mul(nR,-th))};
  const plateL={c:Tf([0,Wf/2*cA,-Wf/2*sA]),ax:Rv([HL,0,0]),ay:Rv(V.mul(dL,Wf/2)),az:Rv(V.mul(nL,-th))};
  /* 画家算法：远板先画（不透明），近板留到圆柱之后（半透明罩面） */
  const dpR=V.dot(V.sub(plateR.c,cam._b.eye),cam._b.fwd), dpL=V.dot(V.sub(plateL.c,cam._b.eye),cam._b.fwd);
  const nearR=dpR<dpL;
  const farPl=nearR?plateL:plateR, nearPl=nearR?plateR:plateL;
  drawBox(ctx,cam,w,h,farPl.c,farPl.ax,farPl.ay,farPl.az,{fill:ghost?(nearR?'rgba(22,32,42,.28)':'rgba(40,66,82,.28)'):(nearR?'#16202a':'#284252'),stroke:'rgba(0,229,160,.5)',lw:1.2});
  /* 板口棱线 */
  seg3(ctx,cam,w,h,Tf([-HL,Wf*cA,Wf*sA]),Tf([HL,Wf*cA,Wf*sA]),'rgba(0,229,160,.55)',1.6);
  seg3(ctx,cam,w,h,Tf([-HL,Wf*cA,-Wf*sA]),Tf([HL,Wf*cA,-Wf*sA]),'rgba(0,229,160,.55)',1.6);
  /* 圆柱 */
  const C=Tf([0,hc,0]), aX=Rv([1,0,0]);
  const e1=[0,0,1], e2=Rv([0,1,0]);
  const circ=cc=>{const pts=[];for(let i=0;i<28;i++){const a=i/28*TAU;
    pts.push(V.add(cc,V.add(V.mul(e1,Math.cos(a)*rc),V.mul(e2,Math.sin(a)*rc))));}return pts;};
  const cA1=V.add(C,V.mul(aX,-3)), cA2=V.add(C,V.mul(aX,3));
  const p1=circ(cA1), p2=circ(cA2);
  const d1=V.dot(V.sub(cA1,cam._b.eye),cam._b.fwd), d2=V.dot(V.sub(cA2,cam._b.eye),cam._b.fwd);
  const far=d1>d2?p1:p2, near=d1>d2?p2:p1;
  face3(ctx,cam,w,h,far,{fill:'#7a4a20',stroke:'#a86a35',lw:1.2});
  /* 侧面：逐面片光照 */
  const toCam=V.norm(V.sub(cam._b.eye,C)), ldir=V.norm([-.35,.9,.45]);
  for(let i=0;i<28;i++){
    const a0=i/28*TAU, a1=(i+1)/28*TAU, am=(a0+a1)/2;
    const nrm=V.add(V.mul(e1,Math.cos(am)),V.mul(e2,Math.sin(am)));
    if(V.dot(nrm,toCam)<=0)continue;
    const light=.5+.5*Math.max(0,V.dot(nrm,ldir));
    const P=a=>[V.add(cA1,V.add(V.mul(e1,Math.cos(a)*rc),V.mul(e2,Math.sin(a)*rc))),
                V.add(cA2,V.add(V.mul(e1,Math.cos(a)*rc),V.mul(e2,Math.sin(a)*rc)))];
    const [q0,q3]=P(a0),[q1,q2]=P(a1);
    face3(ctx,cam,w,h,[q0,q1,q2,q3],{fill:ghost?'rgba(200,135,63,'+(0.12+0.2*light).toFixed(3)+')':shade('#c8873f',light)});
  }
  face3(ctx,cam,w,h,near,{fill:ghost?'rgba(216,150,80,.3)':'#d89650',stroke:'#f0b878',lw:1.6});
  /* 槽底棱线（压在圆柱后画，V 形折痕清晰） */
  seg3(ctx,cam,w,h,Tf([-HL,0,0]),Tf([HL,0,0]),'rgba(0,255,190,.9)',2.6);
  /* 近侧槽板：极薄罩面（遮挡感），力矢量在其后再画保持清晰 */
  drawBox(ctx,cam,w,h,nearPl.c,nearPl.ax,nearPl.ay,nearPl.az,{fill:ghost?'rgba(30,46,58,.08)':(nearR?'rgba(40,66,82,.15)':'rgba(22,32,42,.15)'),stroke:'rgba(0,229,160,.6)',lw:1.3});
  /* 中段圆箍线（体积感） */
  [-1.5,0,1.5].forEach(xi=>{
    const cc=V.add(C,V.mul(aX,xi));
    const pts=circ(cc);
    ctx.strokeStyle='rgba(255,220,180,.22)';ctx.lineWidth=1;
    ctx.beginPath();pts.forEach((p,i)=>{const q=cam.project(p,w,h);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});
    ctx.closePath();ctx.stroke();
  });
  /* 接触母线（亮） */
  const cp1=V.add(C,V.mul(Rv(nR),-rc)), cp2=V.add(C,V.mul(Rv(nL),-rc));
  seg3(ctx,cam,w,h,V.add(cp1,V.mul(aX,-3)),V.add(cp1,V.mul(aX,3)),'rgba(200,255,0,.85)',2.4);
  seg3(ctx,cam,w,h,V.add(cp2,V.mul(aX,-3)),V.add(cp2,V.mul(aX,3)),'rgba(200,255,0,.85)',2.4);
  /* 力矢量（共点画法，全部移画到圆柱中心 C） */
  arrow3(ctx,cam,w,h,C,V.add(C,[0,-G*k,0]),{color:'#FF4D5E',label:'mg',labelDy:12});
  arrow3(ctx,cam,w,h,C,V.add(C,V.mul(Rv(nR),N*k)),{color:'#00F0FF',label:'N'});
  arrow3(ctx,cam,w,h,C,V.add(C,V.mul(Rv(nL),N*k)),{color:'#00F0FF',label:'N'});
  arrow3(ctx,cam,w,h,C,V.add(C,V.mul(aX,f*k)),{color:'#C8FF00',label:'f = 2μN',labelDy:-14});
  if(beta>0.5){
    arrow3(ctx,cam,w,h,C,V.add(C,V.mul(aX,-slide*k)),{color:'#FFB800',label:'mg·sinβ',lw:2.4,labelDx:-92,labelDy:14});
    arrow3(ctx,cam,w,h,C,V.add(C,V.mul(e2,-G*cB*k)),{color:'rgba(255,255,255,.55)',label:'mg·cosβ',lw:1.8,labelDy:14});
    /* 分解虚线 */
    const tipG=V.add(C,[0,-G*k,0]);
    const tipS=V.add(C,V.mul(aX,-slide*k));
    const tipC=V.add(C,V.mul(e2,-G*cB*k));
    seg3(ctx,cam,w,h,tipS,tipG,'rgba(255,255,255,.35)',1.1,[4,4]);
    seg3(ctx,cam,w,h,tipC,tipG,'rgba(255,255,255,.35)',1.1,[4,4]);
  }else{
    arrow3(ctx,cam,w,h,C,V.add(C,V.mul(aX,-f*k)),{color:'#FFB800',label:'F = f = 2μN',lw:2.6,labelDx:-130,labelDy:14});
  }
  /* 角度标注 */
  if(beta>0.5)arc3(ctx,cam,w,h,P0,[1,0,0],aX,1.1,0,bR,{label:'β',color:'#FFD166',lr:1.5});
  arc3(ctx,cam,w,h,Tf([HL-.15,0,0]),Rv(dL),Rv(dR),.95,0,alp*D2R,{label:'α',color:'#FFD166',lr:1.55});
  /* 截面辅助 */
  if(showAux){
    const pts=circ(C);
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();pts.forEach((p,i)=>{const q=cam.project(p,w,h);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});
    ctx.closePath();ctx.stroke();ctx.setLineDash([]);
    seg3(ctx,cam,w,h,Tf([0,0,0]),Tf([0,Wf*cA,Wf*sA]),'rgba(255,255,255,.35)',1,[4,4]);
    seg3(ctx,cam,w,h,Tf([0,0,0]),Tf([0,Wf*cA,-Wf*sA]),'rgba(255,255,255,.35)',1,[4,4]);
    seg3(ctx,cam,w,h,C,cp1,'rgba(200,255,0,.4)',1,[3,3]);
    seg3(ctx,cam,w,h,C,cp2,'rgba(200,255,0,.4)',1,[3,3]);
    const q=cam.project(V.add(C,V.mul(e1,-rc*1.6)),w,h);
    textC(ctx,'截面',q.x-16,q.y,{size:12,color:'rgba(255,255,255,.6)'});
  }
  /* 高端支撑虚线 */
  if(beta>0.5){
    const hi=Tf([HL,0,0]);
    seg3(ctx,cam,w,h,hi,[hi[0],0,hi[2]],'rgba(255,255,255,.3)',1.2,[5,4]);
    const qh=cam.project([hi[0],hi[1]/2,hi[2]],w,h);
    textC(ctx,(hi[1]).toFixed(1)+' m',qh.x+8,qh.y,{size:11,color:'rgba(255,255,255,.5)',mono:true});
  }
  /* 状态 */
  let st,stc;
  if(beta<0.5){st='甲 · 匀速拉出：F = 2μN';stc='#FFB800';}
  else if(slide>f){st='⚠ 沿轴加速下滑（mg·sinβ > f）';stc='#FF4D5E';}
  else{st='静止（mg·sinβ ≤ f）';stc='#00E5A0';}
  textC(ctx,st,w-16,22,{size:13,color:stc,align:'right',weight:700});
  /* 读数 */
  $('#ro5a').textContent=N.toFixed(2)+' N';
  $('#ro5b').textContent=f.toFixed(2)+' N';
  $('#ro5c').textContent=slide.toFixed(2)+' N';
  const ro5d=$('#ro5d');ro5d.textContent=st;ro5d.style.color=stc;
}
makeLoop('z5',draw,()=>!cam.settled());
syncPs();
})();
</script>

/* ---------- 单元 2 ---------- */
'<div class="stitle" style="margin-top:34px"><span class="step">6.2</span><h2 style="font-size:21px">相似三角形法 · 滑轮轻杆架</h2><span class="badge">结论：杆 BC 受力不变！</span></div>'+

'<p class="sdesc" style="margin-bottom:12px">两绳 CA、CB 拴住小球，夹角 120° 固定，整个装置顺时针缓转 90°。力三角形中 mg 作弦固定、F₁ 与 F₂ 交汇顶点处内角 60°（= 180°−120°）恒定 ⟹ <b>顶点在固定外接圆上滑动</b>：F₁ 经过<b>直径</b>时最大，CA 转至竖直时 F₂ = 0。虚线圆直接画过球心与重力端点。</p>'+
'<div class="lab">'+
  '<div class="panel"><h4>场景 · 外接圆过球心 C 与 mg 端点</h4><canvas class="stage" id="cv63" style="aspect-ratio:16/8.6"></canvas>'+
  '<div class="legend"><span><i style="background:#FF4D5E"></i>mg</span><span><i style="background:#00F0FF"></i>F₁（CA 绳）</span><span><i style="background:#C8FF00"></i>F₂（CB 绳）</span><span><i style="background:rgba(255,255,255,.4)"></i>虚线 · 外接圆/初态</span></div></div>'+

      '甲站起 ⟹ d 减小 ⟹ θ 减小 ⟹ cosθ 增大 ⟹ <b>T 一直变小（B 正确）</b>；若换更长的杆（d 更大）则同样重物下 T 更大，能挂的最大质量反而更小（D 错误）。</div>'+

'</div>'+

/* ---------- 单元 5 ---------- */
'<div class="stitle" style="margin-top:34px"><span class="step">6.5</span><h2 style="font-size:21px">合力增减判断 · 夹角锐钝分类讨论</h2><span class="badge">高考真题 · 答案：B —— 增大 F₁，F 一定增大</span></div>'+
'<p class="sdesc" style="margin-bottom:12px">两个共点力 F₁、F₂（F₁&gt;F₂）夹角 θ（0°&lt;θ&lt;180°），合力 F。在矢量三角形中让 F₂ 的端点沿其方向滑动：<b>θ 为锐角时，增大 F₂，F 单调增大；θ 为钝角时，F 先减后增</b>——当 <b>F ⊥ F₂ 时 F 取最小值 F₁·sinθ</b>（转折点 F₂ = F₁·|cosθ|）。而增大 F₁ 时，因 F₁&gt;F₂ 保证合矢端点始终右移，F <b>一定</b>增大。点播放让 F₂ 从零长大，右侧固定标尺曲线直接"看见"增减。</p>'+
'<div class="lab">'+
  '<div class="panel"><h4>矢量三角形 + F–F₂ 曲线（固定标尺）</h4><canvas class="stage" id="cv65" style="aspect-ratio:16/8.6"></canvas>'+
  '<div class="legend"><span><i style="background:#00F0FF"></i>F₁</span><span><i style="background:#C8FF00"></i>F₂</span><span><i style="background:#FF4D5E"></i>合力 F</span><span><i style="background:#FFD166"></i>F–F₂ 曲线</span><span><i style="background:rgba(255,255,255,.4)"></i>虚线 · 分量/最小位置</span></div></div>'+
  '<div class="panel"><h4>控制台</h4>'+
    '<div class="ctrl"><div class="btnrow"><button class="btn primary" id="pl65">▶ F₂ 从零增大</button><button class="btn" id="rs65">复位</button></div></div>'+
    '<div class="ctrl"><div class="btnrow"><button class="btn" id="th60">θ=60° 锐角</button><button class="btn" id="th90">θ=90° 直角</button><button class="btn sel" id="th135">θ=135° 钝角</button></div></div>'+
    '<div class="ctrl"><label>夹角 θ<output id="t65v">135°</output></label><input type="range" id="t65" min="10" max="170" step="1" value="135"></div>'+
    '<div class="ctrl"><label>F₁（较大力）<output id="f165v">8.0 N</output></label><input type="range" id="f165" min="4" max="10" step="0.1" value="8"></div>'+
