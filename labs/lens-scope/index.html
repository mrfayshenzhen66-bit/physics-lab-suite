<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>光的旅途 · 望远镜与显微镜 3D 交互实验室</title>
<style>
:root{
  --bg-primary:#0A0A0F; --bg-secondary:#12121A; --bg-tertiary:#1A1A26;
  --glass:rgba(18,18,26,.78); --border:rgba(255,255,255,.07); --border-active:rgba(255,255,255,.16);
  --cyan:#00F0FF; --magenta:#FF2D8F; --lime:#C8FF00; --amber:#FFB800; --violet:#9B4DFF; --emerald:#00E5A0; --orange:#FF6B35;
  --text:#FFF; --text2:rgba(255,255,255,.68); --text3:rgba(255,255,255,.38);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-primary);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% -10%,rgba(0,240,255,.09),transparent 55%),
             radial-gradient(ellipse at 90% 110%,rgba(155,77,255,.06),transparent 50%);}
header{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.hwrap{max-width:1380px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo small{color:var(--text3);font-weight:500;font-size:11px;display:block;letter-spacing:.14em}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{background:transparent;border:1px solid transparent;color:var(--text2);font-size:13px;padding:8px 14px;border-radius:100px;cursor:pointer;transition:all .22s;font-family:inherit;white-space:nowrap}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.05)}
nav.tabs button.on{color:#06121a;font-weight:700;background:var(--ac,#00F0FF);box-shadow:0 0 18px 2px color-mix(in srgb,var(--ac,#00F0FF) 45%,transparent)}
main{max-width:1380px;margin:0 auto;padding:26px 28px 80px;position:relative;z-index:1}
section.tab{display:none;animation:fadeUp .5s cubic-bezier(.22,.9,.3,1)}
section.tab.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.stitle{display:flex;align-items:baseline;gap:14px;margin:6px 0 4px;flex-wrap:wrap}
.stitle h2{font-size:clamp(22px,3vw,30px);font-weight:800}
.stitle .step{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);padding:3px 10px;border-radius:100px;letter-spacing:.1em}
.sdesc{color:var(--text2);font-size:14.5px;line-height:1.8;max-width:960px;margin-bottom:18px}
.sdesc b{color:var(--ac);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media(max-width:980px){.lab{grid-template-columns:1fr}}
.panel{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac,#00F0FF) 55%,transparent),transparent)}
.panel h4{font-size:12px;letter-spacing:.14em;color:var(--text3);text-transform:uppercase;margin-bottom:12px;font-weight:700}
canvas.stage{width:100%;display:block;border-radius:16px;background:#0c0c13;border:1px solid var(--border)}
.ctrl{margin-bottom:16px}.ctrl:last-child{margin-bottom:0}
.ctrl label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text2);margin-bottom:7px}
.ctrl label output{font-family:"JetBrains Mono",monospace;color:var(--ac);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:var(--bg-tertiary);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ac,#00F0FF);box-shadow:0 0 12px color-mix(in srgb,var(--ac,#00F0FF) 55%,transparent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ac,#00F0FF);cursor:pointer}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border-active);background:transparent;color:var(--text2);padding:9px 18px;border-radius:100px;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{border-color:var(--ac);color:#fff}
.btn.primary{background:var(--ac);color:#06121a;font-weight:700;border-color:transparent}
.btn.mini{padding:6px 13px;font-size:12px}
.btn.sel{background:color-mix(in srgb,var(--ac) 18%,transparent);border-color:var(--ac);color:#fff}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.ro{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:12px;padding:9px 12px}
.ro .k{font-size:11px;color:var(--text3)}
.ro .v{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:600;color:var(--ac);margin-top:2px}
.knote{margin-top:14px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);border:1px solid var(--border);border-left:3px solid var(--ac);border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.85;color:var(--text2)}
.knote b{color:#fff}
.knote .f{font-family:"JetBrains Mono",monospace;color:var(--ac);background:rgba(0,0,0,.35);padding:1px 7px;border-radius:6px;font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
footer{border-top:1px solid var(--border);padding:26px;text-align:center;color:var(--text3);font-size:12px;letter-spacing:.08em}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:100px;border:1px solid var(--border-active);color:var(--text3);margin-left:8px;vertical-align:middle}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border-active),transparent);margin:14px 0}
.dstep{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.9;color:var(--text2);opacity:.32;transform:translateX(8px);transition:all .5s;margin-bottom:8px}
.dstep.show{opacity:1;transform:none;border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.dstep .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#06121a;font-weight:800;font-size:11px;margin-right:8px}
.appcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}
.appcard{background:var(--bg-secondary);border:1px solid var(--border);border-radius:16px;padding:14px 16px;transition:all .25s}
.appcard:hover{border-color:color-mix(in srgb,var(--ac) 40%,transparent);transform:translateY(-3px)}
.appcard .ic{font-size:22px;margin-bottom:8px}
.appcard h5{font-size:13.5px;font-weight:700;margin-bottom:5px;color:#fff}
.appcard p{font-size:12px;color:var(--text2);line-height:1.7}
/* —— 部件清单（3D 区联动） —— */
.plist{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.plist button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:12px;padding:8px 12px;color:var(--text2);font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .2s}
.plist button:hover{border-color:var(--border-active);color:#fff}
.plist button.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--ac) 25%,transparent)}
.plist button i{width:10px;height:10px;border-radius:3px;flex:none}
.plist button small{margin-left:auto;color:var(--text3);font-size:10.5px}
/* —— 现象矩阵 —— */
table.matrix{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
table.matrix th,table.matrix td{border:1px solid var(--border);padding:7px 9px;text-align:center;color:var(--text2)}
table.matrix th{background:var(--bg-tertiary);color:#fff;font-weight:600}
table.matrix td.hot{background:color-mix(in srgb,var(--ac) 16%,transparent);color:#fff;font-weight:700;border-color:var(--ac)}
/* —— 历史卡片 —— */
.histgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px}
@media(max-width:520px){.histgrid{grid-template-columns:1fr}}
.histcard{background:var(--bg-secondary);border:1px solid var(--border);border-radius:20px;padding:16px;transition:all .25s}
.histcard:hover{border-color:color-mix(in srgb,var(--ac) 40%,transparent);transform:translateY(-4px)}
.histcard .hh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.histcard .hh b{font-size:16px;color:#fff}
.histcard .hh .yr{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);padding:2px 9px;border-radius:100px}
.histcard .hh .price{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--amber);font-weight:700}
.histcard canvas{width:100%;display:block;border-radius:12px;background:#0a0a11;border:1px solid var(--border);margin:10px 0}
.histcard ul{list-style:none;font-size:12.5px;line-height:1.9;color:var(--text2)}
.histcard ul li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:8px;vertical-align:2px}
.histcard ul li.pro::before{background:var(--emerald)}
.histcard ul li.con::before{background:var(--magenta)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10.5px;padding:2px 9px;border-radius:100px;border:1px solid var(--border-active);color:var(--text3)}
.hint{font-size:12px;color:var(--text3);margin-top:10px;line-height:1.7}
.pillnote{display:inline-block;font-size:11px;color:var(--ac);border:1px dashed color-mix(in srgb,var(--ac) 45%,transparent);padding:3px 11px;border-radius:100px;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo"><div>🔭 光的旅途 · 光学实验室<small>TELESCOPE &amp; MICROSCOPE · 人教版物理 · 透镜及其应用</small></div></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main id="main"></main>
<footer>光的旅途 · 望远镜 × 显微镜 全真交互仿真 · 严格遵循几何光学（折射定律 / 薄透镜成像公式）</footer>

<script>
/* ========== 分区注册 ========== */
const SECTIONS=[
  {id:'z1',num:'01',name:'结构探秘 3D',color:'#00F0FF'},
  {id:'z2',num:'02',name:'剖面光路分析',color:'#9B4DFF'},
  {id:'z3',num:'03',name:'目镜视界',color:'#FF2D8F'},
  {id:'z4',num:'04',name:'百年镜史',color:'#FFB800'},
  {id:'z5',num:'05',name:'射电望远镜',color:'#FF6B35'},
  {id:'z6',num:'06',name:'电子显微镜',color:'#C8FF00'},
  {id:'z7',num:'07',name:'水杯透镜·易错',color:'#00E5A0'},
];
const main=document.getElementById('main'),tabsEl=document.getElementById('tabs');
const loops={};
SECTIONS.forEach(s=>{
  const b=document.createElement('button');
  b.textContent=`${s.num} ${s.name}`;b.style.setProperty('--ac',s.color);
  b.onclick=()=>showTab(s.id);b.dataset.id=s.id;tabsEl.appendChild(b);
  const sec=document.createElement('section');
  sec.className='tab';sec.id='sec-'+s.id;sec.style.setProperty('--ac',s.color);
  main.appendChild(sec);
});
function showTab(id){
  window.__curZone=id;
  SECTIONS.forEach(s=>{
    document.getElementById('sec-'+s.id).classList.toggle('on',s.id===id);
    document.querySelector(`nav.tabs button[data-id="${s.id}"]`).classList.toggle('on',s.id===id);
    if(loops[s.id]){s.id===id?loops[s.id].start():loops[s.id].stop();}
  });
  window.scrollTo({top:0});
}
/* ========== Canvas 工具 ========== */
const TAU=Math.PI*2;
function fitCanvas(cv){
  const dpr=Math.min(window.devicePixelRatio||1,1.5),r=cv.getBoundingClientRect();
  cv.width=Math.max(2,r.width*dpr);cv.height=Math.max(2,r.height*dpr);
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  return {w:r.width,h:r.height,ctx};
}
/* 按需渲染循环：30 FPS 上限；active()=true（动画中）才逐帧渲染，
   否则仅 dirty（滑杆/按钮/resize/切页等状态变化）时渲染一次，静止零重画 */
function makeLoop(id,draw,active){
  let raf=null,last=performance.now(),lastRender=0;
  const st={dirty:true};
  const tick=(now)=>{
    raf=requestAnimationFrame(tick);
    const animating=active?active():true;
    if(!animating&&!st.dirty)return;          // 静止且画面已最新：本帧跳过
    if(now-lastRender<33)return;               // 30 FPS 闸（dirty 保持到下一帧）
    const dt=Math.min(.05,(now-last)/1000);last=now;lastRender=now;st.dirty=false;
    draw(now/1000,dt);
  };
  loops[id]={start(){if(!raf){last=performance.now();st.dirty=true;raf=requestAnimationFrame(tick);}},
             stop(){if(raf){cancelAnimationFrame(raf);raf=null;}},
             poke(){st.dirty=true;}};
}
/* 页面切后台自动暂停，回前台恢复当前栏目 */
document.addEventListener('visibilitychange',()=>{
  const id=window.__curZone;
  if(!id||!loops[id])return;
  if(document.hidden)loops[id].stop();else loops[id].start();
});
/* resize 触发一次 dirty 重绘 */
window.addEventListener('resize',()=>{
  const id=window.__curZone;
  if(id&&loops[id])loops[id].poke();
});
function glow(ctx,c,b=10){ctx.shadowColor=c;ctx.shadowBlur=b;}
function noGlow(ctx){ctx.shadowBlur=0;}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function arrow(ctx,x1,y1,x2,y2,color,lw=2,head=7){
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=lw;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-head*Math.cos(a-.45),y2-head*Math.sin(a-.45));
  ctx.lineTo(x2-head*Math.cos(a+.45),y2-head*Math.sin(a+.45));
  ctx.closePath();ctx.fill();
}
function text(ctx,str,x,y,{size=12,color='rgba(255,255,255,.75)',align='left',weight=500,mono=false}={}){
  ctx.fillStyle=color;ctx.font=`${weight} ${size}px ${mono?'"JetBrains Mono",monospace':'"PingFang SC","Microsoft YaHei",sans-serif'}`;
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(str,x,y);
}
function poly(ctx,pts,fill,stroke,lw=1){
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
}
/* 光脉冲动画：沿折线跑的发光点（全局共享） */
function photons(ctx,lines,t,color){
  lines.forEach(seg=>{
    let total=0;const lens=[];
    for(let i=0;i<seg.length-1;i++){const l=Math.hypot(seg[i+1][0]-seg[i][0],seg[i+1][1]-seg[i][1]);lens.push(l);total+=l;}
    const n=Math.max(2,Math.round(total/90));
    for(let k=0;k<n;k++){
      let d=((t*130+k*total/n)%total), i=0;
      while(i<lens.length-1&&d>lens[i]){d-=lens[i];i++;}
      const r=d/lens[i];
      const x=seg[i][0]+(seg[i+1][0]-seg[i][0])*r, y=seg[i][1]+(seg[i+1][1]-seg[i][1])*r;
      glow(ctx,color,9);ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(x,y,2.2,0,TAU);ctx.fill();noGlow(ctx);
    }
  });
}
function rayLine(ctx,pts,color,lw=1.6,dash=null){
  ctx.save();if(dash)ctx.setLineDash(dash);
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.stroke();ctx.restore();
}
/* ========== 迷你 3D 引擎（拖拽旋转 · 画家算法 · 玻璃透镜质感） ========== */
const V3=(x,y,z)=>({x,y,z});
const add3=(a,b)=>V3(a.x+b.x,a.y+b.y,a.z+b.z);
const sub3=(a,b)=>V3(a.x-b.x,a.y-b.y,a.z-b.z);
const mul3=(a,s)=>V3(a.x*s,a.y*s,a.z*s);
const dot3=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross3=(a,b)=>V3(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const norm3=a=>{const l=Math.hypot(a.x,a.y,a.z)||1;return V3(a.x/l,a.y/l,a.z/l);};
function rotYP(p,yaw,pitch){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cx=Math.cos(pitch),sx=Math.sin(pitch);
  const x1=p.x*cy+p.z*sy, z1=-p.x*sy+p.z*cy, y1=p.y;
  return V3(x1, y1*cx - z1*sx, y1*sx + z1*cx);
}
/* faces: {pts:[V3...], n:V3, c:[r,g,b], a:alpha, part, glass:false, spec:0~1} */
function cylFaces(a,b,r,seg,c,part,opts={}){
  const faces=[];
  const ax=norm3(sub3(b,a));
  const tmp=Math.abs(ax.y)<0.92?V3(0,1,0):V3(1,0,0);
  const u=norm3(cross3(ax,tmp)), v=cross3(ax,u);
  const ring=(cen)=>{const p=[];for(let i=0;i<seg;i++){const th=i/seg*TAU;p.push(add3(cen,add3(mul3(u,Math.cos(th)*r),mul3(v,Math.sin(th)*r))));}return p;};
  const rA=ring(a),rB=ring(b);
  for(let i=0;i<seg;i++){
    const j=(i+1)%seg, th=(i+.5)/seg*TAU;
    const n=add3(mul3(u,Math.cos(th)),mul3(v,Math.sin(th)));
    faces.push({pts:[rA[i],rA[j],rB[j],rB[i]],n,c,a:opts.a??1,part,spec:opts.spec??.5,glass:false});
  }
  if(opts.caps!==false){
    faces.push({pts:rA.slice().reverse(),n:mul3(ax,-1),c,a:opts.a??1,part,spec:opts.spec??.5,glass:false,cap:true});
    faces.push({pts:rB,n:ax,c,a:opts.a??1,part,spec:opts.spec??.5,glass:false,cap:true});
  }
  return faces;
}
function boxFaces(cen,sx,sy,sz,c,part,opts={}){
  const x=sx/2,y=sy/2,z=sz/2;
  const P=[V3(-x,-y,-z),V3(x,-y,-z),V3(x,y,-z),V3(-x,y,-z),V3(-x,-y,z),V3(x,-y,z),V3(x,y,z),V3(-x,y,z)];
  const idx=[[0,1,2,3,V3(0,0,-1)],[4,5,6,7,V3(0,0,1)],[0,4,5,1,V3(0,-1,0)],[3,2,6,7,V3(0,1,0)],[1,5,6,2,V3(1,0,0)],[0,3,7,4,V3(-1,0,0)]];
  return idx.map(f=>({pts:[f[0],f[1],f[2],f[3]].map(i=>add3(cen,P[i])),n:f[4],c,a:opts.a??1,part,spec:opts.spec??.35,glass:false}));
}
function glassDisk(cen,axis,r,part,tint=[110,220,255]){
  return {glass:true,cen,axis:norm3(axis),r,part,tint};
}
const LIGHT=norm3(V3(-.45,.75,.6));
function makeViewer3D(cv,modelBuilder,opts={}){
  let yaw=opts.yaw??0.7, pitch=opts.pitch??0.18, autoYaw=true, dragging=false, px=0, py=0, vYaw=0;
  let activePart=null;
  cv.style.cursor='grab';cv.style.touchAction='none';
  cv.addEventListener('pointerdown',e=>{dragging=true;autoYaw=false;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
  cv.addEventListener('pointermove',e=>{
    if(!dragging)return;
    yaw+=(e.clientX-px)*.008; pitch+=(e.clientY-py)*.008;
    pitch=Math.max(-1.2,Math.min(1.2,pitch));
    vYaw=(e.clientX-px)*.008;px=e.clientX;py=e.clientY;
  });
  const end=()=>{if(dragging){dragging=false;cv.style.cursor='grab';setTimeout(()=>{if(!dragging)autoYaw=true;},2600);}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  const model=modelBuilder();
  function render(ctx,w,h,t,dt){
    if(autoYaw&&!dragging)yaw+=dt*.25;
    if(!dragging&&Math.abs(vYaw)>.0002){yaw+=vYaw*3;vYaw*=.9;}
    const fl=5.2, scale=Math.min(w,h)/(opts.viewSize??5.4);
    const cx=w/2, cyy=h*(opts.cy??0.52);
    const proj=p=>{const q=rotYP(p,yaw,pitch);const k=fl/(fl+q.z);return [cx+q.x*k*scale, cyy-q.y*k*scale, q.z, k];};
    const faces=[];
    model.faces.forEach(f=>{
      const sp=f.pts.map(proj);
      const n=rotYP(f.n,yaw,pitch);
      if(n.z<0.0&&f.cull!==false)return; // 背面剔除（法线背离相机）
      const depth=sp.reduce((s,p)=>s+p[2],0)/sp.length;
      faces.push({sp,depth,f,n});
    });
    faces.sort((A,B)=>B.depth-A.depth);
    faces.forEach(({sp,f,n})=>{
      const lam=Math.max(0,dot3(n,LIGHT));
      const rim=Math.abs(n.z);
      let [r,g,b]=f.c;
      const sh=.28+.72*lam;
      r*=sh;g*=sh;b*=sh;
      const spec=Math.pow(Math.max(0,dot3(n,norm3(V3(-LIGHT.x,LIGHT.y,1.6*f.n.z+.6)))) ,6)*f.spec*130;
      r=Math.min(255,r+spec);g=Math.min(255,g+spec);b=Math.min(255,b+spec);
      const hl=(activePart&&f.part===activePart);
      const pts=sp.map(p=>[p[0],p[1]]);
      poly(ctx,pts,`rgba(${r|0},${g|0},${b|0},${f.a})`,hl?'rgba(255,255,255,.55)':'rgba(255,255,255,.07)',hl?1.6:.7);
      if(hl){glow(ctx,'#00F0FF',12);poly(ctx,pts,null,'#00F0FF',1.4);noGlow(ctx);}
    });
    /* 玻璃透镜：排序后叠加绘制 */
    const glasses=model.glass.map(g=>{
      const c=proj(g.cen);
      const edge=proj(add3(g.cen,mul3(norm3(Math.abs(g.axis.y)>.9?V3(1,0,0):V3(0,1,0)),g.r)));
      const ax2=proj(add3(g.cen,mul3(g.axis,.1)));
      const rr=Math.hypot(edge[0]-c[0],edge[1]-c[1])*.94;
      const n=rotYP(g.axis,yaw,pitch);
      const ang=Math.atan2(ax2[1]-c[1],ax2[0]-c[0])+Math.PI/2;
      return {c,rr,n,depth:c[2],g,ang};
    }).sort((A,B)=>B.depth-A.depth);
    glasses.forEach(({c,rr,n,g,ang})=>{
      const [x,y]=c;
      const [tr,tg,tb]=g.tint;
      const facing=Math.abs(n.z);
      const gr=ctx.createRadialGradient(x-rr*.35,y-rr*.35,rr*.08,x,y,rr);
      gr.addColorStop(0,`rgba(${tr+60},${tg+30},${tb},${.30+.25*facing})`);
      gr.addColorStop(.55,`rgba(${tr},${tg},${tb},${.18+.16*facing})`);
      gr.addColorStop(1,`rgba(${tr*.4|0},${tg*.55|0},${tb*.8|0},${.5})`);
      ctx.fillStyle=gr;
      ctx.beginPath();
      ctx.ellipse(x,y,rr,rr*Math.max(.18,facing),ang,0,TAU);
      ctx.fill();
      const hl=(activePart&&g.part===activePart);
      glow(ctx,hl?'#00F0FF':`rgb(${tr},${tg},${tb})`,hl?18:8);
      ctx.strokeStyle=hl?'#00F0FF':`rgba(${tr},${tg},${tb},.75)`;
      ctx.lineWidth=hl?2.2:1.3;
      ctx.beginPath();ctx.ellipse(x,y,rr,rr*Math.max(.18,facing),ang,0,TAU);ctx.stroke();
      noGlow(ctx);
      /* 高光弧线 */
      ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.ellipse(x,y,rr*.72,rr*.72*Math.max(.18,facing),ang,-2.4,-1.5);ctx.stroke();
    });
    /* 标注 */
    if(model.labels){
      model.labels.forEach(lb=>{
        const p=proj(V3(...lb.at));
        const lx=w*lb.pos[0], ly=h*lb.pos[1];
        const on=activePart&&lb.part===activePart;
        ctx.strokeStyle=on?'#00F0FF':'rgba(255,255,255,.3)';ctx.lineWidth=on?1.6:1;
        ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(lx+(lb.pos[0]>0.5?-6:6),ly);ctx.stroke();
        ctx.fillStyle=on?'#00F0FF':'rgba(255,255,255,.8)';
        ctx.beginPath();ctx.arc(p[0],p[1],on?4:2.6,0,TAU);ctx.fill();
        const tw=ctx.measureText(lb.t).width;
        ctx.font=`600 11.5px "PingFang SC","Microsoft YaHei",sans-serif`;
        const pad=7, bw=ctx.measureText(lb.t).width+pad*2;
        const bx=lb.pos[0]>0.5?lx-bw+6:lx-6, by=ly-11;
        ctx.fillStyle=on?'rgba(0,240,255,.16)':'rgba(18,18,26,.85)';
        roundRect(ctx,bx,by,bw,22,11);ctx.fill();
        ctx.strokeStyle=on?'#00F0FF':'rgba(255,255,255,.18)';ctx.stroke();
        text(ctx,lb.t,bx+bw/2,ly,{size:11.5,color:on?'#00F0FF':'rgba(255,255,255,.85)',align:'center',weight:600});
      });
    }
  }
  return {render,setActive:p=>{activePart=p;},reset:()=>{yaw=opts.yaw??0.7;pitch=opts.pitch??0.18;}};
}
</script>

const PARTINFO={

}

      <div class="ro"><div class="k">物镜焦距 f物</div><div class="v">700 mm</div></div>

      <div class="ro"><div class="k">目镜放大</div><div class="v">${eyeMag}×</div></div>
      <div class="ro"><div class="k">总放大率</div><div class="v">${objMag*eyeMag}×</div></div>

    knEl.innerHTML=activePart?knEl.innerHTML:defaultNote();

feSlider.oninput=e=>{fev.textContent=e.target.value+' mm';updateReadout();};
function setMode(m){
  mode=m;activePart=null;
  sec.querySelector('#mTel').classList.toggle('sel',m==='telescope');
  sec.querySelector('#mMic').classList.toggle('sel',m==='microscope');
  sec.querySelector('#eyectl').style.display=m==='telescope'?'':'none';
  viewer=makeViewer3D(cv,MODELS[m],OPTS[m]);

sec.querySelector('#mTel').onclick=()=>setMode('telescope');
sec.querySelector('#mMic').onclick=()=>setMode('microscope');
setMode('telescope');
makeLoop('z1',(t,dt)=>{
  const {w,h,ctx}=fitCanvas(cv);
  ctx.clearRect(0,0,w,h);
  /* 地面网格 + 氛围 */
  const gg=ctx.createRadialGradient(w/2,h*.55,10,w/2,h*.55,w*.55);
  gg.addColorStop(0,'rgba(0,240,255,.05)');gg.addColorStop(1,'transparent');
  ctx.fillStyle=gg;ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  for(let i=0;i<9;i++){const y=h*.86+i*7;ctx.beginPath();ctx.moveTo(w*.08,y);ctx.lineTo(w*.92,y);ctx.stroke();}
  viewer.render(ctx,w,h,t,dt);
  text(ctx,'◐ 拖拽旋转 · 点击右侧部件高亮',14,h-16,{size:11,color:'rgba(255,255,255,.35)'});
});
})();

<script>

(function(){

sec.innerHTML=`
<div class="stitle"><span class="step">ZONE 02</span><h2>剖面光路 · 实像与虚像的诞生</h2><span class="badge">薄透镜成像 · 三条特征光线</span></div>
<p class="sdesc">把镜筒"切开"，看光在玻璃里的精确走位。所有光路按<b>真实比例尺</b>绘制（刻度 100 mm），光子流沿线奔跑。<b>粉色箭头 = 实像</b>（光线真实会聚，可投在光屏上），<b>青色虚线 = 虚像</b>（光线反向延长线的交点，只能被眼睛"看见"）。</p>

const cv=sec.querySelector('#cvRay');

/* ---------- 透镜剖面绘制 ---------- */
function drawConvex(ctx,x,yc,R,t){
  ctx.beginPath();
  ctx.moveTo(x,yc-R);
  ctx.quadraticCurveTo(x-t,yc,x,yc+R);
  ctx.quadraticCurveTo(x+t,yc,x,yc-R);
  ctx.closePath();
  const g=ctx.createLinearGradient(x,yc-R,x,yc+R);
  g.addColorStop(0,'rgba(90,160,255,.10)');g.addColorStop(.5,'rgba(120,200,255,.30)');g.addColorStop(1,'rgba(90,160,255,.10)');
  ctx.fillStyle=g;ctx.fill();
  glow(ctx,'#5EA8FF',8);ctx.strokeStyle='rgba(140,210,255,.85)';ctx.lineWidth=1.4;ctx.stroke();noGlow(ctx);
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x-t*.32,yc-R*.72);ctx.quadraticCurveTo(x-t*.72,yc,x-t*.32,yc+R*.72);ctx.stroke();
}
function drawConcave(ctx,x,yc,R,t){
  ctx.beginPath();
  ctx.moveTo(x-t,yc-R);
  ctx.quadraticCurveTo(x+t*.6,yc,x-t,yc+R);
  ctx.lineTo(x+t,yc+R);
  ctx.quadraticCurveTo(x-t*.6,yc,x+t,yc-R);
  ctx.closePath();
  const g=ctx.createLinearGradient(x,yc-R,x,yc+R);
  g.addColorStop(0,'rgba(90,160,255,.10)');g.addColorStop(.5,'rgba(120,200,255,.28)');g.addColorStop(1,'rgba(90,160,255,.10)');
  ctx.fillStyle=g;ctx.fill();
  glow(ctx,'#5EA8FF',8);ctx.strokeStyle='rgba(140,210,255,.85)';ctx.lineWidth=1.4;ctx.stroke();noGlow(ctx);
}
/* 光脉冲动画：沿折线跑的发光点 */
function photons(ctx,lines,t,color){
  lines.forEach(seg=>{
    let total=0;const lens=[];
    for(let i=0;i<seg.length-1;i++){const l=Math.hypot(seg[i+1][0]-seg[i][0],seg[i+1][1]-seg[i][1]);lens.push(l);total+=l;}
    const n=Math.max(2,Math.round(total/90));
    for(let k=0;k<n;k++){
      let d=((t*130+k*total/n)%total), i=0;
      while(i<lens.length-1&&d>lens[i]){d-=lens[i];i++;}
      const r=d/lens[i];
      const x=seg[i][0]+(seg[i+1][0]-seg[i][0])*r, y=seg[i][1]+(seg[i+1][1]-seg[i][1])*r;
      glow(ctx,color,9);ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(x,y,2.2,0,TAU);ctx.fill();noGlow(ctx);
    }
  });
}
function rayLine(ctx,pts,color,lw=1.6,dash=null){
  ctx.save();if(dash)ctx.setLineDash(dash);
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.stroke();ctx.restore();
}
function imgArrow(ctx,x,y0,y1,color,label,dashed){
  ctx.save();if(dashed)ctx.setLineDash([5,4]);
  arrow(ctx,x,y0,x,y1,color,2.2,8);
  ctx.restore();
  text(ctx,label,x+10,(y0+y1)/2,{size:11.5,color,weight:700});
}
function dimLine(ctx,x1,x2,y,label,color='#9B4DFF'){
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();
  arrow(ctx,(x1+x2)/2+14,y,x1+2,y,color,1,5);arrow(ctx,(x1+x2)/2-14,y,x2-2,y,color,1,5);
  text(ctx,label,(x1+x2)/2,y-9,{size:10.5,color,align:'center',mono:true});
}
function focusDot(ctx,x,y,label,color='#FFD34D'){
  glow(ctx,color,7);ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.fill();noGlow(ctx);
  text(ctx,label,x,y+13,{size:10,color,align:'center',mono:true});
}

/* ---------- 主绘制（主视图 + 目镜区放大窗，标注不打架） ---------- */
function draw(t){
  const {w,h,ctx}=fitCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const c=CFG[mode];
  const F1=+f1.value,F2=+f2.value,A=+aa.value;
  const virt=+sec.querySelector('#virt').value;
  const DEG=Math.PI/180;
  /* 显微镜 v 可能很大 → 动态视野（刻度仍固定 100mm） */
  let world=c.world;
  if(mode==='micro'){
    const u=F1+A, v=u*F1/(u-F1);
    world=Math.max(c.world,v+F2+130);
  }
  const s=(w-130)/world, x0=90, yc=mode==='micro'?h*.64:h*.52;
  const X=mm=>x0+mm*s, Y=mm=>yc-mm*s;
  /* 标尺网格（固定 100mm 刻度） */
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
  for(let mm=-100;mm<world;mm+=100){
    ctx.beginPath();ctx.moveTo(X(mm),18);ctx.lineTo(X(mm),h-34);ctx.stroke();
    text(ctx,mm+'',X(mm),h-22,{size:9,color:'rgba(255,255,255,.3)',align:'center',mono:true});
  }
  text(ctx,'单位：mm（固定标尺）',w-14,h-22,{size:9.5,color:'rgba(255,255,255,.35)',align:'right'});
  /* 出射光束长度（mm）：主/放大两视图必须一致 */
  let beamMmShared=150;
  if(mode==='kepler'||mode==='galileo'){
    const LL=mode==='kepler'?F1+F2:F1-F2;
    beamMmShared=Math.max(30,Math.min(150,(w-45-X(LL))/s));
  }
  /* ===== 场景渲染（主视图 / 放大窗共用同一套几何） ===== */
  function render(M,labels){
    const {X:Xf,Y:Yf,s:sy,yc:cy}=M;
    const lines=[];
    const dot=(x,y,color)=>{glow(ctx,color,7);ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.fill();noGlow(ctx);};
    if(mode==='kepler'||mode==='galileo'){
      const m=-Math.tan(A*DEG), MM=F1/F2;
      const L=mode==='kepler'?F1+F2:F1-F2;
      const ap=c.ap;
      const beamMm=beamMmShared;
      drawConvex(ctx,Xf(0),cy,ap*sy,10);
      if(mode==='kepler')drawConvex(ctx,Xf(L),cy,ap*.62*sy,7);
      else drawConcave(ctx,Xf(L),cy,ap*.6*sy,7);
      /* 焦点：主视图只画点不写字，放大窗写全 */
      dot(Xf(F1),cy,'#FFD34D');
      if(mode==='kepler')dot(Xf(L+F2),cy,'#FFD34D');
      if(labels==='zoom'){
        text(ctx,mode==='kepler'?'F物后 = F目前（重合）':'F物后 = F目前（虚焦点）',Xf(F1),cy+16,{size:10.5,color:'#FFD34D',align:'center',weight:700});
        if(mode==='kepler')text(ctx,'F目后',Xf(L+F2),cy-14,{size:10,color:'#FFD34D',align:'center',mono:true});
      }else{
        text(ctx,'物镜',Xf(0),cy-ap*sy-16,{size:11.5,color:'#8BD2FF',align:'center',weight:700});
        text(ctx,mode==='kepler'?'目镜（凸）':'目镜（凹）',Xf(L),cy-ap*.62*sy-16,{size:11.5,color:'#8BD2FF',align:'center',weight:700});
      }
      const FP=[Xf(F1),Yf(F1*m)];
      const mOut=mode==='kepler'?-MM*m:MM*m;
      const beamY=[-ap*.85,0,ap*.85];
      beamY.forEach(yi=>{
        const p0=[Xf(-95),Yf(-95*m+yi)], p1=[Xf(0),Yf(yi)];
        const yAtL=p1[1]+(FP[1]-p1[1])*(L/F1);
        const pE=[Xf(L+beamMm),yAtL-mOut*beamMm*sy];
        rayLine(ctx,[p0,p1],'#FFD34D',1.5);
        rayLine(ctx,[p1,[Xf(L),yAtL]],'#FFB84D',1.5);
        rayLine(ctx,[[Xf(L),yAtL],pE],'#00F0FF',1.6);
        lines.push([p0,p1,[Xf(L),yAtL],pE]);
        if(virt){
          rayLine(ctx,[[Xf(L),yAtL],[Xf(L)-60,yAtL+mOut*60*sy]],'#8BE9FD',1,[4,4]);
        }
      });
      if(mode==='kepler'){
        /* 中间实像（倒立）：箭头两视图都画；放大窗文字放箭头尖端下方 */
        imgArrow(ctx,Xf(F1),cy,Yf(F1*m),'#FF2D8F','',false);
        if(labels==='zoom')text(ctx,'实像（倒立）',Xf(F1)+9,Yf(F1*m)+15,{size:11,color:'#FF2D8F',weight:700});
      }else{
        rayLine(ctx,[[Xf(L),Yf(0)],FP],'rgba(255,211,77,.35)',1,[3,4]);
        if(labels==='zoom')text(ctx,'（光线未到达焦点即被凹透镜掰直）',Xf(F1),Yf(F1*m)+18,{size:9.5,color:'rgba(255,211,77,.75)',align:'center'});
      }
      if(labels==='main'){
        text(ctx,'α',Xf(-80),Yf(-80*m)-14,{size:12,color:'#FFD34D',align:'center',weight:700});
      }else{
        const yMid=Yf(0)+(FP[1]-Yf(0))*(L/F1)-mOut*beamMm*.4*sy;
        text(ctx,'β = M·α',Xf(L+beamMm*.4)+14,yMid-6,{size:11.5,color:'#00F0FF',align:'left',weight:700});
      }
      /* 眼睛（主视图必画；放大窗在范围内才画） */
      const eyePx=Xf(L+beamMm+12), eyePy=Yf(0)+(FP[1]-Yf(0))*(L/F1)-mOut*(beamMm+12)*sy;
      if(labels==='main'||eyePx<M.xMax){
        drawEye(ctx,eyePx,eyePy);
      }
      if(labels==='main'){
        text(ctx,mode==='kepler'?'眼睛看到：倒立放大的虚像（在无穷远）':'眼睛看到：正立放大的虚像（在无穷远）',Xf(L)+96,h-8,{size:11,color:'#8BE9FD',align:'center'});
      }
      M.eyeMm=L+beamMm;M.L=L;
    }else{
      /* ===== 显微镜 ===== */
      const F=F1, u=F+A, v=u*F/(u-F), m1=v/u, h0=3;
      const ap=c.ap;
      const objX=Xf(-u), imgX=Xf(v), eyeX=Xf(v+F2);
      const objTop=[objX,Yf(h0)], imgTop=[imgX,Yf(-m1*h0)];
      if(labels==='main'){
        imgArrow(ctx,objX,cy,Yf(h0),'#C8FF00','标本',false);
        text(ctx,'h',objX-12,Yf(h0/2),{size:11,color:'#C8FF00',align:'center'});
      }
      drawConvex(ctx,Xf(0),cy,ap*sy,8);
      drawConvex(ctx,eyeX,cy,ap*.8*sy,7);
      if(labels==='main'){
        text(ctx,'物镜',Xf(0),cy-ap*sy-14,{size:11.5,color:'#8BD2FF',align:'center',weight:700});
        text(ctx,'目镜',eyeX,cy-ap*.8*sy-14,{size:11.5,color:'#8BD2FF',align:'center',weight:700});
      }
      dot(Xf(-F),cy,'#FFD34D');dot(Xf(F),cy,'#FFD34D');dot(eyeX-F2*sy,cy,'#FFD34D');
      if(labels==='zoom'){
        text(ctx,'F目前',eyeX-F2*sy,cy-14,{size:10,color:'#FFD34D',align:'center',mono:true});
        text(ctx,'目镜',eyeX,cy-ap*.8*sy-14,{size:11,color:'#8BD2FF',align:'center',weight:700});
      }else{
        text(ctx,'F物前',Xf(-F),cy+14,{size:9,color:'rgba(255,211,77,.6)',align:'center',mono:true});
        text(ctx,'F物后',Xf(F),cy+14,{size:9,color:'rgba(255,211,77,.6)',align:'center',mono:true});
      }
      /* 特征光线 1：平行→过焦点 */
      rayLine(ctx,[objTop,[Xf(0),objTop[1]]],'#FFD34D',1.5);
      rayLine(ctx,[[Xf(0),objTop[1]],imgTop],'#FFB84D',1.5);
      /* 特征光线 2：过光心 */
      rayLine(ctx,[objTop,[Xf(0),cy]],'#FFD34D',1.5);
      rayLine(ctx,[[Xf(0),cy],imgTop],'#FFB84D',1.5);
      lines.push([objTop,[Xf(0),objTop[1]],imgTop]);
      lines.push([objTop,[Xf(0),cy],imgTop]);
      /* 中间实像 */
      arrow(ctx,imgX,cy,imgX,Yf(-m1*h0),'#FF2D8F',2.2,8);
      text(ctx,'实像 m₁h（倒立）',imgX-12,(cy+Yf(-m1*h0))/2,{size:11.5,color:'#FF2D8F',align:'right',weight:700});
      /* 目镜：从前焦面点出射平行光 */
      const mOut=(m1*h0)/F2;
      const bl=Math.min(120,(cy-30)/(mOut*sy));
      const beamY2=[-ap*.62,0,ap*.62];
      beamY2.forEach(yi=>{
        const hitY=cy+yi*sy;
        rayLine(ctx,[imgTop,[eyeX,hitY]],'#FFB84D',1.3);
        rayLine(ctx,[[eyeX,hitY],[eyeX+bl,hitY-mOut*bl*sy]],'#00F0FF',1.6);
        lines.push([imgTop,[eyeX,hitY],[eyeX+bl,hitY-mOut*bl*sy]]);
        if(virt)rayLine(ctx,[[eyeX,hitY],[eyeX-45,hitY+mOut*45*sy]],'#8BE9FD',1,[4,4]);
      });
      if(virt&&labels==='zoom')text(ctx,'反向延长 → 虚像在无穷远',imgX-10,cy+ap*.7*sy+16,{size:10,color:'#8BE9FD',align:'center'});

        drawEye(ctx,eyeX+bl+24,cy-mOut*bl*sy);
        text(ctx,'眼睛看到：倒立放大的虚像（总放大 M = m₁ × 250/f目）',eyeX-60,h-8,{size:11,color:'#8BE9FD',align:'center'});
      }
      M.v=v;
    }
    return lines;
  }
  /* 主视图 */
  const mainLines=render({X,Y,s,yc,labels:'main',xMax:w},'main');
  /* 光轴 */
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.setLineDash([8,6]);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(24,yc);ctx.lineTo(w-24,yc);ctx.stroke();ctx.setLineDash([]);
  photons(ctx,mainLines,t,'#FFF3B0');
  /* 主视图尺寸标注 */
  if(mode==='kepler'||mode==='galileo'){
    const L=mode==='kepler'?F1+F2:F1-F2;
    dimLine(ctx,X(0),X(F1),h-42,'f物 = '+F1+'mm');
    dimLine(ctx,X(L),X(L+(mode==='kepler'?F2:-F2)),h-42,'f目');
  }else{
    const u=F1+A, v=u*F1/(u-F1);
    dimLine(ctx,X(-u),X(0),h-42,'u = '+u.toFixed(1)+'mm');
    dimLine(ctx,X(0),X(v),h-42,'v = '+v.toFixed(0)+'mm');
  }
  /* ===== 目镜区放大窗 ===== */
  let z0,z1;
  if(mode==='kepler'){z0=F1-25;z1=F1+F2+beamMmShared+15;}
  else if(mode==='galileo'){z0=(F1-F2)-85;z1=F1+80;}
  else{const u=F1+A,v=u*F1/(u-F1);z0=v-25;z1=v+F2+62;}
  const iw=Math.min(530,w*.56), ih=190, ix=44, iy=20;
  const sx=(iw-16)/(z1-z0);
  const iyc=iy+30+(ih-38)/2;
  const ZX=mm=>ix+8+(mm-z0)*sx, ZY=mm=>iyc-mm*sx;
  /* 主视图上的放大范围虚线框 */
  const yrMm=(ih/2-19)/sx;
  ctx.strokeStyle='rgba(155,77,255,.65)';ctx.setLineDash([5,4]);ctx.lineWidth=1.2;
  ctx.strokeRect(X(z0),Y(yrMm),(z1-z0)*s,2*yrMm*s);
  ctx.setLineDash([]);
  text(ctx,'放大 ↗',X(z1),Y(yrMm)-9,{size:9.5,color:'rgba(155,77,255,.9)',align:'right',weight:700});
  /* 放大窗面板 */
  ctx.fillStyle='rgba(13,13,21,.94)';
  roundRect(ctx,ix,iy,iw,ih,14);ctx.fill();
  ctx.strokeStyle='rgba(155,77,255,.55)';ctx.lineWidth=1.4;ctx.stroke();
  text(ctx,`目镜区放大 ×${(sx/s).toFixed(1)} · 实像 / 焦点重合 / 角放大`,ix+12,iy+15,{size:11,color:'#C9A0FF',weight:700});
  ctx.save();
  ctx.beginPath();ctx.rect(ix+8,iy+26,iw-16,ih-34);ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.setLineDash([8,6]);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(ix+8,iyc);ctx.lineTo(ix+iw-8,iyc);ctx.stroke();ctx.setLineDash([]);
  const zLines=render({X:ZX,Y:ZY,s:sx,yc:iyc,labels:'zoom',xMax:ix+iw-8},'zoom');
  photons(ctx,zLines,t,'#FFF3B0');
  ctx.restore();
}
function drawEye(ctx,x,y){
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.ellipse(x,y,13,8,0,0,TAU);ctx.stroke();
  glow(ctx,'#00F0FF',8);ctx.fillStyle='#00F0FF';
  ctx.beginPath();ctx.arc(x,y,4,0,TAU);ctx.fill();noGlow(ctx);
  ctx.restore();
  text(ctx,'眼',x,y+18,{size:10,color:'rgba(255,255,255,.6)',align:'center'});
}
applyMode();
makeLoop('z2',draw);
})();
</script>

/* ================= 山·五重嵌套 ================= */
function mtnL0(g,W,H){

function mtnL1(g,W,H){

  /* 森林肌理 */

function mtnL2(g,W,H){
  /* 庭院石板地 */
  const gnd=g.createLinearGradient(0,H*.4,0,H);
  gnd.addColorStop(0,'#b8ad98');gnd.addColorStop(1,'#7d7462');
  g.fillStyle=gnd;g.fillRect(0,H*.4,W,H*.6);
  g.strokeStyle='rgba(90,82,68,.5)';g.lineWidth=1.2;
  for(let i=0;i<12;i++){const y=H*.42+i*i*.004*H;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  for(let i=0;i<24;i++){const x=W/2+(i-12)*W*.06;g.beginPath();g.moveTo(x,H*.4);g.lineTo(x+(i-12)*W*.1,H);g.stroke();}
  /* 大殿立面 */
  g.fillStyle='#9e2b25';g.fillRect(0,0,W,H*.4);
  for(let i=0;i<=8;i++){g.fillStyle='#7e1f1a';g.fillRect(i*W*.125-10,H*.06,22,H*.34);}
  roofTier(g,W*.5,H*.05,W*1.04,H*.17,'#c98a2e');
  g.fillStyle='#1d2a4a';g.fillRect(W*.5-90,H*.085,180,34);
  g.strokeStyle='#d9a441';g.lineWidth=2;g.strokeRect(W*.5-90,H*.085,180,34);
  g.fillStyle='#ffd977';g.font='700 26px "PingFang SC","Microsoft YaHei"';g.textAlign='center';g.textBaseline='middle';
  g.fillText('大 雄 宝 殿',W*.5,H*.102);
  /* 敞开的大门 + 佛光 */
  const dg=g.createRadialGradient(W*.5,H*.34,10,W*.5,H*.34,W*.16);
  dg.addColorStop(0,'rgba(255,214,120,1)');dg.addColorStop(.5,'rgba(190,120,40,.9)');dg.addColorStop(1,'rgba(40,20,8,.95)');
  g.fillStyle=dg;g.fillRect(W*.5-70,H*.17,140,H*.23);
  /* 门内佛像剪影 */
  g.fillStyle='rgba(60,30,10,.9)';
  g.beginPath();g.arc(W*.5,H*.26,16,0,TAU);g.fill();
  g.beginPath();g.moveTo(W*.5-30,H*.4);g.quadraticCurveTo(W*.5,H*.27,W*.5+30,H*.4);g.fill();
  /* 红灯笼 */
  [[.2,.13],[.8,.13],[.32,.1],[.68,.1]].forEach(p=>{
    g.fillStyle='#d83a2a';g.beginPath();g.ellipse(W*p[0],H*p[1],16,20,0,0,TAU);g.fill();
    g.fillStyle='rgba(255,180,120,.6)';g.beginPath();g.ellipse(W*p[0]-4,H*p[1]-5,5,10,.3,0,TAU);g.fill();
    g.fillStyle='#ffd977';g.fillRect(W*p[0]-4,H*p[1]-26,8,6);g.fillRect(W*p[0]-4,H*p[1]+20,8,6);
  });
  /* 香炉 + 烟 */
  g.fillStyle='#6a5a3a';
  g.beginPath();g.ellipse(W*.5,H*.62,54,22,0,0,TAU);g.fill();
  g.fillRect(W*.5-54,H*.58,108,26);
  g.fillStyle='#54452c';g.fillRect(W*.5-40,H*.84,10,26);g.fillRect(W*.5+30,H*.84,10,26);
  smokeCurl(g,W*.48,H*.56,1.6,.5);smokeCurl(g,W*.55,H*.57,1.2,.4);
  /* 和尚扫地 */
  drawMonk(g,W*.3,H*.62,1.5);
  /* 佛前猫 */
  drawCatSit(g,W*.58,H*.45,1.15);
  g.fillStyle='rgba(255,240,200,.75)';g.font='600 15px "PingFang SC"';g.textAlign='left';
  g.fillText('青烟 · 梵音 · 扫落叶',W*.04,H*.94);
}
function drawBuddha(g,x,y,s){
  /* 背光 */
  const halo=g.createRadialGradient(x,y-150*s,10,x,y-150*s,120*s);
  halo.addColorStop(0,'rgba(255,220,130,.85)');halo.addColorStop(.6,'rgba(220,150,50,.25)');halo.addColorStop(1,'transparent');
  g.fillStyle=halo;g.beginPath();g.arc(x,y-150*s,120*s,0,TAU);g.fill();
  const gold=(a,b,c)=>{const gr=g.createLinearGradient(x-80*s,y-260*s,x+80*s,y);gr.addColorStop(0,a);gr.addColorStop(.55,b);gr.addColorStop(1,c);return gr;};
  /* 莲花座 */
  g.fillStyle='#b8781e';
  for(let i=-3;i<=3;i++){g.beginPath();g.ellipse(x+i*30*s,y-6*s,20*s,34*s,i*.12,0,TAU);g.fill();}
  g.fillStyle='#d9a441';
  for(let i=-2;i<=2;i++){g.beginPath();g.ellipse(x+i*30*s,y-22*s,19*s,30*s,i*.1,0,TAU);g.fill();}
  /* 身体（袈裟） */
  g.fillStyle=gold('#e8b84d','#c98a2e','#8a5a1a');
  g.beginPath();g.moveTo(x-95*s,y-24*s);
  g.quadraticCurveTo(x-88*s,y-160*s,x-38*s,y-200*s);
  g.quadraticCurveTo(x,y-216*s,x+38*s,y-200*s);
  g.quadraticCurveTo(x+88*s,y-160*s,x+95*s,y-24*s);
  g.closePath();g.fill();
  /* 袈裟褶 */
  g.strokeStyle='rgba(120,70,20,.55)';g.lineWidth=3*s;
  for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(x+i*26*s,y-190*s);g.quadraticCurveTo(x+i*34*s,y-100*s,x+i*30*s,y-30*s);g.stroke();}
  /* 禅定印双手 */
  g.fillStyle='#f0c060';g.beginPath();g.ellipse(x,y-56*s,26*s,12*s,0,0,TAU);g.fill();
  /* 头 */
  g.fillStyle=gold('#f0c060','#d9a441','#a06a20');
  g.beginPath();g.ellipse(x,y-236*s,42*s,46*s,0,0,TAU);g.fill();
  /* 螺发 */
  g.fillStyle='#8a5a1a';
  for(let r=0;r<4;r++)for(let i=0;i<8-r;i++){
    const a=Math.PI+(i+.5)*(Math.PI/(8-r)),rr=(40-r*9)*s;
    g.beginPath();g.arc(x+Math.cos(a)*rr,y-240*s+Math.sin(a)*rr*.9,4.2*s,0,TAU);g.fill();
  }
  /* 肉髻 */
  g.fillStyle='#8a5a1a';g.beginPath();g.ellipse(x,y-282*s,12*s,10*s,0,0,TAU);g.fill();
  /* 白毫 + 垂耳 */
  g.fillStyle='#fff';g.beginPath();g.arc(x,y-244*s,3*s,0,TAU);g.fill();
  g.fillStyle='#d9a441';
  g.beginPath();g.ellipse(x-44*s,y-226*s,7*s,18*s,.1,0,TAU);g.fill();
  g.beginPath();g.ellipse(x+44*s,y-226*s,7*s,18*s,-.1,0,TAU);g.fill();
  /* 眉眼（低垂慈悲） */
  g.strokeStyle='#5a3a10';g.lineWidth=2.4*s;
  g.beginPath();g.moveTo(x-20*s,y-242*s);g.quadraticCurveTo(x-12*s,y-238*s,x-6*s,y-242*s);g.stroke();
  g.beginPath();g.moveTo(x+6*s,y-242*s);g.quadraticCurveTo(x+12*s,y-238*s,x+20*s,y-242*s);g.stroke();
  g.beginPath();g.moveTo(x-8*s,y-222*s);g.quadraticCurveTo(x,y-218*s,x+8*s,y-222*s);g.stroke();
}
function drawCatCrouch(g,x,y,s){
  g.save();g.translate(x,y);
  const fur=g.createLinearGradient(0,-40*s,0,10*s);
  fur.addColorStop(0,'#f09a4a');fur.addColorStop(1,'#c96a1a');
  g.fillStyle=fur;
  g.beginPath();g.ellipse(0,-14*s,42*s,20*s,-.06,0,TAU);g.fill(); /* 身 */
  g.beginPath();g.arc(-34*s,-32*s,17*s,0,TAU);g.fill(); /* 头 */
  g.beginPath();g.moveTo(-46*s,-42*s);g.lineTo(-50*s,-58*s);g.lineTo(-34*s,-48*s);g.fill();
  g.beginPath();g.moveTo(-24*s,-44*s);g.lineTo(-18*s,-58*s);g.lineTo(-12*s,-44*s);g.fill();
  g.fillStyle='#f7c8d8';
  g.beginPath();g.moveTo(-44*s,-45*s);g.lineTo(-46*s,-53*s);g.lineTo(-37*s,-47*s);g.fill();
  g.strokeStyle='#a34d0e';g.lineWidth=3*s; /* 条纹 */
  for(let i=0;i<5;i++){g.beginPath();g.moveTo((-8+i*13)*s,-30*s);g.quadraticCurveTo((-6+i*13)*s,-20*s,(-8+i*13)*s,-8*s);g.stroke();}
  g.strokeStyle='#e88a3a';g.lineWidth=7*s; /* 尾 */
  g.beginPath();g.moveTo(38*s,-8*s);g.quadraticCurveTo(62*s,-12*s,58*s,-38*s);g.stroke();
  g.strokeStyle='#a34d0e';g.lineWidth=2*s;
  g.beginPath();g.moveTo(58*s,-38*s);g.quadraticCurveTo(56*s,-46*s,52*s,-48*s);g.stroke();
  /* 发光的眼睛（俯视猎物） */
  g.fillStyle='#ffd94d';
  g.beginPath();g.ellipse(-40*s,-33*s,4.6*s,3*s,-.2,0,TAU);g.fill();
  g.beginPath();g.ellipse(-27*s,-34*s,4.6*s,3*s,.2,0,TAU);g.fill();
  g.fillStyle='#1a0e04';
  g.beginPath();g.ellipse(-40*s,-33*s,1.3*s,2.8*s,0,0,TAU);g.fill();
  g.beginPath();g.ellipse(-27*s,-34*s,1.3*s,2.8*s,0,0,TAU);g.fill();
  /* 胡须 */
  g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=1.2*s;
  for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(-48*s,-26*s);g.quadraticCurveTo(-64*s,(-26+i*4)*s,-74*s,(-30+i*6)*s);g.stroke();}
  /* 前爪按住 */
  g.fillStyle='#e88a3a';
  g.beginPath();g.ellipse(-30*s,0,12*s,6*s,0,0,TAU);g.fill();
  g.beginPath();g.ellipse(-8*s,0,12*s,6*s,0,0,TAU);g.fill();
  g.restore();
}
function mtnL3(g,W,H){
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#3a2410');bg.addColorStop(.6,'#241608');bg.addColorStop(1,'#160d05');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  /* 顶部光束 */
  const beam=g.createLinearGradient(0,0,0,H*.8);
  beam.addColorStop(0,'rgba(255,220,140,.28)');beam.addColorStop(1,'transparent');
  g.fillStyle=beam;g.beginPath();
  g.moveTo(W*.34,0);g.lineTo(W*.52,0);g.lineTo(W*.62,H*.85);g.lineTo(W*.3,H*.85);g.fill();
  /* 帷幔 */
  g.fillStyle='rgba(140,30,25,.5)';g.fillRect(0,0,W*.08,H);g.fillRect(W*.92,0,W*.08,H);
  drawBuddha(g,W*.4,H*.88,2.1);
  /* 供桌蜡烛 */
  g.fillStyle='#4a2e12';g.fillRect(W*.02,H*.82,W*.24,H*.06);
  for(let i=0;i<3;i++){
    const cx=W*.06+i*W*.07,cy=H*.82;
    g.fillStyle='#e8e0c8';g.fillRect(cx-4,cy-34,8,34);
    const fl=g.createRadialGradient(cx,cy-44,1,cx,cy-44,14);
    fl.addColorStop(0,'rgba(255,240,180,1)');fl.addColorStop(.5,'rgba(255,160,60,.8)');fl.addColorStop(1,'transparent');
    g.fillStyle=fl;g.beginPath();g.ellipse(cx,cy-44,7,13,0,0,TAU);g.fill();
  }
  /* 猫与鼠 */
  drawCatCrouch(g,W*.72,H*.82,1.7);
  drawMouseTiny(g,W*.63,H*.87,1.5);
  g.fillStyle='rgba(255,240,200,.7)';g.font='600 16px "PingFang SC"';g.textAlign='left';
  g.fillText('佛前 · 烛影 · 捕猎者',W*.04,H*.06);
}
function drawMouseTiny(g,x,y,s){
  g.fillStyle='#9aa0a8';
  g.beginPath();g.ellipse(x,y,16*s,9*s,0,0,TAU);g.fill();
  g.beginPath();g.arc(x-14*s,y-4*s,7*s,0,TAU);g.fill();
  g.fillStyle='#f0a8b8';g.beginPath();g.arc(x-16*s,y-9*s,3.4*s,0,TAU);g.fill();
  g.fillStyle='#1a1a20';g.beginPath();g.arc(x-16.5*s,y-4.5*s,1.8*s,0,TAU);g.fill();
  g.strokeStyle='#c8ccd4';g.lineWidth=1.6*s;
  g.beginPath();g.moveTo(x+15*s,y);g.quadraticCurveTo(x+28*s,y-4*s,x+34*s,y+4*s);g.stroke();
  g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=.9*s;
  for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(x-19*s,y-2*s);g.lineTo(x-27*s,(y-2+i*3)*s);g.stroke();}
}
function mtnL4(g,W,H){
  const bg=g.createRadialGradient(W*.5,H*.5,H*.1,W*.5,H*.5,W*.7);
  bg.addColorStop(0,'#3a3230');bg.addColorStop(1,'#0e0c0c');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  /* 大耳朵 */
  g.fillStyle='#8a9098';
  g.beginPath();g.ellipse(W*.2,H*.3,130,150,-.4,0,TAU);g.fill();
  g.beginPath();g.ellipse(W*.8,H*.22,120,140,.4,0,TAU);g.fill();
  g.fillStyle='#f0a8b8';
  g.beginPath();g.ellipse(W*.21,H*.31,88,105,-.4,0,TAU);g.fill();
  g.beginPath();g.ellipse(W*.79,H*.23,80,96,.4,0,TAU);g.fill();
  /* 头部 */
  const fur=g.createRadialGradient(W*.48,H*.42,60,W*.5,H*.55,W*.45);
  fur.addColorStop(0,'#b8bec6');fur.addColorStop(.6,'#8a9098');fur.addColorStop(1,'#5a6068');
  g.fillStyle=fur;
  g.beginPath();g.ellipse(W*.5,H*.55,W*.29,H*.4,0,0,TAU);g.fill();
  /* 毛发笔触 */
  g.strokeStyle='rgba(220,226,232,.35)';g.lineWidth=2;
  for(let i=0;i<420;i++){
    const a=((i*137)%628)/100, r1=W*.1+((i*89)%(W*.18));
    const x=W*.5+Math.cos(a)*r1, y=H*.55+Math.sin(a)*r1*1.25;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*12,y+Math.sin(a)*15);g.stroke();
  }
  /* 惊恐的大眼睛（左） */
  drawMouseEye(g,W*.32,H*.48,150,'left');
  drawMouseEye(g,W*.68,H*.44,128,'right');
  /* 粉鼻 + 鼻孔 + 嘴 */
  g.fillStyle='#f090a8';
  g.beginPath();g.moveTo(W*.5-36,H*.82);g.quadraticCurveTo(W*.5,H*.74,W*.5+36,H*.82);
  g.quadraticCurveTo(W*.5,H*.9,W*.5-36,H*.82);g.fill();
  g.fillStyle='#8a4050';
  g.beginPath();g.ellipse(W*.5-13,H*.82,5,3.4,-.3,0,TAU);g.fill();
  g.beginPath();g.ellipse(W*.5+13,H*.82,5,3.4,.3,0,TAU);g.fill();
  g.strokeStyle='rgba(40,30,30,.7)';g.lineWidth=3;
  g.beginPath();g.moveTo(W*.5,H*.85);g.quadraticCurveTo(W*.5,H*.9,W*.47,H*.93);g.stroke();
  /* 胡须（六根长须） */
  g.strokeStyle='rgba(255,255,255,.92)';g.lineWidth=3.4;g.lineCap='round';
  [[-1,-2],[-1,0],[-1,2],[1,-2],[1,0],[1,2]].forEach(([sd,k])=>{
    g.beginPath();g.moveTo(W*.5+sd*30,H*.8+k*10);
    g.bezierCurveTo(W*.5+sd*W*.2,H*.78+k*22,W*.5+sd*W*.32,H*.68+k*30,W*.5+sd*W*.42,H*.62+k*34);
    g.stroke();
  });
  /* 汗珠 + 颤抖线 */
  g.fillStyle='rgba(160,220,255,.85)';
  [[.24,.3],[.76,.26],[.3,.66]].forEach(p=>{
    g.beginPath();g.moveTo(W*p[0],H*p[1]-12);g.quadraticCurveTo(W*p[0]-9,H*p[1]+6,W*p[0],H*p[1]+10);
    g.quadraticCurveTo(W*p[0]+9,H*p[1]+6,W*p[0],H*p[1]-12);g.fill();
  });
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;
  [[.13,.55],[.87,.58],[.16,.7],[.85,.72]].forEach(p=>{
    g.beginPath();g.moveTo(W*p[0]-16,H*p[1]);g.lineTo(W*p[0]+16,H*p[1]);
    g.moveTo(W*p[0]-10,H*p[1]-12);g.lineTo(W*p[0]+10,H*p[1]-12);
    g.stroke();
  });
}
function drawMouseEye(g,x,y,R,side){
  /* 眼眶 */
  const bg=g.createRadialGradient(x,y,R*.2,x,y,R);
  bg.addColorStop(0,'#3a3a44');bg.addColorStop(1,'#101014');
  g.fillStyle=bg;g.beginPath();g.ellipse(x,y,R,R*.86,0,0,TAU);g.fill();
  /* 虹膜 */
  const ir=g.createRadialGradient(x,y,R*.1,x,y,R*.72);
  ir.addColorStop(0,'#5a3a20');ir.addColorStop(.7,'#2a1a10');ir.addColorStop(1,'#120a06');
  g.fillStyle=ir;g.beginPath();g.ellipse(x,y,R*.72,R*.68,0,0,TAU);g.fill();
  /* 瞳孔 + 瞳孔里映着猫！ */
  g.fillStyle='#000';g.beginPath();g.ellipse(x,y,R*.42,R*.46,0,0,TAU);g.fill();
  g.save();g.translate(x,y);g.scale(R/150,R/150);
  g.fillStyle='#e88a3a';
  g.beginPath();g.arc(0,10,34,0,TAU);g.fill();
  g.beginPath();g.moveTo(-26,-12);g.lineTo(-32,-40);g.lineTo(-8,-20);g.fill();
  g.beginPath();g.moveTo(26,-12);g.lineTo(32,-40);g.lineTo(8,-20);g.fill();
  g.fillStyle='#ffd94d';
  g.beginPath();g.ellipse(-13,2,6,4,-.2,0,TAU);g.fill();
  g.beginPath();g.ellipse(13,2,6,4,.2,0,TAU);g.fill();
  g.fillStyle='#1a0e04';
  g.beginPath();g.ellipse(-13,2,1.8,3.6,0,0,TAU);g.fill();
  g.beginPath();g.ellipse(13,2,1.8,3.6,0,0,TAU);g.fill();
  g.restore();
  /* 高光 */
  g.fillStyle='rgba(255,255,255,.95)';
  g.beginPath();g.arc(x-R*.34,y-R*.34,R*.13,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,.5)';
  g.beginPath();g.arc(x+R*.28,y+R*.3,R*.07,0,TAU);g.fill();
  /* 睫毛 */
  g.strokeStyle='rgba(230,230,235,.8)';g.lineWidth=2.6;
  for(let i=-2;i<=2;i++){
    g.beginPath();g.moveTo(x+i*R*.4,y-R*.8);
    g.lineTo(x+i*R*.46,y-R*.8-14);g.stroke();
  }
}

function deerShape(g,x,y,s,color){
  g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=color;g.strokeStyle=color;
  g.beginPath();g.ellipse(0,0,26,15,0,0,TAU);g.fill();
  g.lineWidth=7;g.beginPath();g.moveTo(18,-6);g.lineTo(34,-26);g.stroke();
  g.beginPath();g.ellipse(38,-28,9,6,-.4,0,TAU);g.fill();
  g.lineWidth=2.4;
  g.beginPath();g.moveTo(40,-33);g.lineTo(46,-48);g.moveTo(44,-42);g.lineTo(52,-46);
  g.moveTo(36,-33);g.lineTo(34,-47);g.moveTo(34,-42);g.lineTo(27,-45);g.stroke();
  g.lineWidth=4;
  [[-16,10],[-6,12],[8,12],[18,10]].forEach(p=>{g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(p[0]+2,p[1]+26);g.stroke();});
  g.beginPath();g.moveTo(-26,-4);g.lineTo(-34,-10);g.stroke();
  g.restore();
}
function deerL0(g,W,H){
  const sky=g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#f7b733');sky.addColorStop(.45,'#e08e4e');sky.addColorStop(.7,'#7a5a3a');sky.addColorStop(1,'#3d3423');
  g.fillStyle=sky;g.fillRect(0,0,W,H);

  sun.addColorStop(0,'rgba(255,250,220,1)');sun.addColorStop(1,'transparent');
  g.fillStyle=sun;g.fillRect(0,0,W,H);

  for(let x=0;x<W;x+=46){const h=60+((x*37)%70);g.beginPath();g.ellipse(x,H*.62-h/2,34,h,0,0,TAU);g.fill();}

/* 真实 EHT 2017 台站（简化 7 台）：[名称, 纬度°, 经度°] */
const STATIONS=[
  ['ALMA 智利',-23.03,-67.75],
  ['LMT 墨西哥',18.99,-97.31],
  ['SMT 亚利桑那',32.70,-109.89],
  ['SMA 夏威夷',19.82,-155.48],
  ['JCMT 夏威夷',19.82,-155.44],
  ['IRAM 西班牙',37.07,-3.39],
  ['SPT 南极点',-90,0],

const LAM_EHT=0.0013;                 /* m：1.3 mm（230 GHz） */
const RE=6.371e6;                     /* m：地球半径 */
const GIGA=RE/LAM_EHT/1e9;            /* 每地球半径 ≈ 4.9 Gλ */
const DEC=12.4*Math.PI/180;           /* M87 赤纬 +12.4° */
/* —— 天空模型：不对称亮环（模拟 M87* 黑洞阴影，南亮北暗=多普勒增亮） —— */
const RING=[];
(function(){
  const N=64, r0=0.70, sig=0.13;
  for(let iy=0;iy<N;iy++)for(let ix=0;ix<N;ix++){
    const l=(ix/(N-1)*2-1), m=(iy/(N-1)*2-1);
    const r=Math.hypot(l,m);
    const rad=Math.exp(-(r-r0)*(r-r0)/(2*sig*sig));
    if(rad<0.05)continue;
    const az=Math.atan2(m,l);          /* m 向下为正 → az=+90° 是南 */
    const asym=0.55+0.45*Math.sin(az); /* 南部（下方）增亮 */
    RING.push({l,m,I:rad*asym});
  }
})();
const THU=30/206265e6;                /* 图像 l=1 ↔ 30 μas（环直径≈42 μas） */
function visibility(u,v){             /* u,v 单位 Gλ → 物理波长数 ×1e9 */
  let re=0, im=0;
  const uu=u*1e9*THU, vv=v*1e9*THU;
  for(let i=0;i<RING.length;i++){
    const p=RING[i];
    const ph=-TAU*(uu*p.l+vv*p.m);
    re+=p.I*Math.cos(ph);im+=p.I*Math.sin(ph);
  }
  return [re,im];
}
/* —— 仿真状态 —— */
let H=0, playing=true, nSt=7, lastUI=0;

function resetEht(){

function baselines(){
  const st=STATIONS.slice(0,nSt).map(s=>{
    const la=s[1]*Math.PI/180, lo=s[2]*Math.PI/180;
    return [Math.cos(la)*Math.cos(lo),Math.cos(la)*Math.sin(lo),Math.sin(la)];
  });
  const bl=[];
  for(let i=0;i<st.length;i++)for(let j=i+1;j<st.length;j++)
    bl.push([st[i][0]-st[j][0],st[i][1]-st[j][1],st[i][2]-st[j][2]]);
  return bl;
}
function uvOf(b,h){
  /* 基线随地球自转：绕极轴转 h；源方向固定，东 e=(0,1,0)，北 n=(-sinδ,0,cosδ) */
  const bx=b[0]*Math.cos(h)-b[1]*Math.sin(h);
  const by=b[0]*Math.sin(h)+b[1]*Math.cos(h);
  const u=by*GIGA;
  const v=(-Math.sin(DEC)*bx+Math.cos(DEC)*b[2])*GIGA;

function stepEht(dt){
  if(!playing||doneObs)return;
  H+=dt*.42;
  if(H>=TAU){H=TAU;doneObs=true;playing=false;
    sec.querySelector('#ehtPlay').textContent='▶ 重新播放';
  }
  const bl=baselines();
  bl.forEach((b,i)=>{
    if(H-lastSampleH[i]<0.035)return;
    lastSampleH[i]=H;
    const [u,v]=uvOf(b,H);
    const V=visibility(u,v);
    /* 真实干涉仪同时得到 (u,v) 与 (-u,-v)（共轭） */
    [[u,v,V],[-u,-v,[V[0],-V[1]]]].forEach(([uu,vv,VV])=>{
      uvPts.push([uu,vv]);
      const u2=uu*1e9*THU, v2=vv*1e9*THU;
      for(let iy=0;iy<DS;iy++){
        const m=(iy/(DS-1)*2-1);
        for(let ix=0;ix<DS;ix++){
          const l=(ix/(DS-1)*2-1);
          const ph=TAU*(u2*l+v2*m);
          dirty[iy*DS+ix]+=VV[0]*Math.cos(ph)-VV[1]*Math.sin(ph);
        }
      }
    });
  });

  let bmax=0;bl.forEach(b=>{const n=Math.hypot(b[0],b[1],b[2]);if(n>bmax)bmax=n;});
  const theta=LAM_EHT/(bmax*RE);          /* rad：EHT 实测 ≈ 20–25 微角秒 */
  sec.querySelector('#roEht').innerHTML=`
    <div class="ro"><div class="k">地球自转角（观测时长）</div><div class="v">${(H/TAU*24).toFixed(1)} / 24 h</div></div>
    <div class="ro"><div class="k">uv 采样点（傅里叶分量）</div><div class="v">${uvPts.length}</div></div>
    <div class="ro"><div class="k">最长基线</div><div class="v">${(bmax*6371).toFixed(0)} km</div></div>
    <div class="ro"><div class="k">分辨率 θ≈λ/B</div><div class="v">${fmtTheta(theta)}</div></div>`;
  sec.querySelector('#knEht').innerHTML=doneObs
    ?`<b>观测完成！</b>右侧对比：你的重建 vs EHT 2019 发布图——同一个不对称亮环（直径 42±3 微角秒）。真实历史：8 台毫米波望远镜同时对准 M87，氢原子钟同步、5 PB 数据<b>用硬盘空运</b>到美德两台相关器，四套独立算法盲重建出同一幅图，2019-04-10 全球发布。环的南边更亮：黑洞吸积流旋转，朝我们转的一侧被相对论性增亮。`
    :`<b>原理（孔径合成）</b>：每对台站 = 一条基线，只测出天空图像的<b>一个空间频率</b> V(u,v)。地球自转带着基线在 uv 平面上扫出椭圆轨道——转一夜，就等于"扫"出一个地球那么大的虚拟口径。再把所有傅里叶分量反变换回去，图像就浮现了。台站越少，uv 覆盖越稀，环越糊——把台站数拉到 3 试试。`;
}
function drawEht(t,dt){
  stepEht(dt);
  const {w,h,ctx}=fitCanvas(cvEht);
  ctx.clearRect(0,0,w,h);
  const cyY=h*.47, R0=h*.30;
  const gcx=w*.17, ucx=w*.5, icx=w*.83;
  /* ========== 左：旋转地球 + 台站 ========== */
  const grd=ctx.createRadialGradient(gcx-R0*.3,cyY-R0*.3,R0*.1,gcx,cyY,R0);
  grd.addColorStop(0,'#16283e');grd.addColorStop(1,'#0a1018');
  ctx.fillStyle=grd;ctx.beginPath();ctx.arc(gcx,cyY,R0,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(120,180,255,.4)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(gcx,cyY,R0,0,TAU);ctx.stroke();
  /* 经纬网（随 H 自转） */
  ctx.strokeStyle='rgba(120,180,255,.16)';ctx.lineWidth=1;
  for(let la=-60;la<=60;la+=30){
    const rr=Math.cos(la*Math.PI/180)*R0, yy=Math.sin(la*Math.PI/180)*R0;
    ctx.beginPath();ctx.ellipse(gcx,cyY-yy,rr,rr*.28,0,0,TAU);ctx.stroke();
  }
  for(let lo=0;lo<180;lo+=30){
    ctx.beginPath();ctx.ellipse(gcx,cyY,R0*Math.abs(Math.cos(lo*Math.PI/180+H)),R0,0,0,TAU);ctx.stroke();
  }
  /* 台站 */
  const stPos=[];
  STATIONS.slice(0,nSt).forEach(s=>{
    const la=s[1]*Math.PI/180, lo=s[2]*Math.PI/180;
    const x0=Math.cos(la)*Math.cos(lo), y0=Math.cos(la)*Math.sin(lo), z0=Math.sin(la);
    /* 自转：绕极轴（屏幕 y）转 H */
    const xr=x0*Math.cos(H)-y0*Math.sin(H);
    const zr=x0*Math.sin(H)+y0*Math.cos(H);
    const sx=gcx+zr*R0, sy=cyY-z0*R0;
    const front=xr>0;
    stPos.push([sx,sy,front]);
    glow(ctx,'#00F0FF',front?8:2);
    ctx.fillStyle=front?'#00F0FF':'rgba(0,240,255,.25)';
    ctx.beginPath();ctx.arc(sx,sy,front?3.4:2.4,0,TAU);ctx.fill();noGlow(ctx);
    if(front)text(ctx,s[0],sx+8,sy+3,{size:9,color:'rgba(139,233,253,.9)'});
  });
  /* 基线连线（面向源的台站对） */
  ctx.strokeStyle='rgba(0,240,255,.14)';ctx.lineWidth=1;
  for(let i=0;i<stPos.length;i++)for(let j=i+1;j<stPos.length;j++){
    if(!stPos[i][2]||!stPos[j][2])continue;
    ctx.beginPath();ctx.moveTo(stPos[i][0],stPos[i][1]);ctx.lineTo(stPos[j][0],stPos[j][1]);ctx.stroke();
  }
  /* 源方向 */
  ctx.strokeStyle='rgba(255,107,53,.5)';ctx.setLineDash([4,4]);ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(gcx-R0*.6,cyY-R0*1.7);ctx.lineTo(gcx-R0*.1,cyY-R0*1.05);ctx.stroke();ctx.setLineDash([]);
  text(ctx,'M87 方向',gcx-R0*.6,cyY-R0*1.78,{size:9.5,color:'rgba(255,150,90,.85)',align:'center'});
  text(ctx,'① 地球自转',gcx,h*.88,{size:11,color:'rgba(255,255,255,.6)',align:'center',weight:700});
  /* 自转箭头 */
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.arc(gcx,cyY,R0+10,-.5,.4);ctx.stroke();
  arrow(ctx,gcx+(R0+10)*Math.cos(.4)+Math.sin(.4)*9,cyY+(R0+10)*Math.sin(.4)-Math.cos(.4)*9,
        gcx+(R0+10)*Math.cos(.4),cyY+(R0+10)*Math.sin(.4),'rgba(255,255,255,.45)',1.5,6);
  /* ========== 中：uv 覆盖 ========== */
  const uR=R0*1.05;
  ctx.fillStyle='#0b0e16';ctx.beginPath();ctx.arc(ucx,cyY,uR,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,184,0,.3)';ctx.lineWidth=1;
  [1/3,2/3,1].forEach(rr=>{ctx.beginPath();ctx.arc(ucx,cyY,uR*rr,0,TAU);ctx.stroke();});
  ctx.beginPath();ctx.moveTo(ucx-uR,cyY);ctx.lineTo(ucx+uR,cyY);ctx.moveTo(ucx,cyY-uR);ctx.lineTo(ucx,cyY+uR);ctx.stroke();
  const UMAX=11; /* Gλ */
  uvPts.forEach(p=>{
    const x=ucx+p[0]/UMAX*uR, y=cyY-p[1]/UMAX*uR;
    ctx.fillStyle='rgba(255,184,0,.75)';ctx.fillRect(x-.9,y-.9,1.8,1.8);
  });
  /* 当前时刻基线 uv 点（闪亮） */
  baselines().forEach(b=>{
    const [u,v]=uvOf(b,H);
    [[u,v],[-u,-v]].forEach(([uu,vv])=>{
      const x=ucx+uu/UMAX*uR, y=cyY-vv/UMAX*uR;
      glow(ctx,'#FFD34D',7);ctx.fillStyle='#FFE9A0';
      ctx.beginPath();ctx.arc(x,y,2.2,0,TAU);ctx.fill();noGlow(ctx);
    });
  });
  text(ctx,'② uv 平面覆盖',ucx,h*.88,{size:11,color:'rgba(255,255,255,.6)',align:'center',weight:700});
  text(ctx,'u (Gλ)',ucx+uR+16,cyY+4,{size:9,color:'rgba(255,184,0,.6)'});
  text(ctx,'v',ucx+4,cyY-uR-6,{size:9,color:'rgba(255,184,0,.6)'});
  /* ========== 右：脏图像 ========== */
  const iR=R0*1.05;
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(icx,cyY,iR,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,107,53,.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(icx,cyY,iR,0,TAU);ctx.stroke();
  if(dirty){
    /* 找峰值归一化 */
    let mx=0;for(let i=0;i<DS*DS;i++)if(dirty[i]>mx)mx=dirty[i];
    if(mx>0){
      const cell=2*iR/DS;
      for(let iy=0;iy<DS;iy++)for(let ix=0;ix<DS;ix++){
        const v=dirty[iy*DS+ix]/mx;
        if(v<0.06)continue;
        const vv=Math.min(1,v);
        /* 黑→深红→橙→白（黑洞照片配色） */
        const r=Math.min(255,vv*520), g=Math.min(255,Math.max(0,vv-.28)*380), b2=Math.min(255,Math.max(0,vv-.62)*560);
        ctx.fillStyle=`rgba(${r|0},${g|0},${b2|0},${.85*vv})`;
        const px=icx-iR+ix*cell, py=cyY-iR+iy*cell;
        ctx.fillRect(px-cell*.5,py-cell*.5,cell*1.05,cell*1.05);
      }
    }
  }
  text(ctx,'③ 脏图像（实时重建）',icx,h*.88,{size:11,color:'rgba(255,255,255,.6)',align:'center',weight:700});
  /* 完成后：对比 EHT 真实发布图 */
  if(doneObs){
    const bx=w*.30, by=h*.90, bw=w*.4, bh=h*.065;
    ctx.fillStyle='rgba(18,18,26,.92)';roundRect(ctx,bx,by,bw,bh,10);ctx.fill();
    ctx.strokeStyle='#FF6B35';ctx.lineWidth=1.2;ctx.stroke();
    text(ctx,'✔ 重建出不对称亮环（南亮北暗）· 环直径 ≈ 42 μas —— 与 EHT 2019-04-10 发布图一致',bx+bw/2,by+bh/2,{size:11.5,color:'#FFB37A',align:'center',weight:700});
  }
  if(!playing&&!doneObs)text(ctx,'⏸ 已暂停',icx,cyY-iR-10,{size:10.5,color:'rgba(255,255,255,.5)',align:'center'});
  if(t-lastUI>.25){updateEhtUI();lastUI=t;}
}
/* ---------------- 主循环 ---------------- */
makeLoop('z5',(t,dt)=>{
  if(pane==='dish')drawDish(t);
  else if(pane==='interf')drawInterf(t);
  else drawEht(t,dt);
},()=>pane!=='eht'||playing);
resetEht();
updateDishUI();updateInterfUI();updateEhtUI();
})();

function wrapText(ctx,str,x,y,maxW,lh,color,size){

  let line='',yy=y;
  for(const ch of str){
    if(ctx.measureText(line+ch).width>maxW||ch==='\n'){ctx.fillText(line,x,yy);line=ch==='\n'?'':ch;yy+=lh;}
    else line+=ch;

let pollenOff=null;
function getPollen(W,H){
  if(pollenOff)return pollenOff;
  pollenOff=document.createElement('canvas');pollenOff.width=W;pollenOff.height=H;
  const g=pollenOff.getContext('2d');
  g.fillStyle='#0c0c0c';g.fillRect(0,0,W,H);
  const cx=W/2, cy=H/2, R=W*.3;
  /* 球体明暗（左上光源） */
  const base=g.createRadialGradient(cx-R*.4,cy-R*.45,R*.1,cx,cy,R*1.15);
  base.addColorStop(0,'#e8e8e8');base.addColorStop(.5,'#909090');base.addColorStop(1,'#181818');
  g.fillStyle=base;g.beginPath();g.arc(cx,cy,R,0,TAU);g.fill();
  /* 刺（echinate） */
  for(let i=0;i<160;i++){
    const a=((i*137.5)%360)*Math.PI/180, rr=R*(0.15+ ((i*89)%85)/100);
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr*.98;
    const shade=Math.max(40,Math.min(230,200-(x-cx)/R*130-(y-cy)/R*60))|0;
    const sl=(R*.075)*(0.7+((i*31)%60)/100);
    g.fillStyle=`rgb(${shade-30},${shade-30},${shade-30})`;
    g.beginPath();g.moveTo(x-sl*.5,y+sl*.35);g.lineTo(x+sl*.28,y+sl*.4);g.lineTo(x-sl*.05,y-sl*.7);g.closePath();g.fill();
    g.fillStyle=`rgb(${Math.min(255,shade+40)|0},${Math.min(255,shade+40)|0},${Math.min(255,shade+40)|0})`;
    g.beginPath();g.moveTo(x-sl*.5,y+sl*.35);g.lineTo(x-sl*.05,y-sl*.7);g.lineTo(x-sl*.2,y+sl*.3);g.closePath();g.fill();
  }
  /* 表面颗粒 */
  for(let i=0;i<500;i++){
    const a=((i*97)%628)/100, rr=R*Math.sqrt(((i*53)%100)/100)*.95;
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
    const shade=Math.max(30,Math.min(220,190-(x-cx)/R*120))|0;
    g.fillStyle=`rgba(${shade},${shade},${shade},.5)`;
    g.beginPath();g.arc(x,y,1+((i*7)%3),0,TAU);g.fill();
  }
  /* 萌发孔 */
  g.fillStyle='#141414';g.beginPath();g.ellipse(cx+R*.35,cy-R*.3,R*.09,R*.14,.5,0,TAU);g.fill();
  g.strokeStyle='rgba(200,200,200,.5)';g.lineWidth=2;g.stroke();
  return pollenOff;
}

  drawCoil(ctx,cx,h*.3,22,true,'扫描线圈（X-Y 偏转）');
  /* 束流 */
  const beamX=cx-R+(col*2-1)*R*.94;
  const beamY=cy-R+(row/ROWS)*R*1.9;
  glow(ctx,'#C8FF00',8);ctx.strokeStyle='rgba(200,255,0,.85)';ctx.lineWidth=2.2;
  ctx.beginPath();ctx.moveTo(cx,h*.34);ctx.lineTo(beamX,beamY);ctx.stroke();noGlow(ctx);
  /* 偏转示意 */
  ctx.strokeStyle='rgba(200,255,0,.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx,h*.34);ctx.lineTo(cx-R,cy-R);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,h*.34);ctx.lineTo(cx+R,cy-R);ctx.stroke();
  /* 花粉 */
  const pg=ctx.createRadialGradient(cx-R*.3,cy-R*.35,6,cx,cy,R);
  pg.addColorStop(0,'#c9b46a');pg.addColorStop(.6,'#8a7434');pg.addColorStop(1,'#3a2e10');
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fill();
  for(let i=0;i<40;i++){
    const a=((i*137.5)%360)*Math.PI/180, rr=R*(0.2+((i*89)%80)/100);
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
    ctx.strokeStyle='rgba(60,45,15,.8)';ctx.lineWidth=1.6;
    ctx.beginPath();gLine(ctx,x,y,x+Math.cos(a)*7,y+Math.sin(a)*7);
  }
  ctx.strokeStyle='rgba(255,240,180,.35)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(cx,cy,R,-2.4,-1.2);ctx.stroke();
  /* 载物台 */
  ctx.fillStyle='#3a4152';ctx.fillRect(cx-R-30,cy+R+16,R*2+60,12);
  ctx.fillRect(cx-8,cy+R+28,16,h*.1);
  text(ctx,'载物台（样品已喷金）',cx-R-70,cy+R+24,{size:9.5,color:'rgba(255,255,255,.45)',align:'right'});
  /* 束斑 + 二次电子 */
  glow(ctx,'#C8FF00',14);ctx.fillStyle='#E8FF8A';
  ctx.beginPath();ctx.arc(beamX,beamY,3.4,0,TAU);ctx.fill();noGlow(ctx);
  for(let i=0;i<7;i++){
    const a=-Math.PI/2+Math.sin(t*9+i*2.2)*1.1, l=10+((t*97+i*31)%30);
    ctx.strokeStyle=`rgba(255,211,77,${.8-l/40})`;ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(beamX,beamY);
    ctx.quadraticCurveTo(beamX+Math.cos(a)*l*.5,beamY+Math.sin(a)*l*.5,beamX+Math.cos(a)*l*.8,beamY+Math.sin(a)*l);
    ctx.stroke();
  }
  /* ETD 探测器 */
  const dx=w*.78, dy=h*.5;
  const dg2=ctx.createRadialGradient(dx,dy,4,dx,dy,30);
  dg2.addColorStop(0,'rgba(0,240,255,.5)');dg2.addColorStop(1,'rgba(0,240,255,.05)');
  ctx.fillStyle=dg2;glow(ctx,'#00F0FF',10);
  ctx.beginPath();ctx.arc(dx,dy,26,0,TAU);ctx.fill();noGlow(ctx);
  ctx.strokeStyle='#00F0FF';ctx.lineWidth=2;ctx.stroke();
  text(ctx,'ETD',dx,dy,{size:11,color:'#fff',align:'center',weight:800,mono:true});
  text(ctx,'二次电子探测器',dx,dy+40,{size:9.5,color:'#00F0FF',align:'center'});
  /* 收集线 */
  ctx.strokeStyle='rgba(255,211,77,.5)';ctx.setLineDash([4,4]);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(beamX,beamY);ctx.quadraticCurveTo((beamX+dx)/2,beamY-60,dx-28,dy);ctx.stroke();
  ctx.setLineDash([]);
  /* 信号同步线到显示器 */
  text(ctx,'信号逐点同步 →',w*.82,h*.8,{size:10,color:'rgba(0,240,255,.7)',align:'center'});
  ctx.strokeStyle='rgba(0,240,255,.4)';ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(dx,dy+52);ctx.quadraticCurveTo(dx,h*.86,w*.86,h*.88);ctx.stroke();ctx.setLineDash([]);
  text(ctx,`扫描进度 ${(scanP*100).toFixed(0)}% · 第 ${Math.min(ROWS,row+1)}/${ROWS} 行`,24,h-16,{size:11,color:'#C8FF00',mono:true});
  const ro=sec.querySelector('#roSEM');
  ro.innerHTML=`
    <div class="ro"><div class="k">扫描进度</div><div class="v">${(scanP*100).toFixed(0)}%</div></div>
    <div class="ro"><div class="k">放大倍率</div><div class="v">3,000×</div></div>
    <div class="ro"><div class="k">成像信号</div><div class="v">二次电子</div></div>
    <div class="ro"><div class="k">图像本色</div><div class="v" style="color:${colorize?'#FFB800':'#C8FF00'}">${colorize?'伪彩（后期上色）':'黑白（原始）'}</div></div>`;
}
function gLine(ctx,x1,y1,x2,y2){ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();}
function drawMonitor(t){
  const {w,h,ctx}=fitCanvas(cvMonitor);
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,w,h);
  const src=getPollen(400,400);
  const scanP=Math.min(1,(t-scanStart)/SCAN_T);
  const rows=Math.floor(scanP*ROWS);
  /* 逐行显示 */
  ctx.drawImage(src,0,0,400,rows/ROWS*400,0,0,w,rows/ROWS*h);
  /* 当前扫描行闪白 */
  if(scanP<1){
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.fillRect(0,rows/ROWS*h,w,2);
    /* 未扫描区噪点 */
    ctx.fillStyle='rgba(255,255,255,.05)';
    for(let i=0;i<40;i++){ctx.fillRect((i*97)%w,rows/ROWS*h+((i*53)%(h-rows/ROWS*h)),2,2);}
  }
  if(colorize){
    ctx.save();ctx.globalCompositeOperation='color';
    const cg=ctx.createLinearGradient(0,0,w,h);
    cg.addColorStop(0,'#c040a0');cg.addColorStop(.5,'#8040d0');cg.addColorStop(1,'#3040c0');
    ctx.fillStyle=cg;ctx.fillRect(0,0,w,rows/ROWS*h);
    ctx.restore();
    ctx.save();ctx.globalCompositeOperation='overlay';
    ctx.fillStyle='rgba(255,120,40,.25)';ctx.fillRect(0,0,w,rows/ROWS*h);
    ctx.restore();
  }
  ctx.strokeStyle='rgba(0,240,255,.5)';ctx.lineWidth=2;ctx.strokeRect(2,2,w-4,h-4);
  /* 标尺 */
  const bar=w*.16;
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(w-16-bar,h-22);ctx.lineTo(w-16,h-22);ctx.stroke();
  text(ctx,'10 μm',w-16-bar/2,h-32,{size:10.5,color:'#fff',align:'center',mono:true});
  text(ctx,'SEM · 花粉（菊科）· 3,000×',14,h-14,{size:10.5,color:'rgba(255,255,255,.75)'});
  text(ctx,colorize?'🎨 伪彩模式：颜色是后期映射的！':'原始信号：灰度（电子没有颜色）',14,18,{size:10.5,color:colorize?'#FFB800':'rgba(255,255,255,.55)'});
}
updateLimitUI();updateTEMUI();
makeLoop('z6',(t)=>{
  if(subt==='limit')drawLimit(t);
  else if(subt==='tem'){drawTEM(t);drawScreen(t);}
  else{drawSEM(t);drawMonitor(t);}
},()=>subt!=='limit');
})();
</script>


<script>
/* ================================================================
   ZONE 07 · 易错剖析：水杯透镜（3D 光路 + 全真视效）
================================================================ */
(function(){
const sec=document.getElementById('sec-z7');
sec.innerHTML=`
<div class="stitle"><span class="step">ZONE 07</span><h2>易错剖析 · 水杯是凸透镜吗？</h2><span class="badge">柱面 vs 球面 · 斯涅尔折射 3D 演示</span></div>
<p class="sdesc">经典易错题：透过装满水的圆柱水杯看远处景物，会看到什么？<b>不是"上下左右全颠倒"</b>！拖动下方 3D 光路台：圆柱水杯<b>只在水平截面内折射会聚</b>（光线在两个水面处明显拐折、交叉），竖直方向只是一块平行平板（光直进直出）——所以像<b>只左右颠倒，上下不变</b>。一键切换"球面凸透镜"对照组：两个方向都会聚交叉，才是全颠倒。下方视效窗由逐光线折射追踪实时生成。</p>
<div class="lab">
  <div class="panel"><h4>3D 光路台 · 光从景物射向眼睛（按住拖拽旋转）</h4>
    <canvas class="stage" id="cvCup3d" style="aspect-ratio:16/10.5;cursor:grab"></canvas>
    <div class="legend">
