      <span><i style="background:#8BE9FD"></i>竖直截面光线（平板·方向不变）</span>
      <span><i style="background:#00E5A0"></i>水（柱面/球面）</span>
    </div>
  </div>
  <div class="panel"><h4>实验控制台</h4>
    <div class="btnrow" style="margin-bottom:12px">
      <button class="btn mini sel" id="lensCyl">🥛 圆柱水杯（柱面）</button>
      <button class="btn mini" id="lensBall">🔮 球面凸透镜（对照）</button>
    </div>
    <div class="btnrow" style="margin-bottom:12px" id="cupmode">
      <button class="btn mini sel" data-c="full">满杯水</button>
      <button class="btn mini" data-c="half">半杯水</button>
      <button class="btn mini" data-c="empty">空杯</button>
    </div>
    <div class="ctrl"><label>景物距离 D（到杯心，R=杯半径）<output id="distv">4.5 R</output></label>
      <input type="range" id="dist" min="11" max="60" value="45"></div>
    <div class="readout" id="roCup"></div>
    <div class="knote"><b>易错点 ①</b>：把"圆柱水杯"直接当"凸透镜"，以为像会<b>上下左右全颠倒</b>。真相：它只在水平截面内是透镜（焦距 <span class="f">f ≈ nR/2(n−1) ≈ 2R</span>）——<b>左右颠倒</b>；竖直方向是平行平板——<b>上下不变</b>。</div>
    <div class="knote"><b>易错点 ②</b>：以为装水必定成倒像。真相：和凸透镜一样看物距！<b>景物在一倍焦距内（D<2R）→ 正立放大；超过焦距 → 左右颠倒</b>。拖"景物距离"到 2R 以内验证。</div>
    <table class="matrix">
      <tr><th>截面方向</th><th>柱面水杯</th><th>球面凸透镜</th></tr>
      <tr><td>水平截面</td><td class="hot">会聚·交叉→颠倒</td><td class="hot">会聚·交叉→颠倒</td></tr>
      <tr><td>竖直截面</td><td class="hot">平行平板→不变</td><td>会聚·交叉→颠倒</td></tr>
      <tr><td>最终像</td><td class="hot">只左右颠倒</td><td>上下左右全颠倒</td></tr>
    </table>
  </div>
</div>
<div class="panel" style="margin-top:18px"><h4>全真视效窗 · 透过水杯你看到的画面（逐光线折射计算）</h4>
  <canvas class="stage" id="cvView" style="aspect-ratio:21/8"></canvas>
  <p class="hint">左：眼睛直接看到的景物（参照）｜右：透过水杯看到的——"F"字母与小屋<b>左右翻转、上下不变</b>；把距离拉到 1.5R 以下（一倍焦距内）再看：变成正立放大！半杯水时只有水面以下部分翻转。</p>
</div>`;
const cv3d=sec.querySelector('#cvCup3d'), cvView=sec.querySelector('#cvView');
const N_WATER=1.33;
let cupMode='full', lensType='cyl';
sec.querySelectorAll('#cupmode .btn').forEach(b=>b.onclick=()=>{
  cupMode=b.dataset.c;
  sec.querySelectorAll('#cupmode .btn').forEach(x=>x.classList.toggle('sel',x===b));
});
sec.querySelector('#lensCyl').onclick=()=>{lensType='cyl';
  sec.querySelector('#lensCyl').classList.add('sel');sec.querySelector('#lensBall').classList.remove('sel');};
sec.querySelector('#lensBall').onclick=()=>{lensType='ball';
  sec.querySelector('#lensBall').classList.add('sel');sec.querySelector('#lensCyl').classList.remove('sel');};
const distS=sec.querySelector('#dist');
distS.oninput=()=>sec.querySelector('#distv').textContent=(+distS.value/10).toFixed(1)+' R';
/* ---------- 折射追踪核心 ---------- */
function v2(x,y){return{x,y};}
function refr2(I,N,n1,n2){
  let ci=-(I.x*N.x+I.y*N.y);
  if(ci<0){N=v2(-N.x,-N.y);ci=-ci;} /* 法线自动取向：保证迎着入射光 */
  const eta=n1/n2;
  const k=1-eta*eta*(1-ci*ci);
  if(k<0)return null;
  const f=eta*ci-Math.sqrt(k);
  return v2(eta*I.x+f*N.x, eta*I.y+f*N.y);
}
function rayCircle(o,d,c,r){
  const ox=o.x-c.x, oy=o.y-c.y;
  const a=d.x*d.x+d.y*d.y, b=2*(ox*d.x+oy*d.y), cc=ox*ox+oy*oy-r*r;
  const disc=b*b-4*a*cc;
  if(disc<0)return null;
  const sq=Math.sqrt(disc);
  const t1=(-b-sq)/(2*a), t2=(-b+sq)/(2*a);
  return t1>1e-6?t1:(t2>1e-6?t2:null);
}
/* 从眼睛向后追踪（2D 截面，圆形水柱/水球截面相同） */
function traceCup(ex,angle,cx,R,D){
  const o=v2(ex,0), d=v2(-Math.cos(angle),Math.sin(angle));
  const t=rayCircle(o,d,v2(cx,0),R);
  if(t===null){
    const tt=(-D-ex)/d.x;
    return {y:d.y*tt, hit:false};
  }
  const p1=v2(o.x+d.x*t,o.y+d.y*t);
  const n1=v2(-(p1.x-cx)/R,-p1.y/R);
  const dIn=refr2(d,n1,1,N_WATER);
  if(!dIn)return {y:null,hit:true};
  const t2=rayCircle(p1,dIn,v2(cx,0),R);
  const p2=v2(p1.x+dIn.x*t2,p1.y+dIn.y*t2);
  const n2=v2((p2.x-cx)/R,p2.y/R);
  const dOut=refr2(dIn,n2,N_WATER,1);
  if(!dOut)return {y:null,hit:true};
  const tt=(-D-p2.x)/dOut.x;
  return {y:p2.y+dOut.y*tt, hit:true, path:[[o.x,o.y],[p1.x,p1.y],[p2.x,p2.y],[-D,p2.y+dOut.y*tt]]};
}
/* ---------- 3D 光路台（正向追迹：景物 → 水杯 → 实像 → 眼睛） ---------- */
let yaw3=.9, pitch3=.42, drag3=false, px3=0, py3=0, auto3=false; // 默认固定视角：保证物-镜-像-眼全程可见
cv3d.addEventListener('pointerdown',e=>{drag3=true;auto3=false;px3=e.clientX;py3=e.clientY;cv3d.setPointerCapture(e.pointerId);cv3d.style.cursor='grabbing';});
cv3d.addEventListener('pointermove',e=>{
  if(!drag3)return;
  yaw3+=(e.clientX-px3)*.008; pitch3+=(e.clientY-py3)*.008;
  pitch3=Math.max(-1.2,Math.min(1.2,pitch3));px3=e.clientX;py3=e.clientY;
});
const end3=()=>{if(drag3){drag3=false;cv3d.style.cursor='grab';}};
cv3d.addEventListener('pointerup',end3);cv3d.addEventListener('pointercancel',end3);
function drawCup3D(t,dt){
  const {w,h,ctx}=fitCanvas(cv3d);
  ctx.clearRect(0,0,w,h);
  if(auto3&&!drag3)yaw3+=dt*.18;
  const R=1, D=+distS.value/10*R, NW=N_WATER;
  const fR=NW*R/(2*(NW-1));            // 平行光焦距（从杯心主面量起）≈2.02R
  const eyeX=4.2*R, objX=-D, yH=.95;   // 水平截面过 F 横臂高度（眼在所有 D 的实像之后）
  const fl=6.2, scale=Math.min(w/11,h/5.8), cxs=w*.52, cys=h*.58;
  const proj=p=>{
    const q=rotYP(p,yaw3,pitch3);
    const k=fl/(fl+q.z);
    return [cxs+q.x*k*scale, cys-q.y*k*scale, q.z, k];
  };
  const P3=(x,y,z)=>proj(V3(x,y,z));
  const line3=(a,b,color,lw,dash)=>{
    const pa=P3(a[0],a[1],a[2]), pb=P3(b[0],b[1],b[2]);
    ctx.save();if(dash)ctx.setLineDash(dash);
    ctx.strokeStyle=color;ctx.lineWidth=lw;
    ctx.beginPath();ctx.moveTo(pa[0],pa[1]);ctx.lineTo(pb[0],pb[1]);ctx.stroke();ctx.restore();
  };
  const poly3=(pts,color,lw)=>{for(let i=0;i<pts.length-1;i++)line3(pts[i],pts[i+1],color,lw);};
  const quad3=(pts,fill)=>{
    ctx.fillStyle=fill;ctx.beginPath();
    pts.forEach((p,i)=>{const q=P3(p[0],p[1],p[2]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});
    ctx.closePath();ctx.fill();
  };
  const arr3=(a,b,color)=>{ /* 短箭头指示光的传播方向 */
    const pa=P3(a[0],a[1],a[2]), pb=P3(b[0],b[1],b[2]);
    arrow(ctx,pa[0],pa[1],pb[0],pb[1],color,1.8,6.5);
  };
  /* ===== 正向折射追迹（2D 截面：圆界面两次折射） ===== */
  function traceFwd(ox,ou,ang){
    const o=v2(ox,ou), d=v2(Math.cos(ang),Math.sin(ang));
    const path=[[ox,ou]];
    const t1=rayCircle(o,d,v2(0,0),R);
    if(t1===null){path.push([ox+d.x*9,ou+d.y*9]);return{path,miss:true};}
    const p1=v2(o.x+d.x*t1,o.y+d.y*t1);
    const n1=v2(p1.x/R,p1.y/R); /* 外法线（refr2 自动取向） */
    const dIn=refr2(d,n1,1,NW);
    path.push([p1.x,p1.y]);
    if(!dIn)return{path,tir:true};
    const t2=rayCircle(p1,dIn,v2(0,0),R);
    if(t2===null)return{path,tir:true}; /* 数值退化：放弃该光线 */
    const p2=v2(p1.x+dIn.x*t2,p1.y+dIn.y*t2);
    const n2=v2(p2.x/R,p2.y/R);
    const dOut=refr2(dIn,n2,NW,1);
    path.push([p2.x,p2.y]);
    if(!dOut)return{path,tir:true};
    let Lx=(4.55-p2.x)/dOut.x;
    if(!isFinite(Lx)||Lx<0||Math.abs(dOut.x)<.05)Lx=3;
    path.push([p2.x+dOut.x*Lx,p2.y+dOut.y*Lx]);
    return{path,exit:{p:[p2.x,p2.y],d:[dOut.x,dOut.y]}};
  }
  /* 平行平板（竖直截面·柱面水杯）：方向不变、微小侧移——精确两次折射 */
  function tracePlate(ox,oy,ang){
    const d=v2(Math.cos(ang),Math.sin(ang));
    const path=[[ox,oy]];
    const t1=(-R-ox)/d.x;
    const p1=v2(ox+d.x*t1,oy+d.y*t1);
    const dIn=refr2(d,v2(-1,0),1,NW);
    path.push([p1.x,p1.y]);
    const t2=(R-p1.x)/dIn.x;
    const p2=v2(p1.x+dIn.x*t2,p1.y+dIn.y*t2);
    const dOut=refr2(dIn,v2(1,0),NW,1);
    path.push([p2.x,p2.y]);
    path.push([p2.x+dOut.x*((5.95-p2.x)/dOut.x),p2.y+dOut.y*((5.95-p2.x)/dOut.x)]);
    return{path};
  }
  function cross2(e1,e2){
    const px=e1.p[0],py=e1.p[1],dx=e1.d[0],dy=e1.d[1];
    const qx=e2.p[0],qy=e2.p[1],ex=e2.d[0],ey=e2.d[1];
    const den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)return null;
    const tt=((qx-px)*ey-(qy-py)*ex)/den;
    return{x:px+dx*tt,y:py+dy*tt,t:tt};
  }
  /* 地面网格 */
  for(let i=-4;i<=4;i++){
    line3([i*.8,-1.5,-2.4],[i*.8,-1.5,2.4],'rgba(255,255,255,.05)',1);
    line3([-3.2,-1.5,i*.6],[3.2,-1.5,i*.6],'rgba(255,255,255,.05)',1);
  }
  /* 截面示意面（半透明） */
  if(cupMode==='full'||lensType==='ball'){
    quad3([[objX-.2,yH,-1.5],[5.9,yH,-1.5],[5.9,yH,1.5],[objX-.2,yH,1.5]],'rgba(255,211,77,.045)');
    quad3([[objX-.2,-1.5,0],[5.9,-1.5,0],[5.9,1.6,0],[objX-.2,1.6,0]],'rgba(139,233,253,.035)');
  }
  /* ===== 景物 F（横臂端点 A = 画面左缘） ===== */
  line3([objX,-1.5,0],[objX,.95,0],'rgba(255,255,255,.5)',3);
  line3([objX,.95,0],[objX,.95,.38],'#C8FF00',4);
  line3([objX,.5,0],[objX,.5,.28],'#C8FF00',4);
  const la=P3(objX,1.18,.1);
  text(ctx,'景物 F',la[0],la[1],{size:11,color:'#C8FF00',align:'center',weight:700});
  text(ctx,'横臂端点 A ↔ 画面左缘',la[0],la[1]+14,{size:9,color:'rgba(200,255,0,.55)',align:'center'});
  const aDot=P3(objX,yH,.38);
  glow(ctx,'#C8FF00',8);ctx.fillStyle='#C8FF00';
  ctx.beginPath();ctx.arc(aDot[0],aDot[1],3,0,TAU);ctx.fill();noGlow(ctx);
  text(ctx,'A',aDot[0]-10,aDot[1]-6,{size:11,color:'#C8FF00',weight:800});
  /* ===== 光线 ===== */
  const photonSegs=[];
  const noWater = (cupMode!=='full') && lensType==='cyl'; // 半杯/空杯：截面在空气中
  /* —— 水平截面（y=yH，金色）：圆界面两次折射 —— */
  const Az=.38, Bz=0;
  const fans=[{uz:Az,n:5,col:'rgba(255,211,77,.95)',edge:true},{uz:Bz,n:3,col:'rgba(255,211,77,.38)',edge:false}];
  let imgA=null;
  fans.forEach(fn=>{
    const th0=Math.atan2(0-fn.uz,0-objX);
    const dmax=Math.atan(.8*R/Math.hypot(objX,fn.uz))*.8;
    const exits=[];
    for(let k=0;k<fn.n;k++){
      const ang=th0+(k/(fn.n-1)-.5)*2*dmax;
      let tr;
      if(noWater){ /* 空气中直进 */
        const d=[Math.cos(ang),Math.sin(ang)];
        tr={path:[[objX,fn.uz],[objX+d[0]*9,fn.uz+d[1]*9]],miss:true};
      }else tr=traceFwd(objX,fn.uz,ang);
      const pts3=tr.path.map(p=>[p[0],yH,p[1]]);
      const isEdge=fn.edge&&(k===0||k===fn.n-1);
      poly3(pts3,isEdge?fn.col:fn.col.replace('.95','.5'),isEdge?2.2:1.2);
      photonSegs.push(pts3);
      if(!noWater&&tr.exit)exits.push(tr.exit);
      /* 折射点法线（径向虚线） */
      if(!noWater&&tr.path.length>=3&&!tr.miss){
        const p1=tr.path[1],p2=tr.path[2];
        line3([0,yH,0],[p1[0]*1.5,yH,p1[1]*1.5],'rgba(255,255,255,.14)',1,[3,4]);
        line3([0,yH,0],[p2[0]*1.5,yH,p2[1]*1.5],'rgba(255,255,255,.14)',1,[3,4]);
      }
      /* 传播方向箭头（首段 + 出射段） */
      if(fn.edge&&isEdge&&tr.path.length>=3){
        const s0=tr.path[0],s1=tr.path[1];
        arr3([s0[0]+(s1[0]-s0[0])*.42,yH,s0[1]+(s1[1]-s0[1])*.42],
             [s0[0]+(s1[0]-s0[0])*.58,yH,s0[1]+(s1[1]-s0[1])*.58],'#FFE9A0');
      }
    }
    /* 实像/虚像判定（A 点，用两侧边缘光线的出射交点） */
    if(fn.edge&&exits.length>=2){
      const c=cross2(exits[0],exits[exits.length-1]);
      if(c&&c.t>.2){ /* 实像：光线真实交叉 */
        imgA={x:c.x,z:c.y,real:true};
      }else if(c){ /* 虚像：反向延长线交叉 */
        imgA={x:c.x,z:c.y,real:false};
        exits.forEach(e=>{
          const bx=e.p[0]-e.d[0]*6, bz=e.p[1]-e.d[1]*6;
          const den=e.d[0]; if(Math.abs(den)<1e-6)return;
          const tt=(c.x-e.p[0])/den;
          line3([e.p[0],yH,e.p[1]],[e.p[0]+e.d[0]*tt,yH,e.p[1]+e.d[1]*tt],'rgba(255,45,143,.5)',1.2,[4,4]);
        });
      }
    }
  });
  /* 实像点 A′ 标记 + 入瞳光 */
  if(imgA){
    const ip=P3(imgA.x,yH,imgA.z);
    if(imgA.real){
      glow(ctx,'#FF2D8F',10);ctx.fillStyle='#FF2D8F';
      ctx.beginPath();ctx.arc(ip[0],ip[1],4.2,0,TAU);ctx.fill();noGlow(ctx);
      tag(ctx,ip[0]+58,ip[1]+32,"A′ 实像：光线真实交叉（A 在左 → A′ 在右 = 左右颠倒）",'#FF7AB8');
      /* 像点发散光进入瞳孔 */
      line3([imgA.x,yH,imgA.z],[eyeX-.12,yH,.1],'rgba(255,255,255,.6)',1.4);
      line3([imgA.x,yH,imgA.z],[eyeX-.12,yH,-.1],'rgba(255,255,255,.6)',1.4);
    }else{
      ctx.strokeStyle='#FF2D8F';ctx.lineWidth=1.6;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.arc(ip[0],ip[1],4.2,0,TAU);ctx.stroke();ctx.setLineDash([]);
      tag(ctx,ip[0]-40,ip[1]-30,"A′ 虚像：反向延长线交点（正立，在物侧）",'#FF7AB8');
    }
  }
  /* 平行光焦点（像侧！）：两条平行于轴的参考光线 */
  if(!noWater){
    [-.2,.2].forEach(z0=>{
      const tr=traceFwd(objX,z0,0);
      const pts3=tr.path.map(p=>[p[0],yH,p[1]]);
      poly3(pts3,'rgba(255,255,255,.35)',1.1);
      photonSegs.push(pts3);
    });
    const fp=P3(fR,yH,0);
    glow(ctx,'#FF2D8F',9);ctx.fillStyle='#FF2D8F';
    ctx.beginPath();ctx.arc(fp[0],fp[1],3.6,0,TAU);ctx.fill();noGlow(ctx);
    text(ctx,'近轴焦点 f≈2R',fp[0]-16,fp[1]+26,{size:10,color:'#FF7AB8',align:'right',mono:true});
  }
  /* —— 竖直截面（z=0）：柱面=平行平板 / 球面=同样会聚 —— */
  const vAng=[-.055,0,.055];
  const thv=Math.atan2(0-yH,0-objX);
  const vExits=[];
  vAng.forEach(da=>{
    const ang=thv+da;
    let tr;
    if(lensType==='cyl'){
      if(cupMode==='full')tr=tracePlate(objX,yH,ang);
      else{const d=[Math.cos(ang),Math.sin(ang)];tr={path:[[objX,yH],[objX+d[0]*9,yH+d[1]*9]]};}
      const pts3=tr.path.map(p=>[p[0],p[1],0]);
      poly3(pts3,'rgba(139,233,253,.7)',1.6);
      photonSegs.push(pts3);
    }else{
      tr=traceFwd(objX,yH,ang);
      const pts3=tr.path.map(p=>[p[0],p[1],0]);
      poly3(pts3,'rgba(255,120,180,.85)',1.7);
      photonSegs.push(pts3);
      if(tr.exit)vExits.push(tr.exit);
    }
  });
  /* 球面竖直截面实像 T′（下方 → 上下颠倒） */
  if(lensType==='ball'&&vExits.length>=2){
    const c=cross2(vExits[0],vExits[vExits.length-1]);
    if(c&&c.t>.2){
      const tp=P3(c.x,c.y,0);
      glow(ctx,'#FF7AB8',10);ctx.fillStyle='#FF7AB8';
      ctx.beginPath();ctx.arc(tp[0],tp[1],4,0,TAU);ctx.fill();noGlow(ctx);
      tag(ctx,tp[0]+30,tp[1]+16,'T′ 实像在下方 → 上下也颠倒','#FF7AB8');
    }
  }
  /* ===== 水体 ===== */
  const waterA=lensType==='cyl'?(cupMode==='empty'?0.04:0.16):0.13;
  if(lensType==='cyl'){
    const seg=22, yTop=1.25, yBot=cupMode==='half'?0:-1.25;
    const ring=(yy)=>{const p=[];for(let i=0;i<seg;i++){const a=i/seg*TAU;p.push(P3(Math.cos(a)*R,yy,Math.sin(a)*R));}return p;};
    const rTop=ring(yTop), rBot=ring(yBot);
    for(let i=0;i<seg;i++){
      const j=(i+1)%seg;
      const mx=(Math.cos(i/seg*TAU)+Math.cos(j/seg*TAU))/2, mz=(Math.sin(i/seg*TAU)+Math.sin(j/seg*TAU))/2;
      const q=rotYP(V3(mx,0,mz),yaw3,pitch3);
      const facing=q.z>0;
      ctx.fillStyle=`rgba(0,229,160,${facing?waterA*.55:waterA})`;
      ctx.strokeStyle=`rgba(0,229,160,${facing?.5:.16})`;
      ctx.lineWidth=facing?1.2:.7;
      ctx.beginPath();ctx.moveTo(rBot[i][0],rBot[i][1]);ctx.lineTo(rBot[j][0],rBot[j][1]);
      ctx.lineTo(rTop[j][0],rTop[j][1]);ctx.lineTo(rTop[i][0],rTop[i][1]);ctx.closePath();
      ctx.fill();ctx.stroke();
    }
    ctx.strokeStyle='rgba(150,255,230,.75)';ctx.lineWidth=1.6;
    ctx.beginPath();rTop.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.stroke();
    ctx.beginPath();rBot.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.stroke();
    if(cupMode!=='empty'){
      ctx.fillStyle='rgba(0,229,160,.2)';
      ctx.beginPath();rTop.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();
    }
  }else{
    const c0=P3(0,0,0), e0=P3(R,0,0);
    const rr=Math.hypot(e0[0]-c0[0],e0[1]-c0[1]);
    const gg=ctx.createRadialGradient(c0[0]-rr*.3,c0[1]-rr*.3,rr*.1,c0[0],c0[1],rr);
    gg.addColorStop(0,'rgba(180,240,255,.30)');gg.addColorStop(.6,'rgba(0,229,160,.14)');gg.addColorStop(1,'rgba(0,120,110,.22)');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(c0[0],c0[1],rr,0,TAU);ctx.fill();
    glow(ctx,'#00E5A0',9);ctx.strokeStyle='rgba(0,229,160,.7)';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.arc(c0[0],c0[1],rr,0,TAU);ctx.stroke();noGlow(ctx);
    for(let la2=-2;la2<=2;la2++){
      const yy=la2*.5, r2=Math.sqrt(Math.max(0,R*R-yy*yy));
      ctx.strokeStyle='rgba(150,255,230,.28)';ctx.lineWidth=1;
      ctx.beginPath();
      for(let i=0;i<=40;i++){const a=i/40*TAU;const p=P3(Math.cos(a)*r2,yy,Math.sin(a)*r2);
        i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}
      ctx.stroke();
    }
  }
  /* ===== 眼睛（在实像之后，接收像点发散的光） ===== */
  const ep=P3(eyeX,yH,0);
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.ellipse(ep[0],ep[1],15,9,0,0,TAU);ctx.stroke();
  glow(ctx,'#00F0FF',9);ctx.fillStyle='#00F0FF';
  ctx.beginPath();ctx.arc(ep[0],ep[1],4.6,0,TAU);ctx.fill();noGlow(ctx);
  text(ctx,'眼（瞳孔）',ep[0],ep[1]+22,{size:10.5,color:'rgba(255,255,255,.65)',align:'center'});
  /* 光子（正向流动：景物 → 眼睛） */
  photons3(ctx,photonSegs.map(seg=>seg.map(p=>{const q=P3(p[0],p[1],p[2]);return [q[0],q[1]];})),t,'#FFF3B0');
  /* 截面标签牌 */
  const lblV=P3(-2.3,1.8,0);
  tag(ctx,lblV[0],lblV[1],lensType==='cyl'
    ?(cupMode==='full'?'竖直截面：平行平板 → 方向不变（微小平移）→ 上下不变':'竖直截面：水面上方是空气 → 直进')
    :'竖直截面：球面 → 折射会聚交叉 → 上下也颠倒','#8BE9FD');
  const lblH=P3(1.2,-1.78,0);
  tag(ctx,lblH[0],lblH[1],noWater?'水平截面：空气中直进（水面以下才折射翻转）':'水平截面：圆界面两次折射 → 交叉成实像 → 左右颠倒','#FFD34D');
  /* 结论牌 */
  const beyondF=D>fR;
  const verdict=cupMode==='empty'?'空杯：无透镜作用，景物原样'
    :lensType==='ball'?(beyondF?'🔮 球面凸透镜（u>f）：上下左右【全颠倒】':'🔮 球面凸透镜（u<f）：正立放大虚像')
    :(beyondF?'✔ 圆柱水杯（u>f）：左右颠倒 · 上下不变':'✔ 圆柱水杯（u<f）：正立放大（水平虚像）');
  ctx.fillStyle='rgba(18,18,26,.92)';roundRect(ctx,16,h-46,w-32,34,10);ctx.fill();
  ctx.strokeStyle=lensType==='ball'?'#FF7AB8':'#00E5A0';ctx.lineWidth=1.2;ctx.stroke();
  text(ctx,verdict,28,h-25,{size:12.5,color:lensType==='ball'?'#FF9AC8':'#00E5A0',weight:700});
  text(ctx,'◐ 拖拽旋转视角',18,20,{size:11,color:'rgba(255,255,255,.4)',align:'left'});
  /* 读数 */
  sec.querySelector('#roCup').innerHTML=`
    <div class="ro"><div class="k">焦距 f（平行光→像侧焦点）</div><div class="v">≈ ${fR.toFixed(2)} R</div></div>
    <div class="ro"><div class="k">物距 u ≈ D（主面在杯心）</div><div class="v">${(D/R).toFixed(1)} R</div></div>
    <div class="ro"><div class="k">u 与 f</div><div class="v" style="color:${beyondF?'#FF2D8F':'#00E5A0'}">${beyondF?'u > f → 倒立实像':'u < f → 正立虚像'}</div></div>
    <div class="ro"><div class="k">竖直方向</div><div class="v">${lensType==='cyl'?'恒不颠倒':'也会颠倒'}</div></div>`;
}
function tag(ctx,x,y,str,color){
  ctx.font='600 11px "PingFang SC","Microsoft YaHei",sans-serif';
  const tw=ctx.measureText(str).width;
  ctx.fillStyle='rgba(10,10,16,.82)';
  roundRect(ctx,x-tw/2-9,y-11,tw+18,22,11);ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=1;ctx.stroke();
  text(ctx,str,x,y,{size:11,color,align:'center',weight:600});
}
function photons3(ctx,lines,t,color){
  lines.forEach(seg=>{
    let total=0;const lens=[];
    for(let i=0;i<seg.length-1;i++){const l=Math.hypot(seg[i+1][0]-seg[i][0],seg[i+1][1]-seg[i][1]);lens.push(l);total+=l;}
    if(total<4)return;
    const n=Math.max(1,Math.round(total/110));
    for(let k=0;k<n;k++){
      let d=((t*110+k*total/n)%total), i=0;
      while(i<lens.length-1&&d>lens[i]){d-=lens[i];i++;}
      const r=d/lens[i];
      const x=seg[i][0]+(seg[i+1][0]-seg[i][0])*r, y=seg[i][1]+(seg[i+1][1]-seg[i][1])*r;
      glow(ctx,color,8);ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(x,y,2,0,TAU);ctx.fill();noGlow(ctx);
    }
  });
}
/* ---------- 全真视效窗（沿用逐光线折射） ---------- */
const VW=2000, VH=760;
let viewOff=null;
function sceneOff(){
  if(viewOff)return viewOff;
  viewOff=document.createElement('canvas');viewOff.width=VW;viewOff.height=VH;
  const g=viewOff.getContext('2d');
  const sky=g.createLinearGradient(0,0,0,VH*.7);
  sky.addColorStop(0,'#4a6a9e');sky.addColorStop(.7,'#9db8d8');sky.addColorStop(1,'#e8d9b0');
  g.fillStyle=sky;g.fillRect(0,0,VW,VH);
  g.fillStyle='#5d7a4a';g.fillRect(0,VH*.68,VW,VH*.32);
  g.fillStyle='#4a6a3c';
  for(let x=0;x<VW;x+=90)g.fillRect(x,VH*.66+((x*7)%14),46,8);
  g.fillStyle='#c8b090';g.fillRect(VW*.18,VH*.42,VW*.1,VH*.26);
  g.fillStyle='#8a4a3a';g.beginPath();
  g.moveTo(VW*.16,VH*.42);g.lineTo(VW*.23,VH*.3);g.lineTo(VW*.3,VH*.42);g.fill();
  g.fillStyle='#5a3a2a';g.fillRect(VW*.215,VH*.55,VW*.03,VH*.13);
  g.fillStyle='#8ec8e8';g.fillRect(VW*.19,VH*.46,VW*.025,VH*.07);g.fillRect(VW*.255,VH*.46,VW*.025,VH*.07);
  g.fillStyle='#6a4a2a';g.fillRect(VW*.62,VH*.4,26,VH*.3);
  g.fillStyle='#3a7a3a';
  [[0,0],[46,-30],[-46,-24],[20,-60],[-20,-55]].forEach(p=>{
    g.beginPath();g.ellipse(VW*.62+13+p[0],VH*.4+p[1],52,40,0,0,TAU);g.fill();});
  [[.42,'#d83a3a'],[.82,'#2a5ad8']].forEach(([px,col])=>{
    g.fillStyle='#7a6a4a';g.fillRect(VW*px-4,VH*.5,8,VH*.18);
    g.fillStyle='#f5f0e0';g.fillRect(VW*px-58,VH*.3,116,110);
    g.strokeStyle='#999';g.lineWidth=3;g.strokeRect(VW*px-58,VH*.3,116,110);
    g.fillStyle=col;g.font='900 92px Arial';g.textAlign='center';g.textBaseline='middle';
    g.fillText('F',VW*px,VH*.3+60);
  });
  g.strokeStyle='rgba(40,50,70,.9)';g.lineWidth=3.4;
  for(let i=0;i<5;i++){const x=VW*.1+i*120,y=VH*.12+((i*53)%70);
    g.beginPath();g.arc(x-9,y,9,-.9,.4);g.stroke();g.beginPath();g.arc(x+9,y,9,Math.PI-.4,Math.PI+.9);g.stroke();}
  return viewOff;
}
function drawView(t){
  const {w,h,ctx}=fitCanvas(cvView);
  ctx.clearRect(0,0,w,h);
  const src=sceneOff();
  const R=60, D=+distS.value/10*R;
  const half=w/2;
  ctx.drawImage(src,0,0,VW,VH,0,0,half,h);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,half,26);
  text(ctx,'👁 眼睛直接看（参照）',12,14,{size:12,color:'#fff',weight:700});
  const x0=half+8, vw=w-x0;
  ctx.save();
  ctx.beginPath();ctx.rect(x0,0,vw,h);ctx.clip();
  const fov=.5;
  const eyeDist=R+1.35*R;
  const scaleX=VW/(2*D*Math.tan(fov));
  const waterlineY=cupMode==='half'?h*.5:(cupMode==='empty'?-1:h+1);
  for(let j=0;j<vw;j++){
    const phi=(j/vw-.5)*2*fov;
    let sx;
    if(cupMode==='empty'||lensType==='ball'&&false){sx=VW/2+Math.tan(phi)*D*scaleX;}
    else{
      const tr=traceCup(eyeDist,phi,0,R,D);
      if(tr.y===null){ctx.fillStyle='#0a0a11';ctx.fillRect(x0+j,0,1,h);continue;}
      sx=VW/2-tr.y*scaleX;
    }
    sx=Math.max(0,Math.min(VW-1,sx));
    if(cupMode==='half'){
      ctx.drawImage(src,VW/2+Math.tan(phi)*D*scaleX-0.5,0,1,VH*0.999,x0+j,0,1,waterlineY);
      ctx.drawImage(src,sx-0.5,0,1,VH,x0+j,waterlineY,1,h-waterlineY);
    }else{
      ctx.drawImage(src,sx-0.5,0,1,VH,x0+j,0,1,h);
    }
  }
  const edge=ctx.createLinearGradient(x0,0,x0+vw,0);
  edge.addColorStop(0,'rgba(150,255,230,.35)');edge.addColorStop(.06,'rgba(150,255,230,0)');
  edge.addColorStop(.94,'rgba(150,255,230,0)');edge.addColorStop(1,'rgba(150,255,230,.35)');
  ctx.fillStyle=edge;ctx.fillRect(x0,0,vw,h);
  if(cupMode==='half'){
    ctx.strokeStyle='rgba(150,255,230,.9)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x0,waterlineY);ctx.lineTo(x0+vw,waterlineY);ctx.stroke();
    text(ctx,'— 水面 —',x0+vw-52,waterlineY-10,{size:11,color:'rgba(150,255,230,.9)'});
  }
  ctx.restore();
  ctx.strokeStyle='rgba(0,229,160,.6)';ctx.lineWidth=2;ctx.strokeRect(x0,0,vw,h);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x0,0,vw,26);
  text(ctx,'🥛 透过水杯看（逐光线折射模拟）',x0+12,14,{size:12,color:'#00E5A0',weight:700});
}
makeLoop('z7',(t,dt)=>{drawCup3D(t,dt);drawView(t);});
})();
